<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 60" role="img" aria-label="Toise">
  <!-- Full lockup: two-tone "T" mark (anthracite bar, terracotta stem) +
       wordmark. Transparent background. The wordmark uses the system UI font
       to match the site and avoid any external font dependency. -->
  <rect x="9" y="10" width="46" height="10" rx="3" fill="#1A1A1A"/>
  <rect x="26" y="10" width="12" height="36" rx="3" fill="#B8593D"/>
  <text x="66" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="700" letter-spacing="0.3" fill="#1A1A1A">Toise</text>
</svg>
