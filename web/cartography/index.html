<title>Toise — Graph</title>
<!--
  Example consumer of the Toise GraphQL API — NOT part of toise-server.

  THIS SURFACE IS ENGLISH-ONLY. It is shown in international demos, so every
  string that reaches the screen — button text, tooltips, counters, legends —
  stays in English. Comments may be in any language; anything a viewer can read
  may not.
  A standalone, dependency-free page (vis-network from a CDN) that loads the
  entity/relation graph with a query and then streams live changes over the
  entityChanged / relationChanged subscriptions. See README.md.

  Endpoint: defaults to a same-origin /graphql (serve this file behind the same
  proxy as toise-server). Override with ?api=https://host:port/graphql.

  Labels: a header toggle switches node labels between human-readable names
  (host.name, service.name, interface.name, the listener's process, …) and the raw
  technical identities. The choice is remembered (localStorage).

  Inferred links (off by default): an optional overlay of dashed, derived edges that
  link each IP-bearing entity (a listener's bind address, an endpoint's
  server.address, a route's next hop) to the network.address node for that IP. The
  engine stores facts only and never merges by heuristic, so these are NOT stored
  relations — they are a consumer-side reading aid. Host-local addresses that are not
  global join points are skipped: wildcard, loopback, link-local, and the Docker
  default bridge (172.17.0.0/16) — the same 172.17.0.1 exists on every host.

  Attribute filter: the header "attr" box highlights nodes whose identity/attributes
  match (a key, key=value, or a free substring) and dims the rest — a read-time view
  over the fetched data, so it works on whatever attributes producers emit.

  Timeline: the time travel is PRESENT in this build -- the relay exposes an
  asOf argument on entities, relations and graphScope, and the slider tlAt
  picks the instant on a five-minute grid, with tlLive returning to now and
  tlAtLabel showing the served instant against the server's horizon.
  What REMAINS as before is the change-density heatmap with its ruler and a
  window selector, all fed by recentChanges, which reads the present.
  LIVE (or drag back to now) to resume streaming. Live updates are ignored while
  browsing history so the past view stays put; a request before the retention horizon
  is refused and surfaced.

  Dome (360): a header toggle wraps the SAME layout around the viewer — distance
  from the centre of the graph becomes the angle away from straight ahead, so the
  outskirts sit behind your shoulders and you turn to see them. Drag to turn,
  scroll to change the field of view. It is a second view of one layout, not a
  second layout, and every star's size, colour, opacity and label is read back
  from the chart's own data. The projection is gnomonic, so it cannot show the
  whole sky at once; the flat chart remains the view that can.

  Layout: the force simulation runs only until it stabilises, then FREEZES, so the
  graph settles once instead of drifting forever. A structural change (a node/edge
  added or removed) re-runs it briefly and re-freezes; attribute-only heartbeats never
  move it. "relayout" re-runs the layout on demand.

  Multi-tenancy (ADR 0025): pick a tenant with ?tenant=<id>. It is sent as the
  X-Scope-OrgID header on queries; for the live subscription (a browser can't set a
  header on a WebSocket) it is appended as ?tenant=, which a translating proxy maps
  to the header. Absent => the server's "default" tenant.
-->

<script>
// Fixed endpoint: the portal relay owns the GraphQL documents and only accepts
// persisted-query ids, so a page-side override would just point this elsewhere.
// The tenant is imposed by the relay from the portal session, never by the page.
const API='/cartography/graphql';
function gqlHeaders(){ return {'Content-Type':'application/json'}; }

const EMBEDDED = window.parent !== window;

function sendContext(msg) {
  if (!EMBEDDED) return;
  try {
    // Explicit origin only: '*' would leak context to any embedding page.
    // A refusing parent must never break the embedded page.
    window.parent.postMessage(msg, location.origin);
  } catch (e) {}
}

function publishView() {
  let value, label;
  if (activeView === 'vNet')       { value = 'network';      label = 'Network'; }
  else if (activeView === 'vHosts') { value = 'machines';     label = 'Machines'; }
  else if (activeView === 'vApps')  { value = 'applications'; label = 'Applications'; }
  else                              { value = 'all';          label = 'Whole map'; }
  sendContext({ v: 1, type: 'context.view', payload: { kind: 'view', value: value, label: label } });
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Stellar colour runs blue-white through white and yellow to orange and red.
// Types take a class in order of first sight — the same stable-by-arrival rule
// the flat palette used, so a type keeps its colour across a reload.
const PALETTE=["#a8c2ff","#e9efff","#fbf4dd","#ffdf8f","#ffb46a","#ff8d6d","#8fa7ff","#d7b6ff","#bcd2ff","#ffe9b8","#ffc9a6","#c7ddff"];
// Internal type names are the model's vocabulary, not a reader's. A fallback to the
// raw name keeps an unknown type visible rather than silently unlabelled.
const TYPE_LABEL={
  host:'Host', 'compute.vm':'Virtual machine', container:'Container', pod:'Pod',
  'service.instance':'Service', 'service.listener':'Listening port', 'host.service':'System unit',
  db:'Database', 'network.interface':'Interface', 'network.address':'IP address',
  'network.segment':'Network', 'network.device':'Network device', 'network.endpoint':'Endpoint',
  'network.route':'Route', 'network.neighbor':'Neighbour', 'cloud.resource':'Cloud resource',
  process:'Process'
};
const typeLabel=t=>TYPE_LABEL[t]||t;
const typeColor={};
const colorFor=t=>{ if(!(t in typeColor)) typeColor[t]=PALETTE[Object.keys(typeColor).length%PALETTE.length]; return typeColor[t]; };
const hidden=new Set();
// Declared with the other state, not next to the layer buttons: rebuild() can run
// before the wiring executes, and a temporal-dead-zone error there would blank the
// page on load.
let presentTypes=new Set();
const ENT={}, REL={};
const nodes=new vis.DataSet(), edges=new vis.DataSet();
let fitted=false;
let fitAfterSettle = false; // requested, not automatic: auto-fit would steal the reader's manual zoom/pan

const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
  // The library's pre-computed layout was measured as the cause of the blank
  // white canvas on a large fleet, so it is disabled here.
  layout:{improvedLayout:false},
  nodes:{shape:'dot',size:14,font:{color:'#c3d1ea',face:"'Geist Sans', system-ui, sans-serif",size:11,strokeWidth:0,vadjust:4},borderWidth:0},
  edges:{color:{color:'rgba(150,178,235,0.26)',highlight:'#cfe0ff',hover:'#cfe0ff'},
         font:{color:'#6f80a0',size:10,strokeWidth:3,strokeColor:'#05070f',align:'middle'},
         arrows:{to:{enabled:true,scaleFactor:.3}},smooth:false,width:0.9,selectionWidth:1.6},
  physics:{barnesHut:{gravitationalConstant:-26000,centralGravity:0.12,springLength:200,springConstant:.03,damping:.6,avoidOverlap:0.2},stabilization:{iterations:1500}},
  interaction:{hover:true,tooltipDelay:120,multiselect:true}
});

// --- the field ----------------------------------------------------------
// Unnamed stars behind the data, drawn in GRAPH coordinates so they pan and
// zoom with the chart instead of sliding behind it. Seeded, so it is the same
// sky on every reload: a chart whose background shuffles reads as noise.
const FIELD=(function(){ let s=20261029; const out=[];
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<460;i++) out.push({x:(rnd()-0.5)*3400,y:(rnd()-0.5)*2600,
                                   r:0.4+rnd()*1.35,a:0.10+rnd()*0.5});
  return out; })();
net.on('beforeDrawing',ctx=>{ for(const f of FIELD){

  ctx.fillStyle='rgba(205,222,255,'+f.a.toFixed(2)+')'; ctx.fill(); } });

// --- layout settling: run the force simulation only until it stabilises, then
// FREEZE it, so the graph stops drifting instead of jittering indefinitely (the
// "wait for it to stop moving" annoyance). A structural change (a node or edge
// added/removed) re-runs the simulation for a bounded window and freezes again;
// attribute-only updates (heartbeats) never disturb the layout. "relayout" re-runs
// it on demand.
let freezeTimer=null;
function freeze(){ clearTimeout(freezeTimer); freezeTimer=null; net.setOptions({physics:{enabled:false}}); }

  freezeTimer=setTimeout(()=>{ freeze(); if(fitAfterSettle){ fitAfterSettle=false; try{ net.fit({animation:false}); }catch(e){} } }, ms); }
net.on('stabilizationIterationsDone',()=>{ freeze();   // layout done -> freeze, fit, reveal
  if(!fitted) return;   // the empty-graph init pass, before any data — nothing to reveal yet
  try{ net.fit({animation:false}); }catch(_){}

// Node labels: a toggle between human-readable names and raw technical ids.
// Identities are opaque (host.id is a UUID, a listener is <host-uuid>:port); name
// mode resolves the readable name each entity type actually carries. The tooltip
// always shows the full identity, so names never hide the precise id.
let labelMode=localStorage.getItem('toise_viz_labels')||'name';   // 'name' | 'id'
const attrsOf=n=>Object.fromEntries((n.attributes||[]).map(a=>[a.key,a.value]));
const identOf=n=>Object.fromEntries((n.identity||[]).map(a=>[a.key,a.value]));
function hostNameById(hid){ for(const e of Object.values(ENT)){ if(e.type==='host' && identOf(e)['host.id']===hid) return attrsOf(e)['host.name']; } return null; }

// --- inferred links (a derived overlay; ON by default) ----------------------
// The engine stores facts only and never merges by heuristic, so an IP carried as
// a plain attribute (a listener's bind address, an endpoint's server.address, a
// route's next hop) is NOT linked to the network.address entity for that IP — the
// same address ends up smeared across disconnected nodes. This overlay draws a
// dashed edge from each IP-bearing entity to the matching network.address node, so
// the graph reads as connected. These edges are DERIVED, not stored relations.
// ON unless the reader turned it off. A graph database is used precisely so that
// relations can be traversed, and the derived links are often the only thing
// joining two halves of a real chain — a gateway's outbound dependency and the
// dashboard listening behind it are stored as an endpoint and a listener that no
// stored edge connects. Defaulting this overlay off produced a graph that looked
// like it had no links at all, and a reader has no way to tell that apart from a
// graph that genuinely has none. Off by default hid the answer; the toggle stays
// for whoever wants only stored facts.
let inferred=localStorage.getItem('toise_viz_inferred')!=='0';
const IPV4=/(?:^|[^0-9.])(\d{1,3}(?:\.\d{1,3}){3})(?![0-9.])/g;
// Host-local / non-routable addresses are NOT global join points: the same IP
// exists independently on every host, so linking through it smears unrelated nodes
// together (e.g. containers on different machines via the Docker bridge gateway
// 172.17.0.1). Skip wildcard, loopback, link-local (RFC 3927), and the Docker
// default bridge. (Other RFC 1918 ranges can be legitimately routable, so the real
// fix for a host-local address is producer-side — don't emit it as a shared entity.)
// Same list as the producer contract's "A bare IP is not a globally unique
// identity" rule, which is normative; this overlay only has to agree with it.
const notJoinable=ip=> !ip || ip==='0.0.0.0' || ip.startsWith('127.') || ip==='::' || ip==='::1'
  || ip.startsWith('169.254.')   // link-local, IPv4 (RFC 3927)
  || /^fe[89ab]/i.test(ip)       // link-local, IPv6 (fe80::/10) — scoped to one link
  || ip.startsWith('172.17.');   // Docker default bridge — same gateway on every host
function inferredEdges(visible){
  const addrByIp={};
  for(const n of Object.values(ENT)){ if(n.type==='network.address'){ const ip=identOf(n)['network.address']; if(ip) addrByIp[ip]=n.id; } }
  const real=new Set(); for(const r of Object.values(REL)){ real.add(r.fromId+'|'+r.toId); real.add(r.toId+'|'+r.fromId); }
  const out=[], seen=new Set();
  for(const n of Object.values(ENT)){
    if(n.type==='network.address' || !visible.has(n.id)) continue;
    const blob=[...(n.identity||[]),...(n.attributes||[])].map(a=>a.value).join(' ');
    const ips=new Set(); let m; IPV4.lastIndex=0; while((m=IPV4.exec(blob))) ips.add(m[1]);
    for(const ip of ips){ if(notJoinable(ip)) continue; const aid=addrByIp[ip];
      if(!aid || aid===n.id || !visible.has(aid) || real.has(n.id+'|'+aid)) continue;
      const id='inf:'+n.id+'~'+aid; if(seen.has(id)) continue; seen.add(id);
      out.push({id,from:n.id,to:aid,label:'≈',dashes:true,arrows:'',
                color:{color:'#e8b06a',opacity:0.65},font:{color:'#e8b06a',size:9},smooth:false}); }
  }
  return out;
}

// --- attribute filter: highlight matching nodes, dim the rest (exploratory) --
// Type a key (matches nodes carrying it), key=value (exact), or a free substring
// (matched against keys and values). It is a read-time view over the data already
// fetched — no query change — so it works on whatever attributes producers emit.
let attrQuery='', filterOnly=false;
// edges: shown faint / with type labels / hidden. Default hides edges on a big graph
// (they're an unreadable web) unless the user set a preference; small graphs keep them.
const edgePref=localStorage.getItem('toise_viz_edges');   // 'on' | 'labels' | 'off' | null
let showEdges=edgePref!=='off', edgeLabels=edgePref==='labels';

  const q=attrQuery.trim().toLowerCase(); if(!q) return true;
  const kvs=[...(n.identity||[]),...(n.attributes||[])];
  const eq=q.indexOf('=');
  if(eq>=0){ const k=q.slice(0,eq).trim(), v=q.slice(eq+1).trim();
    return kvs.some(a=>a.key.toLowerCase()===k && (v===''||String(a.value).toLowerCase()===v)); }

function idLabel(n){

// The readable name is Toise's to decide, not this page's. `displayName` is a
// contract field computed from a per-type registry, so asking for it is how a
// consumer gets the same name every other consumer shows.
//
// This page used to reimplement that registry, one case per type, and the copy
// had drifted where it mattered most: a network.device was labelled from its
// IDENTITY with the rung prefix stripped, so a switch reporting sysName
// "1000-5510HI-SR08" was drawn as "800063a280ec9b8b46032a00000001". The
// producer emitted sys.name, the server resolved it, and this page threw it
// away. Every other case merely duplicated what the server already returns.
//
// The one case kept is service.listener, and only because it composes something
// the registry does not: the port, and the host behind the endpoint's uuid. That
// is an enrichment, not a second opinion about the name.
function nameLabel(n){
  const A=attrsOf(n), I=identOf(n);

    if(proc) return proc+(m?' '+m[2]:'');
    return m?((hostNameById(m[1])||'')+':'+m[2]):ep;
  }

  const nk=Object.keys(A).find(k=>/(^|\.)name$/i.test(k))||Object.keys(I).find(k=>/(^|\.)name$/i.test(k));

function labelOf(n){ return (labelMode==='name'?nameLabel(n):idLabel(n))||n.id.slice(0,6); }
function titleOf(n){ const I=(n.identity||[]).map(a=>a.key+'='+a.value).join(', '); return n.type+(I?' · '+I:'')+' · '+n.id; }

// --- folding: a graph of 546 entities is unreadable at any stroke weight ------
// Measured on a real bench: 88% of entities are the CHILD of a single owner —
// an interface belongs to a device, a service runs on a host, a route belongs to
// a machine. Folding children into their owner takes 546 nodes to 68, which is
// the only change that alters the order of magnitude. Everything else (edge
// weight, node size) only reads well once that is done.
//
// CHILD_SIDE says, for each relation type, which END is the child. Only these
// relations nest; everything else is a peer link and is aggregated, never folded.
const CHILD_SIDE={has_interface:'to',has_route:'to',has_segment:'to',runs_on:'from',bound_to:'from',listens_on:'from'};
let folded=localStorage.getItem('toise_viz_folded')!=='0';   // ON by default: the dense case is the normal case
let foldBeforeView = null; // null means "nothing retained", since false is a legitimate value of folded
const expanded=new Set();                                     // owners the reader opened, by id
const expandedKinds=new Set();                                // "<owner>\u0000<type>" the reader opened past the kind step

// Opening an owner used to hand back every child at once: double-click a host
// holding 357 services and you got 357 nodes — the hairball you folded to escape.
// Measured at two customers: 367 entities to 3 drawn nodes, 548 to 6, because 97%
// of their relations are a single runs_on. From an unreadable hairball to a nearly
// empty graph, and both useless.
//
// So expansion has three levels, not two: owner -> kinds -> things. A switch with
// twelve ports opens to "12 network.interface" and then to the ports, which costs
// one click and loses nothing. A host with 357 services opens to
// "357 service.instance" and STOPS there until the reader narrows it.
//
// A per-type fold switch was checked against those numbers first and rejected: on
// both estates the density IS one type, so folding everything except services
// leaves 360 of 367 nodes. A knob that does nothing on the shape that needs it.
const KIND='\u0000kind\u0000';

// reader is handed to the attribute filter instead. 60 is above any real port or
// interface count (the cases where opening everything is right) and far below the
// densities that produced this issue.

// seconds, so the drawing is capped and the cap is stated on screen.
const MAX_DRAWN=2500;
const KIND_OPEN_MAX=60;

// ownerOf maps a child to its owner, rebuilt whenever relations change.
let OWNER={};
function computeOwners(){
  OWNER={};

    const side=CHILD_SIDE[r.type]; if(!side) continue;
    const child=side==='from'?r.fromId:r.toId, owner=side==='from'?r.toId:r.fromId;
    if(child!==owner && !OWNER[child]) OWNER[child]=owner;   // first owner wins; a second would be a modelling error, not ours to resolve
  }
}
// repOf: the node actually drawn for x. Walk up while the parent is folded shut;
// stop at the first ancestor the reader opened, or at the top.
function repOf(id,guard){
  if(!folded) return id;
  const seen=guard||new Set();
  let cur=id;
  for(;;){
    if(seen.has(cur)) return cur;   // cycle guard: a malformed graph must not hang the page
    seen.add(cur);
    const up=OWNER[cur];
    if(!up || !ENT[up]) return cur;
    if(expanded.has(up)){
      // The owner is open. Its children are represented by one node per KIND
      // until the reader opens that kind too — the middle of the three levels.
      const t=ENT[cur]?ENT[cur].type:'';
      return (t && !expandedKinds.has(up+'\u0000'+t)) ? kindId(up,t) : cur;
    }
    cur=up;
  }
}
// What a folded node stands for, BY TYPE, so the badge says what is inside and
// not only how much. Measured at a customer: an estate that is one host and 357
// services, 97% of its relations a single runs_on. Folded, that is three nodes,
// and a bare "(357)" reads as an empty graph. "(357 service.instance)" reads as
// an accurate summary of an estate that really is shaped that way.
function foldedInside(){
  const n={};
  if(!folded) return n;
  for(const id of Object.keys(ENT)){
    const r=repOf(id); if(r===id) continue;
    const by=(n[r]=n[r]||{}); const t=ENT[id].type; by[t]=(by[t]||0)+1;
  }
  return n;
}
// "(357 service.instance)" for one kind, "(37 service.instance, 1 network.interface)"
// for two, "+N" past that so a label stays a label. Full type names, never
// abbreviated: a shortened type is a type the reader has to guess.
function badge(by){
  if(!by) return '';
  const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  return '  ('+e.slice(0,2).map(([t,c])=>c+' '+typeLabel(t)).join(', ')+(e.length>2?', +'+(e.length-2):'')+')';
}
function badgeTotal(by){ return by?Object.values(by).reduce((a,b)=>a+b,0):0; }
function badgeFull(by){ return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,c])=>c+' '+typeLabel(t)).join(', '); }

// kindGroups counts what each kind node stands for. Built from repOf, so it
// cannot disagree with what is actually drawn.
function kindGroups(){
  const g={};
  if(!folded) return g;
  for(const id of Object.keys(ENT)){
    if(hidden.has(ENT[id].type)) continue;
    const r=repOf(id); if(!isKind(r)) continue;
    const k=kindParts(r);
    const e=(g[r]=g[r]||{owner:k.owner,type:k.type,n:0,cited:0});
    e.n++;

    // answer citing it looks like an answer citing nothing.
    if(CITED.size&&CITED.has(ENT[id].identityFingerprint)) e.cited++;
  }

// say shows a transient line in the toolbar. Not an alert(): a modal dialog
// blocks the page and the layout animation behind it.
let hintTimer=null;
function say(msg){
  const h=document.getElementById('hint'); if(!h) return;
  h.textContent='\u00b7 '+msg; h.style.color='var(--warn)';
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ h.textContent=''; h.style.color=''; },6000);
}

// Beyond a thousand nodes, extra iterations cost seconds of blocked main thread
// without making the layout more readable.
// The size decides only at the FIRST layout. Every later one just relaxes nodes
// that are already placed, so it has to be fast rather than pretty: measured in
// production, a view change paid 1500 iterations and froze the tab for 19 s on a
// park of 2 330 entities, where 150 iterations bring it to 0.8 s.
function stabilizationFor(drawnCount,firstLayout){
  if(!firstLayout) return 150;
  return drawnCount>1000?200:1500;
}
// `fmt` is already taken by a date formatter in another scope, so this gets its own name.
function fmtCount(n){ return (typeof n==='number' && isFinite(n)) ? n.toLocaleString() : n; }

// A reader who sees a subset after a successful load believes they see the whole
// set, so the map must state what it omits and how to reach it.
let narrowedOnce = false;

function announceThenDefer(fn){
  const err = document.getElementById('err');   // an existing error message outranks the drawing notice
  if (err && err.textContent === '') err.textContent = 'Drawing the map for ' + fmtCount(Object.keys(ENT).length) + ' entities…';
  // The redraw is synchronous: once it returns the freeze is over, so the notice
  // is cleared here rather than from a layout event settle() may never fire.
  setTimeout(function(){
    try { fn(); }
    finally { if (err && err.textContent.startsWith('Drawing ')) err.textContent = ''; }
  }, 0);
}

function openNarrowOnLargeEstate() {
  // Large estates freeze the tab on first paint, so we open on the machines layer only.
  // The notice needs its own element because capStat is rewritten on every redraw.
  // It must run once per page load, otherwise every redraw would re-narrow a view the reader just left.
  if (narrowedOnce) return false;
  if (activeView !== null) return false;
  if (Object.keys(ENT).length <= 5000) return false;
  narrowedOnce = true;
  applyView('vHosts');
  const cap = document.getElementById('narrowStat');
  if (cap) {
    cap.textContent = 'Map opened on machines only because the estate is large (' + fmtCount(Object.keys(ENT).length) + ' entities). ';
    const btn = document.createElement('button');
    btn.className = 'retry';
    btn.textContent = 'Show everything';
    // applyView announces, defers and clears this notice itself, so there is
    // nothing to capture here and nothing to repeat.
    btn.addEventListener('click', function(){ if (activeView) applyView(activeView); });
    cap.appendChild(btn);
  }
  // applyView has already redrawn; the caller must not redraw again.
  return true;
}

function sayCap(drawn,total,criterion){
  const el=document.getElementById('capStat'); if(!el) return;
  el.textContent = drawn>=total ? '' :
    'Showing the '+drawn+' '+criterion+' of '+total+' entities. Search or filter to see the others.';
}

let rebuildTimer=null;
function scheduleRebuild(){ if(rebuildTimer) return; rebuildTimer=setTimeout(()=>{rebuildTimer=null;rebuild();},250); }
function rebuild(){
  computeOwners();
  const prevNodeIds=new Set(nodes.getIds());
  const allTypes=new Set(), nodeIds=new Set(), nUp=[];
  syncLayerView();   // re-apply the chosen view to whatever types exist now
  const q=attrQuery.trim(); let matched=0;
  // Filled before the node loop below, not inside kindGroups() further down: that one
  // runs AFTER this loop, so the set would be empty on the first pass and correct on
  // the next -- wrong intermittently, which is worse than wrong.
  // #567: the fold check used to return before the filter ran, so a folded child was
  // never tested. The page then reported "0 match", which reads as "this estate has
  // no eth0" -- an absence produced by the reader's own bounds, stated as a fact about
  // the world. Measured: 0 matches folded against 54 unfolded, same graph, same query.
  MATCH_OWNERS.clear(); foldedMatches=0;

    const n=ENT[id]; if(hidden.has(n.type)) continue;
    const r=repOf(id); if(r===id) continue;          // drawn in its own right
    if(!attrMatch(n)) continue;

  CITED_OWNERS.clear();
  if(CITED.size) for(const id of Object.keys(ENT)){
    if(!CITED.has(ENT[id].identityFingerprint)) continue;
    const r=repOf(id); if(r===id) continue;      // drawn in its own right, nothing to carry
    // With nothing expanded -- the default -- repOf returns the OWNER, not a kind
    // node: kinds only appear once a reader opens an owner. An earlier version only
    // handled the kind case, so by default this set stayed empty and no owner lit up.
    CITED_OWNERS.add(isKind(r)?kindParts(r).owner:r);
  }
  const firstLoad=!fitted;   // scatter new nodes on the very first layout so stabilisation spreads them
  const inside=foldedInside();
  let hiddenByFold=0;
  // Degree drives node size: dist1 with eight links must read as bigger than acc3
  // with one, so the shape of the network is legible before a single label is.
  const degree={};
  Object.values(REL).forEach(r=>{ const a=repOf(r.fromId), b=repOf(r.toId);
    if(a!==b){ degree[a]=(degree[a]||0)+1; degree[b]=(degree[b]||0)+1; } });
  // Phase 1: census every candidate with the exact same exclusions, in the same order.
  const candidates=[];
  let matchCandidates=0;
  Object.values(ENT).forEach(n=>{ allTypes.add(n.type); if(hidden.has(n.type)) return;
    if(repOf(n.id)!==n.id){ hiddenByFold++; return; }            // folded into an owner
    const ok=attrMatch(n); if(q && ok) matchCandidates++; if(q && !ok && !MATCH_OWNERS.has(n.id) && filterOnly) return;   // "only" mode hides non-matching, but not an owner hiding a match
    candidates.push({n, d:degree[n.id]||0}); });

  // before what the algorithm deems important (degree); id breaks ties so the map
  // stays identical from one render to the next.
  let cappedTotal=candidates.length, cappedOut=0;
  candidates.sort((a,b)=>{
    const am=q&&(attrMatch(a.n)||MATCH_OWNERS.has(a.n.id)), bm=q&&(attrMatch(b.n)||MATCH_OWNERS.has(b.n.id));
    if(am!==bm) return am?-1:1;
    const ac=CITED.size&&(CITED.has(a.n.identityFingerprint)||CITED_OWNERS.has(a.n.id)),
          bc=CITED.size&&(CITED.has(b.n.identityFingerprint)||CITED_OWNERS.has(b.n.id));
    if(ac!==bc) return ac?-1:1;
    if(a.d!==b.d) return b.d-a.d;

  let capCriterion='most connected';
  if(q) capCriterion='matching your search first, then the most connected';
  else if(CITED.size) capCriterion='cited first, then the most connected';
  sayCap(kept.length,cappedTotal,capCriterion);

  // Phase 2: build exactly what the old loop built, for the retained candidates only.
  kept.forEach(({n,d})=>{ const ok=attrMatch(n);
    nodeIds.add(n.id); if(q&&ok) matched++;
    const by=inside[n.id], k=badgeTotal(by);
    const node={id:n.id,label:labelOf(n)+badge(by),
              title:titleOf(n)+(k?('\nfolded inside: '+badgeFull(by)+'  \u2014 double-click to open'):''),
              opacity:n.deleted?0.45:((q&&!ok&&!MATCH_OWNERS.has(n.id))||(CITED.size&&!CITED.has(n.identityFingerprint)&&!CITED_OWNERS.has(n.id))?0.12:1),
              size:Math.min(30,5+Math.sqrt(d)*4.4)+(k?3:0),
              borderWidth:(n.deleted||k)?2:0,
              // the halo IS the star: a glow sized on the node, in its own colour,
              // so degree reads as brightness before any label is legible
              shadow:{enabled:true,color:colorFor(n.type),
                      size:Math.min(30,5+Math.sqrt(d)*4.4)*2.1,x:0,y:0},
              color:{background:colorFor(n.type),border:n.deleted?'#e8b06a':(k?'#6f80a0':'#05070f')}};
    if(firstLoad){ node.x=Math.random()*1600-800; node.y=Math.random()*1600-800; }
    nUp.push(node); });

  // than a thing, because that is what it is: "357 service.instance" is an
  // accurate summary where 357 circles are an unreadable one.
  const kinds=kindGroups();
  Object.entries(kinds).forEach(([id,k])=>{
    if(!nodeIds.has(k.owner)) return;            // its owner is filtered out; the kind has nothing to hang from
    nodeIds.add(id);
    const openable=k.n<=KIND_OPEN_MAX;
    nUp.push({id,label:k.n+' '+typeLabel(k.type),
      title:k.n+' '+typeLabel(k.type)+' inside '+(labelOf(ENT[k.owner])||k.owner)+'\n'+
            (openable?'double-click to open them':'too many to draw \u2014 narrow with the attribute filter instead, then open'),
      shape:'box', opacity:(CITED.size&&!k.cited)?0.12:1,
      size:Math.min(30,12+Math.sqrt(k.n)*2.4),
      borderWidth:openable?2:3,
      font:{color:'#d9e3f5',size:12},shadow:{enabled:false},
      color:{background:'#0a0e1c',border:openable?colorFor(k.type):'#e8b06a'}});
  });

  // the hint clears itself after six seconds while the layout blocks for ten or
  // more, so it vanished while the tab was still frozen.
  net.setOptions({physics:{stabilization:{iterations:stabilizationFor(nUp.length,!fitted)}}});
  nodes.update(nUp);
  // Say what is not shown. "0 match" was the lie; "0 shown, 54 inside folded nodes"
  // is the same number with its bound declared.
  const ms=document.getElementById('matchStat');
  if(!q){ ms.textContent=''; }
  else{
    const parts=['· '+matched+' shown'];
    if(foldedMatches>0) parts.push(foldedMatches+' inside folded nodes');
    if(matchCandidates-matched>0) parts.push((matchCandidates-matched)+' not drawn (cap)');
    ms.textContent=parts.join(', ');
  }
  const ai=document.getElementById('attr'); if(ai) ai.style.color=(q&&matched===0)?'var(--warn)':'var(--fg)';
  nodes.getIds().forEach(id=>{ if(!nodeIds.has(id)) nodes.remove(id); });
  const edgeIds=new Set(), eUp=[];
  let realCount=Object.values(REL).filter(r=>nodeIds.has(r.fromId)&&nodeIds.has(r.toId)).length;
  // Folded: several relations between two owners collapse into one drawn link,
  // thickened by how many it stands for. core1<->dist1 is one line, not two.
  const agg={};
  if(folded){
    realCount=0;
    Object.values(REL).forEach(r=>{ const a=repOf(r.fromId), b=repOf(r.toId);
      if(a===b || !nodeIds.has(a) || !nodeIds.has(b)) return;    // internal to one owner, or filtered out
      realCount++;
      const k=a+'\u0000'+b+'\u0000'+r.type;
      (agg[k]=agg[k]||{from:a,to:b,type:r.type,n:0}).n++; });
  }
  // Edges are ALWAYS added (the springs are what lay the graph out); "off" only makes
  // them invisible, so hiding them can't fling the nodes apart.
  const vis=showEdges?{color:{color:'rgba(150,178,235,0.26)',highlight:'#cfe0ff',hover:'#cfe0ff'},arrows:{to:{enabled:true,scaleFactor:.3}}}
                     :{color:{color:'rgba(0,0,0,0)',highlight:'rgba(0,0,0,0)',hover:'rgba(0,0,0,0)'},arrows:{to:{enabled:false}}};
  if(folded){
    Object.values(agg).forEach(a=>{ const id='agg:'+a.from+'|'+a.to+'|'+a.type; edgeIds.add(id);
      eUp.push({id,from:a.from,to:a.to,
        title:a.type+(a.n>1?' \u00d7'+a.n:''),
        label:(showEdges&&edgeLabels)?(a.type+(a.n>1?' \u00d7'+a.n:'')):undefined,
        width:showEdges?Math.min(6,1.4+Math.log2(a.n)*1.1):0.7, ...vis}); });
  } else {
    Object.values(REL).forEach(r=>{ if(nodeIds.has(r.fromId)&&nodeIds.has(r.toId)){ edgeIds.add(r.id);

  edges.getIds().forEach(id=>{ if(!edgeIds.has(id)) edges.remove(id); });

  // graph that simply has fewer things in it (#378).
  const nN=document.getElementById('nNodes');
  nN.textContent=nodeIds.size+(hiddenByFold?'  (+'+hiddenByFold+' folded)':'');
  nN.title=hiddenByFold?(hiddenByFold+' entities are folded into their owner \u2014 double-click a node to open it'):'';
  // Never let a hidden thing read as an absent thing: when edges are painted
  // invisible the canvas is indistinguishable from a graph with no relations, so
  // the counter says which of the two it is.
  const nE=document.getElementById('nEdges');
  // The count must match what is drawn. Saying only the stored edges while the
  // inferred overlay adds more to the screen is a wrong number, which is worse than
  // the jargon that was removed with it.
  // "0" is a true number and a false sentence: the relations are there, painted
  // transparent. A reader cannot tell that from a zero, so say which it is.
  nE.textContent=showEdges?edgeIds.size:'hidden';
  nE.style.color=showEdges?'':'var(--warn)';
  nE.title=showEdges?'':edgeIds.size+' relations are loaded and drawn transparent — the edges button turns them back on';
  presentTypes=allTypes; renderLayers();

  // The inferred-links legend is jargon for this audience; the overlay itself
  // stays available under the advanced controls.
  [...allTypes].sort().forEach(t=>{ const s=document.createElement('span'); s.className=hidden.has(t)?'off':'';
    s.innerHTML='<i style="background:'+colorFor(t)+'"></i>'+esc(typeLabel(t));
    s.onclick=()=>{ hidden.has(t)?hidden.delete(t):hidden.add(t); rebuild(); }; leg.appendChild(s); });

  // away), then freeze — never on a plain attribute/heartbeat update.
  let structural = nodeIds.size!==prevNodeIds.size;
  if(!structural){ for(const id of nodeIds){ if(!prevNodeIds.has(id)){ structural=true; break; } } }

  if(!fitted && nodeIds.size){ fitted=true; net.setOptions({physics:{enabled:true}});

// The server caps every connection page at 200 items, so a single
// entities(first:N) returns at most 200 — loading one page renders a
// truncated, inconsistent graph above ~200 entities (orphan nodes whose
// host lives on a later page). Follow pageInfo.hasNextPage / endCursor to
// fetch the whole connection before rebuilding (#209).
async function fetchAll(id){
  const nodes=[]; let after=null, guard=0;

      : { first: 200, ...(asOf ? { asOf } : {}) };
    const r=await fetch(API,{method:'POST',headers:gqlHeaders(),credentials:'same-origin',body:JSON.stringify({id,variables})});
    if(!r.ok) throw new Error(readFailureMessage(r.status,'read failed with status '+r.status));
    const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
    const c=j.data[id];

let SCOPE = null;

// Reads the served perimeter so the page can tell which park it is drawing and whether the load was truncated.
async function refreshScope(opts) {
  // The page sends persisted-document ids only, never a query: that is the
  // security property of this build, and the relay refuses anything else.
  //
  // Reading the scope in the present while the page shows a past instant
  // manufactures a gap that does not exist, so the read must follow the page.
  const asOf = asOfISO();
  try {
    const body = asOf !== null
      ? { id: 'graphScope', variables: { asOf } }
      : { id: 'graphScope' };
    const res = await fetch(API, {
      method: 'POST',
      headers: gqlHeaders(),
      credentials: 'same-origin',
      body: JSON.stringify(body)
    });
    const json = await res.json();
    // A known scope is better than none: only overwrite on a real payload.
    if (json && json.data && json.data.graphScope) {
      SCOPE = json.data.graphScope;
      scopeAsOf = asOf;
    }
  } catch (e) {
    // Keep the previous SCOPE on transient failure.
  }
  // The page trusts the instant it asked for, not the one the server echoes:
  // an omitted asOf would otherwise be read as "the present" and mask a stale scope.
  const serverMentionsAsOf = SCOPE != null && 'asOf' in SCOPE;
  // Compared as moments, not as text: the server reformats the instant it was
  // sent, so the same moment can come back spelled differently.
  let serverAgrees;
  if (!serverMentionsAsOf) {
    serverAgrees = true;
  } else if (SCOPE.asOf == null) {
    serverAgrees = asOf == null;
  } else {
    const echoed = Date.parse(SCOPE.asOf);
    // An unreadable echo is not a contradiction: the page's own record is the
    // authority here, and treating an unparsable stamp as a disagreement would
    // silently suppress detection without ever surfacing the mismatch.
    serverAgrees = Number.isNaN(echoed) ? true : echoed === Date.parse(asOf);
  }
  scopeDescribesInstant = SCOPE == null || (scopeAsOf === asOf && serverAgrees);
  sayScope();
  // Retention bounds do not depend on the read instant, but the scope counters do:
  // keep the scope for the timeline, refuse only the comparison inside sayIncomplete.
  // Quiet means "do not warn about data that has not landed yet", never "leave a
  // false claim standing", so a scope that cannot describe the instant still
  // reaches sayIncomplete — where it can only clear.
  if (!(opts && opts.quiet) || !scopeDescribesInstant) {
    sayIncomplete(Object.keys(ENT).length, Object.keys(REL).length);
  }
}

// Renders the scope line; no relative age from newestEvent because the page has no trustworthy clock.
function sayScope() {
  const el = document.getElementById('scopeStat');
  if (!el) return;

  const t = (SCOPE.tenantName && SCOPE.tenantName.length) ? SCOPE.tenantName : 'tenant ' + SCOPE.tenant;
  // The tenant name does not depend on the instant, so it survives; the counters
  // were read at another moment and would misstate this one.
  if (!scopeDescribesInstant) {
    el.textContent = t + ' · scope for this instant is not known';
  } else if (SCOPE.entities === 0) {
    el.textContent = 'Tenant ' + t + ': 0 entities, no events yet.';
  } else {
    // The relay is the one that filters, so it is the one that names what was
    // removed; the page only relays its notice and never invents its own.
    const notice = (typeof SCOPE.hiddenNotice === 'string' && SCOPE.hiddenNotice.length) ? ' · ' + SCOPE.hiddenNotice : '';
    el.textContent = t + ' · ' + SCOPE.entities + ' entities · ' + SCOPE.relations + ' relations' + notice;

// Warns only on a deficit; a surplus is ignored because the graph is live and a creation mid-read is not a truncation.
function sayIncomplete(loadedE, loadedR, bounds) {
  const el = document.getElementById('incompleteStat');
  if (!el) return;
  // Callers invoke this directly with their own bounds, so the guard must live
  // here: a check placed at the call site only protects callers that remember it.
  if (!scopeDescribesInstant) { el.textContent = ''; return; }
  // Comparing against every scope reading tolerates a creation or deletion that
  // happened during the load, without inventing an arbitrary tolerance threshold.
  if (bounds && bounds.length) {
    const minE = Math.min(...bounds.map(b => b.entities));
    const minR = Math.min(...bounds.map(b => b.relations));
    if (loadedE < minE || loadedR < minR) {
      el.textContent = 'Incomplete: entities ' + loadedE + ' of ' + minE + ', relations ' + loadedR + ' of ' + minR + ' loaded.';
    } else {
      el.textContent = '';
    }
    return;
  }
  if (!SCOPE) { el.textContent = ''; return; } // without a total, any claimed gap would be invented
  if (loadedE < SCOPE.entities || loadedR < SCOPE.relations) {
    el.textContent = 'Incomplete: entities ' + loadedE + ' of ' + SCOPE.entities + ', relations ' + loadedR + ' of ' + SCOPE.relations + ' loaded.';
  } else {
    el.textContent = '';
  }
}

async function loadFull() {
  // Callers invoke this directly without checking the flag, so the guard belongs here.
  if (loading) return false;
  loading = true;
  const err = document.getElementById('err'); err.textContent = '';
  try {
    // Quiet on the way in too: at this point the maps are empty, so comparing
    // would claim "0 of N" until the data lands.
    await refreshScope({ quiet: true });
    const first = SCOPE ? { entities: SCOPE.entities, relations: SCOPE.relations } : null;
    const [ents, rels] = await Promise.all([fetchAll('entities'), fetchAll('relations')]);
    for (const k in ENT) delete ENT[k]; for (const k in REL) delete REL[k];
    ents.forEach(n => ENT[n.id] = n);
    rels.forEach(n => REL[n.id] = n);
    // Before the first paint, not after: narrowing afterwards would pay the very
    // layout cost it exists to avoid. applyView redraws on its own, so narrowing
    // REPLACES this first rebuild rather than adding a second full node build.
    if (!openNarrowOnLargeEstate()) rebuild();
    await refreshScope({ quiet: true });
    const second = SCOPE ? { entities: SCOPE.entities, relations: SCOPE.relations } : null;
    const bounds = [first, second].filter(Boolean);
    sayIncomplete(Object.keys(ENT).length, Object.keys(REL).length, bounds.length ? bounds : undefined);
  } catch (e) {
    err.textContent = '⚠ ' + e.message;
    noteLoadFailure();
    return false;
  } finally {
    loading = false;
  }
  return true;
}

const GRID_MS = 300000; // Producers observe in ticks of a few minutes; a finer grid would offer precision the data does not have.
let asOfMs = null; // null means "the present"
let scopeDescribesInstant = true; // Scope counters are only valid for the instant the scope itself describes.
let scopeAsOf = null; // The page remembers the instant it asked for, because an absent field in the response is indistinguishable from the present.

function snapToGrid(ms) {
  return Math.floor(ms / GRID_MS) * GRID_MS;
}

// Rounding down at the lower bound would push the value outside the window.
function snapWithin(ms, lo, hi) {
  let v = snapToGrid(ms);
  if (v < lo) v += GRID_MS;
  if (v > hi) v -= GRID_MS;
  return v;
}

function asOfISO() {
  if (asOfMs === null) return null;
  return new Date(asOfMs).toISOString().replace(/\.\d{3}Z$/, 'Z');
}

function horizonMs() {
  if (SCOPE && SCOPE.oldestAnswerable) {
    const t = Date.parse(SCOPE.oldestAnswerable);
    return Number.isNaN(t) ? null : t;
  }
  return null;
}

function withinHorizon(ms) {
  const h = horizonMs();
  if (h === null) return false; // unknown horizon: never offer a journey whose bound we don't know
  return ms >= h && ms <= Date.now();
}

let replaying = false;

async function goToInstant(ms) {
  if (replaying) {
    say('A past read is already in flight…');
    return;
  }
  if (ms === 'unknown-horizon') {
    say('The readable window is not known for that instant.');
    return;
  }
  const now = Date.now();
  const h = horizonMs();
  const aligned = ms === null ? null : snapWithin(ms, h == null ? -Infinity : h, now);
  if (aligned !== null && !withinHorizon(aligned)) {
    say('That instant is outside the readable window (oldest answerable: ' +
        (h === null ? 'unknown' : new Date(h).toISOString()) + ').');
    return;
  }
  if (loading) {
    say('A load is already running, please wait…');
    return;
  }
  const prevAsOf = asOfMs;
  asOfMs = aligned;
  replaying = true;
  try {
    const ok = await loadFull();
    if (!ok) {
      asOfMs = prevAsOf;
      say('That instant could not be read; the view remains at the previous instant.');
    }
    // The strip reads the instant too, and nothing else reloads it on a move:
    // left alone it would describe another moment than the map beside it.
    loadProfile();
  } finally {
    replaying = false;
  }
}

function readFailureMessage(status, fallback) {
  // 503 means "too loaded, retry" — it must never be readable as an empty park.
  // The wording follows the instant being read: "re-read the past" names a
  // cost the live reader never paid, and a message that misnames the cause
  // teaches the reader to distrust the next one.
  // 429 and 503 share one consequence -- wait, then retry -- and not the cause:
  // 503 is the server saturated, 429 is this page asking too fast.
  if (status === 503) {
    if (asOfMs == null) {
      return 'The server is too busy right now — please retry.';
    }
    return 'The server is too loaded to re-read the past right now — please retry.';
  }
  if (status === 429) {
    if (asOfMs == null) {
      return 'Too many reads are in progress right now — wait a moment, then retry.';
    }
    return 'Too many past reads are in progress right now — wait a moment, then retry.';
  }
  return fallback;
}

function sliderToMs(v) {
  if (v === 1000) return null;
  const h = horizonMs();
  if (h == null) return 'unknown-horizon';
  const now = Date.now();
  return snapWithin(h + (v / 1000) * (now - h), h, now);
}

function sayInstant() {
  const el = document.getElementById('tlAtLabel');
  if (!el) return;
  const fmt = ms => new Date(ms).toLocaleString();
  // Show what was served, not what was requested.
  const served = (SCOPE && SCOPE.asOf != null) ? SCOPE.asOf : asOfMs;
  if (served == null) {
    el.textContent = 'live';
    return;
  }
  const h = horizonMs();
  el.textContent = h == null
    ? `as of ${fmt(served)}`
    : `as of ${fmt(served)} · readable back to ${fmt(h)}`;
}

// --- timeline: PRESENT in this build --------------------------------------------
// The relay exposes an asOf argument on entities, relations and graphScope, so
// the slider tlAt, the LIVE button tlLive and the label tlAtLabel all have a
// caller. Reads happen on change only, with a single replay in flight, and a
// 503 is read as "too busy, retry", never as an empty park. The footer itself
// IS visible: it carries the heatmap.
let historical=false;
const WINDOWS={'1h':3600e3,'6h':6*3600e3,'24h':86400e3,'7d':604800e3};
let tlWindow=localStorage.getItem('toise_viz_window')||'24h';
const tlRange=()=>document.getElementById('tlRange');

// Timeline span [start,end]. Live while spanEnd is null (end tracks "now"); a brush
// selection on the density profile zooms to an arbitrary past [start,end].
let spanEnd=null, spanMs=WINDOWS[tlWindow]||WINDOWS['24h'];

const isLiveSpan=()=>spanEnd===null;
function tlInstant(){ const v=+tlRange().value; const [s,e]=spanBounds();

  return new Date(s+(e-s)*v/1000); }

// A graduated ruler with absolute time labels on "nice" round boundaries, so the
// scale stays meaningful at any window and when zoomed to a past period.
const _M=60000,_H=3600000,_D=86400000;
const NICE=[_M,2*_M,5*_M,10*_M,15*_M,30*_M,_H,2*_H,3*_H,6*_H,12*_H,_D,2*_D,7*_D];
function niceStep(W,target){ for(const s of NICE){ if(W/s<=target) return s; } return NICE[NICE.length-1]; }
const _p=n=>String(n).padStart(2,'0');
function fmtAbs(d,W){ const hm=_p(d.getHours())+':'+_p(d.getMinutes());
  if(W>2*_D) return _p(d.getDate())+'/'+_p(d.getMonth()+1);
  if(W>12*_H) return _p(d.getDate())+'/'+_p(d.getMonth()+1)+' '+hm;
  return hm; }
function renderRuler(){
  const el=document.getElementById('tlRuler'); if(!el) return; el.innerHTML='';
  const [s,e]=spanBounds(), W=e-s;
  const add=(cls,frac,txt)=>{ const d=document.createElement('div'); d.className=cls;
    d.style.left=(frac*100)+'%'; if(txt!=null) d.textContent=txt; el.appendChild(d); };
  add('base',0);

  const cw=el.clientWidth;

  const major=Math.max(niceStep(W,nLab),minor);

  // steps fall just under the gap, skipping drops them ALL and leaves one label.

}
// Zoom the timeline to a selected [a,b] period (ms since epoch).
// setSpan is REMOVED with the brush that was its only caller. It set spanMs to an
// arbitrary span, which the relay's closed list of windows would refuse, and it
// reached for the slider and the LIVE button that no longer exist.
// --- change-density heatmap: one row per entity type, a grid of small cells across
// the span (empty cells drawn faint grey, like a contribution graph), cell colour =
// the type's colour and intensity = how many changes it saw — so which kind of thing
// churned and when jumps out. Type names live in the left gutter, off the grid. Built
// from the global recentChanges feed (heartbeats excluded), rendered progressively as
// pages arrive so it fills in instead of blocking.
const CELL_PX=9, GAP_PX=2, ROW_PX=11;
let profileGen=0;
async function loadProfile(){
  const el=document.getElementById('tlProfile'); if(!el) return;
  const gen=++profileGen;   // supersede any in-flight profile load
  const errEl=document.getElementById('tlErr'); if(errEl) errEl.textContent='';
  const [s,e]=spanBounds();
  // Derived from the window, never from a second clock read: spanBounds() already
  // took the time, and reading it again makes the span one millisecond longer, so
  // the duration comes out 86401s for a 24h window. The relay accepts a closed list
  // of windows, so that is a 400 and an empty heatmap -- and it only looked right
  // when both reads landed in the same millisecond, which is to say by luck.
  const durS=Math.round(spanMs/1000);
  const data=new Map();     // entity type -> [event timestamps within the span]
  let after=null, guard=0;
  try{
    do{
      // MEANINGFUL entity changes only — heartbeats (entity.unchanged) are not changes
      // and would drown the signal; relation changes have no entity type, so skip them.
      const asOf = asOfISO();
      let windowVars;
      if (asOf) {
        const [fromMs, toMs] = spanBounds();
        // Absolute bounds, and NO asOf: recentChanges has no such argument, and a
        // relay that refuses unknown variables answers 400. The window already
        // says which period to read; asOf would be a second way to say it.
        windowVars = {
          from: new Date(fromMs).toISOString().replace(/\.\d{3}Z$/, 'Z'),
          to: new Date(toMs).toISOString().replace(/\.\d{3}Z$/, 'Z')
        };
      } else {
        windowVars = { window: durS + 's' };
      }
      const variables = after
        ? { ...windowVars, first: 200, after }
        : { ...windowVars, first: 200 };
      const r=await fetch(API,{method:'POST',headers:gqlHeaders(),credentials:'same-origin',body:JSON.stringify({id:'recentChanges',variables})});
      if(!r.ok) throw new Error(readFailureMessage(r.status,'read failed with status '+r.status));
      const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
      if(gen!==profileGen) return;   // a newer load started; drop this one
      const c=j.data.recentChanges;
      for(const ed of c.edges){ const n=ed.node; if(n.changeType.endsWith('UNCHANGED') || !n.entity) continue;
        const t=Date.parse(n.eventTime);
        if(t>=s && t<=e){ let arr=data.get(n.entity.type); if(!arr){ arr=[]; data.set(n.entity.type,arr); } arr.push(t); } }

    // what arrived before the failure, so the message has to say so.
    if(gen===profileGen){
      const e2=document.getElementById('tlErr');
      if(e2){
        const reason=(err&&typeof err.message==='string'&&err.message)?err.message:(err!=null?String(err):'unknown cause');

          ?'⚠ change history unavailable: '+reason
          :'⚠ change history incomplete, reading stopped partway: '+reason;

}
function renderProfile(data,s,e){

  if(!el||!gut) return;

function toCSV(t){
  const cell=v=>{
    let s=(v===null||v===undefined)?'':String(v);
    // A leading =, +, - or @ makes a spreadsheet treat the cell as a formula, so it
    // is prefixed with an apostrophe. The export is data, never something to run.
    //
    // The test skips leading whitespace and control characters first: a cell of
    // "\t=cmd" passes a naive first-character check, and the spreadsheet strips the
    // tab before parsing, so the formula runs anyway. Column labels go through this
    // same function, because a header is a cell too.
    // A plain number is exempt: "-5" is a value, and prefixing it would turn a
    // numeric column into text that no longer adds up. Anything else starting with
    // one of those characters is prefixed, whatever the column claims its type is --
    // trusting the declared type would move the decision to the relay.
    const lead=s.replace(/^[\s\u0000-\u001f]+/,'');
    if(/^[=+\-@]/.test(lead) && !/^[+-]?\d+(\.\d+)?$/.test(lead)) s="'"+s;
    if(/[",\r\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const out=[t.columns.map(c=>cell(c&&c.label)).join(',')];
  for(const row of t.rows) out.push(t.columns.map((c,i)=>cell(cellOf(row,i))).join(','));
  return out.join('\r\n');
}

function tick(){
  if(loading) return;                                  // never start a load while one is running
  if(Date.now()-failedAt < 60000) return;              // no retry within 60s of a definitive failure
  // A failure is a reason to reload, and the size rule exists only to avoid
  // reloading a big fleet for no reason, so it must not swallow this case.
  if(failedAt !== 0){

    const b=document.createElement('button');
    b.textContent=name; b.className=layerOn(name)?'on':'';
    b.title=name+' — '+types.filter(t=>presentTypes.has(t)).join(', ');
    b.onclick=()=>{ const on=layerOn(name);
      // Deliberately NOT persisted: the legend is not either, and a hidden layer
      // that survives the session is a graph missing a third of itself with
      // nothing on screen to say why — the exact trap this file already fixed
      // once for the inferred overlay.
      types.filter(t=>presentTypes.has(t)).forEach(t=>{ if(on) hidden.add(t); else hidden.delete(t); });
      rebuild(); settle(2000); };
    box.appendChild(b); });
}

const fmBtn=document.getElementById('filterMode');
fmBtn.onclick=()=>{ filterOnly=!filterOnly; fmBtn.textContent='match: '+(filterOnly?'only':'dim');
  fmBtn.style.color=filterOnly?'var(--accent)':''; rebuild(); };
const stBtn=document.getElementById('static');
function syncStaticBtn(){ stBtn.textContent='layout: '+(staticLayout?'static':'animated'); stBtn.style.color=staticLayout?'var(--accent)':''; }
syncStaticBtn();
stBtn.onclick=()=>{ staticLayout=!staticLayout; localStorage.setItem('toise_viz_static',staticLayout?'1':'0');
  syncStaticBtn(); if(staticLayout) freeze(); };
document.getElementById('resync').onclick=()=>{ loadProfile(); loadFull(); };
document.getElementById('fit').onclick=()=>net.fit({animation:true});
document.getElementById('relayout').onclick=()=>settle(2600);
// The heatmap and the ruler stay: they are fed by recentChanges, which reads the
// PRESENT. The controls that travel in time are wired to the asOf documents the
// relay now exposes, so they call them on release only, with a single replay in flight.
const tlWin=document.getElementById('tlWin'); tlWin.value=tlWindow;
const tlLabelEl=document.getElementById('tlLabel'); tlLabelEl.textContent=tlWindow;
tlWin.onchange=()=>{ tlWindow=tlWin.value; localStorage.setItem('toise_viz_window',tlWindow);
  spanEnd=null; spanMs=WINDOWS[tlWindow]||WINDOWS['24h']; renderRuler(); loadProfile();
  tlLabelEl.textContent=tlWindow; };
renderRuler(); loadProfile();
function syncSlider() {
  if (!tlAt) return;
  const h = horizonMs();
  if (asOfMs === null || asOfMs === undefined) {
    tlAt.value = '1000';
  } else if (typeof h === 'number' && h > 0) {
    const now = Date.now();
    const pos = Math.round(((asOfMs - h) / (now - h)) * 1000);
    tlAt.value = String(Math.max(0, Math.min(1000, pos)));
  }
}

const tlAt = document.getElementById('tlAt');
const tlLive = document.getElementById('tlLive');
if (tlAt) {
  // input fires on every pixel of the drag; change fires only on release,
  // so the platform enforces the rule instead of us faking it with a timer.
  tlAt.addEventListener('change', async () => {
    // Wait for the load to settle so the label never claims a moment that failed to load.
    await goToInstant(sliderToMs(Number(tlAt.value)));
    sayInstant();
    syncSlider();
  });
}
if (tlLive) {
  tlLive.addEventListener('click', async () => {
    if (tlAt) tlAt.value = '1000';
    // Wait for the live restore so the label reflects the instant actually loaded.
    await goToInstant(null);
    sayInstant();
    syncSlider();
  });
}
sayInstant();
setInterval(()=>{ if(isLiveSpan()) loadProfile(); }, 60000);   // keep the live profile fresh
// The brush that zoomed the density profile into a period is REMOVED. A brush
// would select an arbitrary period, while the profile window is taken from a
// closed list (from/to served by the relay, or the 1h/6h/24h/7d selector), and
// the window selector already covers the need -- so dragging across the strip
// would offer a precision the data and the API do not have.

// Resize the detail panel by dragging its left edge; the graph takes the rest and
// the panel's fixed-layout tables reflow to the new width. Width is remembered.

// --- the dome: the same chart, wrapped around the viewer --------------------
// A SECOND VIEW of the one layout, never a second layout. The settled 2-D
// positions are read back from the network and mapped onto the celestial
// sphere by an inverted azimuthal projection: distance from the layout's
// centre becomes polar angle, bearing becomes azimuth. The middle of the graph
// therefore sits straight ahead and its outskirts wrap behind your shoulders,
// which is the one arrangement where "turn around to see the rest" is
// literally true, and where the two views are the same sky rather than two
// pictures that happen to share a colour scheme.
//
// Everything a star looks like is read from the SAME vis.DataSet the plate
// draws from: size, colour, opacity, label, and an edge's own colour (so
// "edges: off" paints transparent here too, for free). Nothing about a node's
// appearance is decided twice. This page already shipped that defect once, by
// reimplementing the server's display-name cascade in JavaScript.
//
// The projection is gnomonic, so a great circle through two stars draws as a
// STRAIGHT segment: a relation needs no sampling, only clipping at the near
// plane. It distorts towards the edges, which is why the field of view stays
// well under 180 degrees — you cannot see the whole sky at once, by
// construction. That is the trade, and it is why the dome is offered BESIDE
// the flat chart and never in its place.
const THETA_MAX=2.6;          // radians: the outskirts land about 150 deg off centre
const NEAR=0.06;              // near plane, in units of the forward component
const dirOf={};               // node id -> unit vector on the sphere
const cv=document.getElementById('dome'), g2=cv.getContext('2d');
let domeMode=localStorage.getItem('toise_viz_view')==='dome';
let yaw=0, pitch=0, fov=78*Math.PI/180;
let domeDrag=false, lastX=0, lastY=0, startX=0, startY=0;
let drift=false, showGrid=true, raf=null, cvW=0, cvH=0;
const DPR=Math.min(2,window.devicePixelRatio||1);
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Unit directions spread uniformly over the whole sphere (uniform in cos, not
// in the polar angle) so the field is not bunched at the poles. Same seed as
// the flat field: one sky, identical on every reload.
const FIELD_DOME=(function(){ let s=20261029; const out=[];
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<900;i++){ const u=rnd()*2-1, ph=rnd()*Math.PI*2, r=Math.sqrt(1-u*u);
    out.push({v:[r*Math.cos(ph),u,r*Math.sin(ph)],r:0.4+rnd()*1.3,a:0.10+rnd()*0.5}); }
  return out; })();

// Recomputed every frame rather than cached: the graph is live and the force
// layout keeps moving for a bounded window after any structural change, so a
// cached wrap would show an arrangement the plate has already left. One hypot
// and one atan2 per node, next to a projection we do anyway.
function wrapLayout(){
  const pos=net.getPositions(), ids=Object.keys(pos);
  for(const k in dirOf) delete dirOf[k];
  if(!ids.length) return;
  let cx=0, cy=0;
  for(const id of ids){ cx+=pos[id].x; cy+=pos[id].y; }
  cx/=ids.length; cy/=ids.length;
  let R=0;
  for(const id of ids){ const d=Math.hypot(pos[id].x-cx,pos[id].y-cy); if(d>R) R=d; }
  if(R<=0) R=1;
  for(const id of ids){
    const dx=pos[id].x-cx, dy=pos[id].y-cy;
    const th=Math.min(1,Math.hypot(dx,dy)/R)*THETA_MAX;
    // -dy: canvas y grows downward, the sky's up does not. Without the flip the
    // dome is the chart upside down, and the two views stop being one sky.
    const ph=Math.atan2(-dy,dx), s=Math.sin(th);
    dirOf[id]=[s*Math.cos(ph),s*Math.sin(ph),Math.cos(th)];
  }
}

function sizeCanvas(){
  const r=cv.getBoundingClientRect();
  cvW=Math.max(1,Math.round(r.width)); cvH=Math.max(1,Math.round(r.height));
  cv.width=Math.round(cvW*DPR); cv.height=Math.round(cvH*DPR);
  g2.setTransform(DPR,0,0,DPR,0,0);
}
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function basis(){
  const cp=Math.cos(pitch), sp=Math.sin(pitch), cy=Math.cos(yaw), sy=Math.sin(yaw);
  const f=[sy*cp,sp,cy*cp], r=[cy,0,-sy];
  // up = forward x right, in that order: the other order points at the ground
  // and the sky draws upside down.
  const u=[f[1]*r[2]-f[2]*r[1],f[2]*r[0]-f[0]*r[2],f[0]*r[1]-f[1]*r[0]];
  return {f,r,u};
}
function project(v,B,scale){
  const z=dot3(v,B.f); if(z<=NEAR) return null;
  return {x:cvW/2+dot3(v,B.r)/z*scale, y:cvH/2-dot3(v,B.u)/z*scale, z};
}
// Clip a segment at the near plane, so a line to a star behind you draws its
// visible half instead of vanishing or whipping across the screen.
function clipSeg(a,b,B,scale){
  const za=dot3(a,B.f), zb=dot3(b,B.f);
  if(za<=NEAR && zb<=NEAR) return null;
  let A=a, C=b;
  if(za<=NEAR){ const t=(NEAR-za)/(zb-za); A=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
  if(zb<=NEAR){ const t=(NEAR-zb)/(za-zb); C=[b[0]+(a[0]-b[0])*t,b[1]+(a[1]-b[1])*t,b[2]+(a[2]-b[2])*t]; }
  const p=project(A,B,scale), q=project(C,B,scale);
  return (p&&q)?[p,q]:null;
}
function stroke2(seg){ g2.beginPath(); g2.moveTo(seg[0].x,seg[0].y); g2.lineTo(seg[1].x,seg[1].y); g2.stroke(); }

function drawGrid(B,scale){
  g2.strokeStyle='rgba(120,146,200,0.11)'; g2.lineWidth=1;
  for(let m=0;m<12;m++){            // meridians: great circles, so two points suffice per arc
    const a=m*Math.PI/6;
    for(let k=0;k<24;k++){
      const t0=k*Math.PI/12, t1=(k+1)*Math.PI/12;
      const seg=clipSeg([Math.sin(t0)*Math.cos(a),Math.cos(t0),Math.sin(t0)*Math.sin(a)],
                        [Math.sin(t1)*Math.cos(a),Math.cos(t1),Math.sin(t1)*Math.sin(a)],B,scale);
      if(seg) stroke2(seg);
    }
  }
  for(let i=1;i<6;i++){             // parallels: small circles, sampled
    const el=(i*30-90)*Math.PI/180, y=Math.sin(el), rr=Math.cos(el);
    for(let k=0;k<48;k++){
      const a0=k*Math.PI/24, a1=(k+1)*Math.PI/24;
      const seg=clipSeg([rr*Math.cos(a0),y,rr*Math.sin(a0)],[rr*Math.cos(a1),y,rr*Math.sin(a1)],B,scale);
      if(seg) stroke2(seg);
    }
  }
}

const HEX=h=>{ const m=/^#?([0-9a-f]{6})$/i.exec(String(h)||'');
  if(!m) return [168,194,255];
  const v=parseInt(m[1],16); return [(v>>16)&255,(v>>8)&255,v&255]; };

let hitBoxes=[];
function drawDome(){
  wrapLayout();
  const B=basis(), scale=(cvH/2)/Math.tan(fov/2);
  g2.clearRect(0,0,cvW,cvH);

  for(const f of FIELD_DOME){
    const p=project(f.v,B,scale); if(!p) continue;
    g2.beginPath(); g2.arc(p.x,p.y,f.r,0,Math.PI*2);
    g2.fillStyle='rgba(205,222,255,'+f.a.toFixed(2)+')'; g2.fill();
  }
  if(showGrid) drawGrid(B,scale);

  for(const e of edges.get()){
    const A=dirOf[e.from], C=dirOf[e.to]; if(!A||!C) continue;
    const seg=clipSeg(A,C,B,scale); if(!seg) continue;
    // The plate's own edge colour, so "edges: off" is off here too: it paints
    // them fully transparent rather than removing them.
    g2.strokeStyle=(e.color&&e.color.color)||'rgba(150,178,235,0.26)';
    g2.lineWidth=e.width||0.9;
    stroke2(seg);
  }

  hitBoxes=[]; const drawn=[];
  for(const n of nodes.get()){
    if(n.hidden) continue;
    const v=dirOf[n.id]; if(!v) continue;
    const p=project(v,B,scale); if(!p) continue;
    if(p.x<-80||p.x>cvW+80||p.y<-80||p.y>cvH+80) continue;
    const size=n.size||14;
    drawn.push({n,p,rad:size*0.62*(0.75+0.45*p.z),size,
                alpha:(n.opacity===undefined?1:n.opacity)});
  }
  drawn.sort((a,b)=>a.rad-b.rad);   // the faint first, so the bright draw over them

  for(const it of drawn){
    const n=it.n, c=(n.color&&n.color.background)||'#a8c2ff';
    g2.globalAlpha=it.alpha;
    if(isKind(n.id)){
      // A count, not a thing: it keeps the plate's box shape here too, because
      // drawing it as a star would claim the sky holds one object where it
      // holds hundreds.
      const s=Math.max(6,it.rad);
      g2.fillStyle=c; g2.strokeStyle=(n.color&&n.color.border)||'#6f80a0'; g2.lineWidth=1.4;
      g2.beginPath(); g2.rect(it.p.x-s,it.p.y-s*0.62,s*2,s*1.24); g2.fill(); g2.stroke();
    } else {
      const rgb=HEX(c);
      const grd=g2.createRadialGradient(it.p.x,it.p.y,0,it.p.x,it.p.y,it.rad*3.1);
      grd.addColorStop(0,   'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.95)');
      grd.addColorStop(0.30,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.34)');
      grd.addColorStop(1,   'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
      g2.beginPath(); g2.arc(it.p.x,it.p.y,it.rad*3.1,0,Math.PI*2); g2.fillStyle=grd; g2.fill();
      g2.beginPath(); g2.arc(it.p.x,it.p.y,it.rad,0,Math.PI*2); g2.fillStyle=c; g2.fill();
    }
    g2.globalAlpha=1;
    hitBoxes.push({id:n.id,x:it.p.x,y:it.p.y,r:Math.max(9,it.rad*1.6)});
  }

  // Only the brightest carry a name. A sky with every label on is a page of
  // text, and the plate is the view for reading every name. A kind box is the
  // exception and always keeps its label: the label is what it holds, so an
  // unlabelled one is an empty rectangle rather than a quieter star.
  g2.font='10.5px ui-monospace, SFMono-Regular, Menlo, monospace';
  g2.textAlign='center'; g2.textBaseline='top';
  const named=drawn.filter(it=>isKind(it.n.id))
    .concat(drawn.filter(it=>!isKind(it.n.id)).sort((a,b)=>b.size-a.size).slice(0,26));
  // A label that lands on another is worse than no label: two names overprinted
  // read as a third, wrong one. Brightest first, and a name whose box collides
  // with one already placed is dropped rather than drawn over it.
  const placed=[];
  for(const it of named){
    if(!it.n.label) continue;
    const text=String(it.n.label).split('\n')[0];
    const w=g2.measureText(text).width, x=it.p.x-w/2, y=it.p.y+it.rad+4;
    const box={x0:x-2,y0:y-1,x1:x+w+2,y1:y+12};
    let clash=false;
    for(const q of placed){
      if(box.x0<q.x1 && box.x1>q.x0 && box.y0<q.y1 && box.y1>q.y0){ clash=true; break; }
    }
    if(clash) continue;
    placed.push(box);
    g2.globalAlpha=it.alpha;
    g2.fillStyle='rgba(195,209,234,0.92)';
    g2.fillText(text, it.p.x, y);
    g2.globalAlpha=1;
  }

  const az=((yaw*180/Math.PI)%360+360)%360, alt=pitch*180/Math.PI;
  document.getElementById('bearing').textContent=
    'az '+String(Math.round(az)).padStart(3,'0')+'° alt '+
    (alt<0?'-':'+')+String(Math.round(Math.abs(alt))).padStart(2,'0')+'°';
}

function domeLoop(){
  raf=null;
  if(!domeMode) return;
  if(!document.hidden){
    if(drift && !domeDrag && !reduceMotion) yaw+=0.0012;
    drawDome();
  }
  raf=requestAnimationFrame(domeLoop);
}
function kick(){ if(domeMode && raf===null) raf=requestAnimationFrame(domeLoop); }

cv.addEventListener('pointerdown',ev=>{ domeDrag=true;
  lastX=startX=ev.clientX; lastY=startY=ev.clientY;
  cv.classList.add('drag'); try{ cv.setPointerCapture(ev.pointerId); }catch(_){} });
cv.addEventListener('pointermove',ev=>{ if(!domeDrag) return;
  const k=fov/cvH;
  yaw-=(ev.clientX-lastX)*k;
  pitch=Math.max(-1.45,Math.min(1.45,pitch+(ev.clientY-lastY)*k));
  lastX=ev.clientX; lastY=ev.clientY; });
cv.addEventListener('pointerup',ev=>{ if(!domeDrag) return;
  domeDrag=false; cv.classList.remove('drag');
  // Measured from where the press STARTED, not from the last move: a turn ends
  // a few pixels from its previous frame and would otherwise read as a click.
  if(Math.hypot(ev.clientX-startX,ev.clientY-startY)<4) pickAt(ev); });
cv.addEventListener('pointercancel',()=>{ domeDrag=false; cv.classList.remove('drag'); });
cv.addEventListener('wheel',ev=>{ ev.preventDefault();
  fov=Math.max(26*Math.PI/180,Math.min(118*Math.PI/180,fov+ev.deltaY*0.0012)); },{passive:false});

function pickAt(ev){
  const r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
  let best=null, bd=Infinity;
  for(const h of hitBoxes){ const d=Math.hypot(h.x-x,h.y-y); if(d<=h.r && d<bd){ bd=d; best=h.id; } }
  // A kind box stands for a count; there is nothing to inspect behind it, and
  // opening it belongs to the plate where double-click lives.
  inspect(isKind(best)?null:best);
}

const viewBtn=document.getElementById('view'), domeBar=document.getElementById('domebar');
function syncView(){
  viewBtn.textContent='view: '+(domeMode?'dome 360':'chart');
  viewBtn.style.color=domeMode?'var(--accent)':'';
  cv.hidden=!domeMode; domeBar.hidden=!domeMode;
  if(domeMode){ sizeCanvas(); kick(); }
  else if(raf!==null){ cancelAnimationFrame(raf); raf=null; }
}
viewBtn.onclick=()=>{ domeMode=!domeMode;
  localStorage.setItem('toise_viz_view',domeMode?'dome':'chart'); syncView(); };
const recentreBtn=document.getElementById('recentre');
recentreBtn.onclick=()=>{ yaw=0; pitch=0; fov=78*Math.PI/180; };
const driftBtn=document.getElementById('drift');
driftBtn.onclick=()=>{ drift=!drift; driftBtn.classList.toggle('on',drift); };
if(reduceMotion) driftBtn.title='Drift is off: this browser asks for reduced motion.';
const gridBtn=document.getElementById('grid');
gridBtn.onclick=()=>{ showGrid=!showGrid; gridBtn.classList.toggle('on',showGrid); };
window.addEventListener('resize',()=>{ if(domeMode) sizeCanvas(); });
document.addEventListener('visibilitychange',kick);
syncView();

(function(){ const rz=document.getElementById('resizer'), aside=document.getElementById('panel');
  const saved=parseInt(localStorage.getItem('toise_viz_aside')||'',10);
  if(saved>=280 && saved<=900) aside.style.width=saved+'px';
  let x0=0, w0=0, dragging=false;
  // Resize the canvas WITH the panel, but throttled to one redraw per animation frame
  // (rAF) — resizing on every raw mousemove froze the drag; letting CSS stretch the
  // canvas and only fixing it on release made it blink. rAF keeps it smooth.
  let raf=0;
  const redraw=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0;
    try{ net.setSize('100%','100%'); net.redraw(); }catch(_){} }); };
  rz.addEventListener('mousedown',ev=>{ dragging=true; x0=ev.clientX; w0=aside.getBoundingClientRect().width;
    rz.classList.add('drag'); document.body.style.userSelect='none'; ev.preventDefault(); });
  window.addEventListener('mousemove',ev=>{ if(!dragging) return;
    aside.style.width=Math.max(280,Math.min(900, w0+(x0-ev.clientX)))+'px'; redraw(); });
  window.addEventListener('mouseup',()=>{ if(!dragging) return; dragging=false; rz.classList.remove('drag');
    document.body.style.userSelect=''; localStorage.setItem('toise_viz_aside', String(Math.round(aside.getBoundingClientRect().width))); redraw(); }); })();
if (EMBEDDED) {
  // Hidden, not removed: the question panel's controls are wired further down.
  const askPanel = document.getElementById('ask');
  if (askPanel) askPanel.hidden = true;
  publishView();   // the Dock must have a context before the reader clicks anything
}
loadFull().then(fallback);
</script>
