<title>Toise — Graph</title>
<!--
  Example consumer of the Toise GraphQL API — NOT part of toise-server.

  THIS SURFACE IS ENGLISH-ONLY. It is shown in international demos, so every
  string that reaches the screen — button text, tooltips, counters, legends —
  stays in English. Comments may be in any language; anything a viewer can read
  may not.
  A standalone, dependency-free page (vis-network from a CDN) that loads the
  entity/relation graph with a query and then streams live changes over the
  entityChanged / relationChanged subscriptions. See README.md.

  Endpoint: defaults to a same-origin /graphql (serve this file behind the same
  proxy as toise-server). Override with ?api=https://host:port/graphql.

  Labels: a header toggle switches node labels between human-readable names
  (host.name, service.name, interface.name, the listener's process, …) and the raw
  technical identities. The choice is remembered (localStorage).

  Inferred links (off by default): an optional overlay of dashed, derived edges that
  link each IP-bearing entity (a listener's bind address, an endpoint's
  server.address, a route's next hop) to the network.address node for that IP. The
  engine stores facts only and never merges by heuristic, so these are NOT stored
  relations — they are a consumer-side reading aid. Host-local addresses that are not
  global join points are skipped: wildcard, loopback, link-local, and the Docker
  default bridge (172.17.0.0/16) — the same 172.17.0.1 exists on every host.

  Attribute filter: the header "attr" box highlights nodes whose identity/attributes
  match (a key, key=value, or a free substring) and dims the rest — a read-time view
  over the fetched data, so it works on whatever attributes producers emit.

  Timeline: the time travel is PRESENT in this build -- the relay exposes an
  asOf argument on entities, relations and graphScope, and the slider tlAt
  picks the instant on a five-minute grid, with tlLive returning to now and
  tlAtLabel showing the served instant against the server's horizon.
  What REMAINS as before is the change-density heatmap with its ruler and a
  window selector, all fed by recentChanges, which reads the present.
  LIVE (or drag back to now) to resume streaming. Live updates are ignored while
  browsing history so the past view stays put; a request before the retention horizon
  is refused and surfaced.

  Dome (360): a header toggle wraps the SAME layout around the viewer — distance
  from the centre of the graph becomes the angle away from straight ahead, so the
  outskirts sit behind your shoulders and you turn to see them. Drag to turn,
  scroll to change the field of view. It is a second view of one layout, not a
  second layout, and every star's size, colour, opacity and label is read back
  from the chart's own data. The projection is gnomonic, so it cannot show the
  whole sky at once; the flat chart remains the view that can.

  Layout: the force simulation runs only until it stabilises, then FREEZES, so the
  graph settles once instead of drifting forever. A structural change (a node/edge
  added or removed) re-runs it briefly and re-freezes; attribute-only heartbeats never
  move it. "relayout" re-runs the layout on demand.

  Multi-tenancy (ADR 0025): pick a tenant with ?tenant=<id>. It is sent as the
  X-Scope-OrgID header on queries; for the live subscription (a browser can't set a
  header on a WebSocket) it is appended as ?tenant=, which a translating proxy maps
  to the header. Absent => the server's "default" tenant.
-->
<!-- Served locally, not from a CDN: this page runs inside a portal whose host may
     have no egress, and a CDN that is unreachable or slow leaves a blank screen with
     no error. The deployment places the file; pin it to vis-network 9.1.9, whose
     published bundle has the integrity
     sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ -->

<style>
:root{--bg:#05070f;--panel:#0a0e1c;--line:#1b2440;--fg:#d9e3f5;--dim:#6f80a0;--accent:#8fb4ff;--amber:#fcbe36;--warn:#e8b06a;--ok:#7fd4a8;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
@font-face{font-family:'Geist Sans';font-style:normal;font-weight:400;font-display:swap;src:url('/static/sh-ui/fonts/geist-sans-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Geist Sans';font-style:normal;font-weight:500;font-display:swap;src:url('/static/sh-ui/fonts/geist-sans-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Geist Sans';font-style:normal;font-weight:600;font-display:swap;src:url('/static/sh-ui/fonts/geist-sans-latin-600-normal.woff2') format('woff2');}
body{background:var(--bg);color:var(--fg);font:14px/1.5 'Geist Sans',system-ui,sans-serif;display:flex;flex-direction:column;}
/* Monospace only where a value must be compared character by character. */
table td,.muted{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
/* Fixed height, and never wrapping: the status texts differ per view, so a
   wrapping bar made the canvas 40px shorter in one view than another -- and the
   grid is computed from that height. A layout that changes under the thing it
   measures is a measurement that cannot be trusted. */
/* Wraps, and does not clip. Two reasons, both measured: at 1440px with the Dock
   open the Show-all button was squeezed into the right corner and broke over two
   lines; and `overflow:hidden` here was CLIPPING the "go to" suggestion list,
   which hangs below its field, so the suggestions could never be seen at all. */
header{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:.3rem;min-height:2.6rem;box-sizing:border-box;overflow:visible;}
header .brand{font-weight:700;}
header .tag{color:var(--dim);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 .35rem;}
header nav{display:flex;gap:1rem;}
header a{color:var(--accent);text-decoration:none;}
header a:hover{text-decoration:underline;}
.stats{display:flex;gap:1rem;align-items:center;color:var(--dim);font-size:12px;flex-wrap:nowrap;min-width:0;flex:1;overflow:hidden;white-space:nowrap;}
.stats>span{overflow:hidden;text-overflow:ellipsis;}
.stats b{color:var(--fg);}
#status{display:flex;align-items:center;gap:.35rem;}
#status i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dim);}
#status.live i{background:var(--ok);box-shadow:0 0 6px var(--ok);}
#status.poll i{background:var(--warn);}
#status.down i{background:#ff7b72;}
.pulse{animation:p 1.2s ease-out;}
@keyframes p{from{box-shadow:0 0 0 0 var(--accent);}to{box-shadow:0 0 0 14px rgba(88,166,255,0);}}
main{flex:1;display:flex;min-height:0;}
#stage{flex:1;min-width:0;display:flex;position:relative;}
/* The dome sits ON TOP of the plate rather than replacing it: vis-network sizes
   its canvas from the container, and a container set to display:none measures
   zero. Leaving the plate laid out underneath an opaque canvas costs one hidden
   redraw and removes every resize fault from switching views. */
#dome{position:absolute;inset:0;z-index:2;display:block;width:100%;height:100%;
  touch-action:none;cursor:grab;
  background:radial-gradient(130% 110% at 50% 45%,#0a1024 0%,#05070f 58%,#02030a 100%);}
#dome[hidden]{display:none;}
#dome.drag{cursor:grabbing;}
.domebar{position:absolute;left:0;right:0;bottom:.7rem;z-index:3;display:flex;
  justify-content:center;align-items:center;gap:.4rem;font-size:12px;pointer-events:none;}
.domebar[hidden]{display:none;}
.domebar>*{pointer-events:auto;}
.domebar button.on{color:var(--accent);border-color:var(--accent);}
.domebar .bearing{color:var(--dim);font-variant-numeric:tabular-nums;
  background:rgba(5,7,15,.78);border:1px solid var(--line);border-radius:4px;padding:.2rem .5rem;}
#net{flex:1;min-width:0;transition:opacity .25s ease;position:relative;
  background:radial-gradient(130% 110% at 50% 45%,#0a1024 0%,#05070f 58%,#02030a 100%);}
/* the engraved field edge: a planisphere is a circle on a plate */
#net::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 180px 40px rgba(2,3,10,.85);}
#net.laying{opacity:0;}   /* hidden while the initial layout is computed, then revealed */
.resizer{flex:none;width:6px;cursor:col-resize;background:var(--line);opacity:.35;}
.resizer:hover,.resizer.drag{opacity:1;background:var(--accent);}
aside.wide{width:480px;}
/* Labels are prose, not values: they follow the page font. */
label.muted,#askState,summary,#askOut{font-family:inherit;}
#ask{margin-bottom:.8rem;}
#askQ{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;padding:.3rem;}
#askOut table.sh-list{width:100%;border-collapse:collapse;margin-top:.5rem;}
#askOut table.sh-list th{text-align:left;font-weight:600;border-bottom:1px solid var(--line);padding:.2rem .3rem;}
#askOut table.sh-list td{padding:.2rem .3rem;font-family:inherit;}
#askOut .sh-export{margin-top:.5rem;display:flex;gap:.4rem;}
aside{width:360px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;overflow-x:hidden;padding:.8rem;}
/* The map takes the whole width; the column is HIDDEN and not removed, because
   two places call getElementById('panel').classList without tolerating its
   absence, and the question panel inside it is wired further down. */
#panel{display:none;}
.resizer{display:none;}
.actions{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.actions button{cursor:pointer;font:inherit;padding:6px 12px;border-radius:6px;background:transparent}
.actions .primary{border:1px solid var(--accent);color:var(--accent)}
.actions .secondary{border:1px solid transparent;color:var(--dim)}
.actions .secondary:hover{color:var(--fg)}
/* The two fields' font lives HERE, not in their inline style. An inline
   font:inherit beat every stylesheet rule and inherited the label's font-size:0
   under 560px, so typed text was invisible on a phone -- measured by sop, and
   first taken for a bench artefact because the JS value was fine. */
header label input{font:inherit;}
/* The suggestions hang under the "go to" field, over the map, and take no room
   in the layout: the toolbar height is pinned and a list that pushed it would
   shrink the canvas on every keystroke. */
/* The count rides as a badge rather than inside the label: "Show all (20 of 185)"
   is three times the width of "Show all" and it was the string that overflowed. */
#showall.off{display:none;}
#tlEarlier,#tlLater{font-size:12px;line-height:1;padding:.05rem .3rem;}
/* Large means large: 18px, which a 12px footer barely distinguishes, was not. */
/* One line, always. During a past read the label wrapped to five lines and the
   footer grew from 144 to 216px, taking 72px of map for the length of the read.
   The horizon moves to the tooltip; the line's height is fixed in rem, sized for
   the large dragging state, so neither the read nor the drag moves the map. */
#tlAtLabel{display:block;max-width:100%;height:1.9rem;line-height:1.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tlAtLabel.dragging{font-size:1.4rem;font-weight:600;color:var(--fg);}
.badge{display:inline-block;margin-left:.35rem;padding:0 .3rem;border-radius:999px;
  background:var(--line);font-size:10px;line-height:1.5;vertical-align:middle;opacity:.9;}
.goto-list{position:absolute;top:100%;left:0;z-index:30;min-width:14rem;max-width:22rem;
  max-height:16rem;overflow-y:auto;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.45);padding:.15rem;}
.goto-item{display:block;width:100%;text-align:left;cursor:pointer;background:none;border:0;
  color:var(--fg);font:inherit;padding:.25rem .45rem;border-radius:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.goto-item:hover,.goto-item:focus{background:var(--line);outline:none;}
.goto-none{padding:.25rem .45rem;opacity:.65;font-style:italic;}
/* Resting state: a narrow column that fits its content, and folds to its title.
   The reservation is measured from this element, so its width is literally how
   many names the map can afford -- at 360px the drawing kept 56% and drew one. */
#detail.list{width:auto;max-width:15rem;max-height:none;}
#detail.list details[open]{max-height:40vh;overflow-y:auto;display:block;}
#detail.list summary{white-space:nowrap;}
#detail.list .chev{font-size:.8em;opacity:.7;margin-left:.1rem;}
#detail.list summary{cursor:pointer;list-style:none;font-weight:600;}
#detail.list summary::-webkit-details-marker{display:none;}
.litlist{display:flex;flex-direction:column;gap:.1rem;margin-top:.4rem;}
.litrow{background:transparent;border:0;color:var(--fg);text-align:left;padding:.15rem .2rem;border-radius:4px;cursor:pointer;font:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.litrow:hover{background:var(--bg);color:var(--accent);}
#detail{position:absolute;top:1rem;right:1rem;width:21rem;max-width:calc(100% - 2rem);max-height:calc(100% - 2rem);overflow-y:auto;overflow-x:hidden;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;box-shadow:0 .25rem 1rem rgba(0,0,0,.35);padding:.8rem;z-index:10;}
#detail:has(.empty){visibility:hidden;pointer-events:none;}
aside h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:.2rem 0 .6rem;}
/* table-layout:fixed + wrap-anywhere keeps long ids/values inside the panel instead
   of overflowing and getting clipped. */
aside table{border-collapse:collapse;width:100%;table-layout:fixed;}
aside td{padding:.25rem .4rem;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;word-break:break-word;}
aside td.k{color:var(--dim);width:40%;word-break:normal;overflow-wrap:break-word;}
/* Whole, and clickable. Clipped to one row it ended in "Listening po…" and a
   reader who could not see a chip could not switch its type back on. It wraps. */
.legend{display:flex;flex-wrap:wrap;gap:.2rem .5rem;overflow:visible;font-size:11px;flex:1 1 auto;min-width:0;}
.legend span{display:flex;align-items:center;gap:.25rem;cursor:pointer;opacity:.85;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.02rem .45rem;font-size:11px;line-height:1.35;white-space:nowrap;flex-shrink:0;}
.legend span.off{opacity:.3;text-decoration:line-through;}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.subbar{display:flex;align-items:center;gap:.25rem .8rem;padding:.2rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap;overflow:visible;white-space:normal;min-height:1.9rem;box-sizing:border-box;}
/* The legend is what lets a reader switch a type back on, so it never gives
   way: the scope yields first and ellipses. flex-shrink:0 on the scope was
   the defect -- it refused to shrink, so the legend was the one that lost. */
.subbar>#scopeStat{margin-left:auto;flex:0 1 auto;flex-shrink:999;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--dim);}
/* Narrow screens: the bar needs 454px of content and has 390. It wraps to TWO
   rows -- segments above, search and Options below -- and the height is pinned
   for that breakpoint. Fixed is what matters, not single: a height that changes
   with the view moves the canvas, a height that differs between breakpoints
   does not. Options must stay reachable; the search can be small. */
@media (max-width:560px){
  /* THREE rows here: segments, the two fields, then Show all on its own.
     The height is NOT a number any more. I pinned 6.6rem by adding up rows and
     was 13px short: measured at 390px, Show all ran from y=90 to y=119 while the
     legend chips started at y=110, so they bit 9px into it and a finger landing
     low hit Container. The segments were clipped at the top by the same shortfall.
     An arithmetic height is a sum I can get wrong; a reserved row cannot be.
     So the height follows the content, and the content is CONSTANT because the
     button's row is always there -- merely invisible when nothing is withheld.
     That is what keeps the canvas from moving under the reader's finger, which
     was the only reason to pin a number in the first place. */
  header{flex-wrap:wrap;height:auto;row-gap:.35rem;}
  .segmented{order:1;}
  header label[for=attr],header label[for=goto],.options{order:2;}
  #showall{flex:1 1 100%;order:3;}
  /* Laid out but not drawn: the row stays reserved, so showing the button adds
     nothing to the bar's height and takes nothing from the map. */
  #showall.off{display:block;visibility:hidden;}
  header label[for=goto]{flex:1 1 auto;min-width:0;}
  header label[for=goto] input{width:100%;margin-left:0;font-size:16px;line-height:normal;padding:.25rem .4rem;height:1.9rem;box-sizing:border-box;}
  .segmented{flex:1 1 100%;}
  .segmented button{flex:1 1 0;min-width:0;padding:.2rem .25rem;}
  .stats{display:none;}
  /* Hide the WORD, not the label. font-size:0 on the label reached every
     descendant: first the input (patched by exception), then the suggestion
     list -- eight blank lines eight pixels tall, measured by lab. The word has
     its own element now, so nothing else inherits the zero. */
  header label[for=attr]{flex:1 1 auto;min-width:0;}
  header label[for=attr] .lbl,header label[for=goto] .lbl{font-size:0;}
  /* 16px, not 12: below 16px iOS Safari zooms the whole page when a field takes
     focus, and a page that jumps under the keyboard reads as a field that does
     not work. Not measured on a device by us; the standard remedy, applied. */
  header label[for=attr] input{width:100%;margin-left:0;font-size:16px;line-height:normal;padding:.25rem .4rem;height:1.9rem;box-sizing:border-box;}
  .options{margin-left:.5rem;}
  .subbar{gap:.5rem;}
}
.mapstat{position:absolute;left:.8rem;bottom:.6rem;display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center;color:var(--dim);font-size:12px;pointer-events:none;z-index:5;}
.mapstat.dome{bottom:2.7rem;}   /* above the sky's bar, which sits at .7rem and is one line tall */
.muted{color:var(--dim);}
.empty{color:var(--dim);padding:2rem;text-align:center;}
button.retry{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 10px;margin-left:6px;cursor:pointer;font:inherit}
button.retry:hover{border-color:var(--accent);color:var(--accent)}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.2rem .5rem;font:inherit;cursor:pointer;}
.segmented{display:flex;}
.segmented button{border-radius:0;border-right-width:0;}
.segmented button:first-child{border-radius:4px 0 0 4px;}
.segmented button:last-child{border-radius:0 4px 4px 0;border-right-width:1px;}
.segmented button.on{background:var(--amber);color:#05070f;border-color:var(--amber);}
.segmented button{min-width:6.5rem;text-align:center;font-weight:inherit;}
.options{position:relative;margin-left:auto;}
.options summary{list-style:none;cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.2rem .5rem;font:inherit;}
.options summary::-webkit-details-marker{display:none;}
.options .panel{position:absolute;top:calc(100% + .25rem);right:0;z-index:10;display:flex;flex-direction:column;gap:.25rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.35);padding:.5rem;}
.options #advanced{display:flex;flex-direction:column;gap:.25rem;}
.layers{display:inline-flex;gap:.25rem;}
.layers[hidden]{display:none;}
#layers{display:none;}   /* the layer buttons duplicate the view segments; wired, never shown */
.layers button.on{border-color:var(--accent);color:var(--accent);}
#feed{font-size:11px;color:var(--dim);max-height:30vh;overflow:auto;margin-top:.4rem;}
#feed div{padding:.15rem 0;border-bottom:1px solid var(--line);}
#err{color:var(--warn);font-size:12px;}
.tlside{display:flex;flex-direction:column;align-items:flex-end;gap:2px;width:9rem;flex-shrink:0;}
/* One row, not three: .tlside is a column, and Earlier and Later as their own
   children were two more rows -- measured as 47px of map lost at the bottom. */
.tlnav{display:flex;align-items:center;gap:.25rem;}
.timeline{display:flex;align-items:flex-start;gap:.7rem;padding:.35rem 1rem .45rem;background:var(--panel);border-top:1px solid var(--line);font-size:12px;}
.tlwrap{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;}
/* change-density heatmap: one row per entity type, a grid of cells (empty = faint
   grey), colour = the type's colour, intensity = change count. Type names sit in a
   left gutter so they never overlap the grid; drag the grid to zoom. */
.tlprofrow{display:flex;align-items:stretch;}
.tlgutter{width:96px;flex:none;position:relative;}
.tlgutter .rowlab{position:absolute;right:6px;font-size:9px;line-height:9px;white-space:nowrap;opacity:.9;}
.tlprofile{flex:1;position:relative;min-height:14px;cursor:crosshair;}
.tlprofile .cell{position:absolute;border-radius:2px;}
.tlprofile .brush{position:absolute;top:0;bottom:0;background:rgba(88,166,255,.22);border-left:1px solid var(--accent);border-right:1px solid var(--accent);pointer-events:none;}
.tlaxisrow{display:flex;align-items:stretch;}
.tlspacer{width:96px;flex:none;}
.tlaxis{flex:1;position:relative;height:24px;}
/* a real graduated ruler: flat baseline + major (labelled) and minor ticks */
.tlruler{position:absolute;left:0;right:0;bottom:0;height:24px;pointer-events:none;}
.tlruler .base{position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--line);}
.tlruler .tick{position:absolute;bottom:0;width:1px;background:var(--line);}
.tlruler .tick.min{height:5px;opacity:.55;}
.tlruler .tick.maj{height:10px;background:var(--dim);}
.tlruler .lab{position:absolute;bottom:12px;transform:translateX(-50%);font-size:10px;line-height:1;color:var(--dim);white-space:nowrap;}
/* the range input is the moving cursor over the ruler — a thin needle, no fill */
.tlwrap input[type=range]{position:absolute;left:0;bottom:0;width:100%;height:24px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;}
.tlwrap input[type=range]:focus:not(:focus-visible){outline:none;}
.tlwrap input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tlwrap input[type=range]::-webkit-slider-runnable-track{height:24px;background:transparent;border:none;}
.tlwrap input[type=range]::-moz-range-track{height:24px;background:transparent;}
.tlwrap input[type=range]::-moz-range-progress{height:24px;background:transparent;}
.tlwrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:24px;margin-top:0;background:var(--accent);border:none;border-radius:1px;box-shadow:0 0 5px var(--accent);}
.tlwrap input[type=range]::-moz-range-thumb{width:3px;height:24px;background:var(--accent);border:none;border-radius:1px;box-shadow:0 0 5px var(--accent);}
.timeline select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;padding:.05rem .2rem;}

</style>
</head>
<body>
<header>
  <div class="segmented">
    <button id="vNet" title="The network: interfaces, addresses, segments, devices, endpoints">Network</button>
    <button id="vHosts" title="Machines: hosts, virtual machines, containers, pods">Machines</button>
    <button id="vApps" title="Applications: services, listening ports, databases">Applications</button>
  </div>
  <label class="muted" for="attr"><span class="lbl">search</span><input id="attr" spellcheck="false" autocomplete="off" placeholder="a name, a key, or key=value" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.1rem .35rem;width:11rem;margin-left:.3rem;font-family:inherit;"></label>
  <label class="muted" for="goto" style="position:relative"><span class="lbl">go to</span><input id="goto" spellcheck="false" autocomplete="off" placeholder="a machine, a service…" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.1rem .35rem;width:11rem;margin-left:.3rem;font-family:inherit;"></label>
  <button id="showall" class="off" style="white-space:nowrap" title="Put back everything a view, a highlight or the search is withholding">Show all<span id="showallN" class="badge"></span></button>
  <div class="stats">

  </div>
  <details class="options">

      <div id="advanced">

        <button id="labels">labels: names</button>
        <button id="fold">fold: on</button>
        <span class="layers" id="layers" hidden></span>
        <button id="edgemode">edges: on</button>
        <button id="inferred" hidden>inferred: off</button>
        <button id="static" hidden>layout: animated</button>
        <button id="extras">routes: off</button>
      <button id="relayout">relayout</button>
        <button id="resync">resync</button>
      </div>
    </div>
  </details>
</header>
<div class="subbar">
  <div class="legend" id="legend"></div>
  <span id="scopeStat" class="muted"></span>
</div>
<main>
  <div id="stage">
    <div id="net" class="laying"></div>
    <div class="mapstat" id="mapstat">
      <span><b id="nNodes">0</b> entities &middot; <b id="nEdges">0</b> relations shown &middot; fit to content</span>
      <span id="matchStat" class="muted"></span>
      <span id="capStat" style="color:var(--warn)"></span>
      <span id="narrowStat" style="color:var(--warn)"></span>
      <span id="incompleteStat" style="color:var(--warn)"></span>
      <span id="hint" class="muted"></span>
    </div>
    <canvas id="dome" hidden></canvas>
    <div class="domebar" id="domebar" hidden>
      <button id="recentre" title="Point back at the centre of the graph and reset the field of view">recentre</button>
      <button id="drift" title="Let the sky turn slowly on its own">drift</button>
      <button id="grid" class="on" title="Show the azimuth/altitude grid">grid</button>
      <span class="bearing" id="bearing" title="Where you are looking: azimuth and altitude">az 000&deg; alt +00&deg;</span>
    </div>

  </div>
  <div class="resizer" id="resizer" title="Drag to resize the panel"></div>
  <aside id="panel">
    <div id="ask">
      <textarea id="askQ" maxlength="1000" rows="2" placeholder="Ask a question about this map"></textarea>
      <button id="askBtn">Ask</button>
      <div id="askState" class="muted"></div>

    </div>
