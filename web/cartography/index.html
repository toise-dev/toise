</main>
<footer class="timeline" id="timeline">
  <div class="tlwrap">
    <div class="tlprofrow">
      <div class="tlgutter" id="tlGutter"></div>
      <div class="tlprofile" id="tlProfile" title="Change density per entity type over the selected window — coloured cells are changes, faint cells are none."></div>
    </div>
    <div id="tlErr" class="muted"></div>
    <div class="tlaxisrow">
      <div class="tlspacer"></div>
      <div class="tlaxis">
        <div class="tlruler" id="tlRuler"></div>
      </div>
    </div>
  </div>
  <div class="tlside">
    <span class="tlnav"><button id="tlEarlier" title="Show the window before this one (earlier)">&#9666;</button><label class="muted">Window <select id="tlWin">
      <option value="1h">1h</option><option value="6h">6h</option>
      <option value="24h">24h</option><option value="7d">7d</option></select></label><button id="tlLater" title="Show the window after this one (later)">&#9656;</button></span>
    <span id="tlLabel">24h</span>
    <input type="range" id="tlAt" min="0" max="1000" value="1000" step="1" title="The handle picks the moment to revisit; playback starts on release" style="width:100%">
    <button id="tlLive">live</button>
    <span id="tlAtLabel" class="muted"></span>
    <span id="tlEvents" class="muted"></span>
  </div>
</footer>
<script>
// Fixed endpoint: the portal relay owns the GraphQL documents and only accepts
// persisted-query ids, so a page-side override would just point this elsewhere.
// The tenant is imposed by the relay from the portal session, never by the page.
const API='/cartography/graphql';
function gqlHeaders(){ return {'Content-Type':'application/json'}; }

const EMBEDDED = window.parent !== window;

function sendContext(msg) {
  if (!EMBEDDED) return;
  try {
    // Explicit origin only: '*' would leak context to any embedding page.
    // A refusing parent must never break the embedded page.
    window.parent.postMessage(msg, location.origin);
  } catch (e) {}
}

function publishView() {
  let value, label;
  if (activeView === 'vNet')       { value = 'network';      label = 'Network'; }
  else if (activeView === 'vHosts') { value = 'machines';     label = 'Machines'; }
  else if (activeView === 'vApps')  { value = 'applications'; label = 'Applications'; }
  else                              { value = 'all';          label = 'Whole map'; }
  sendContext({ v: 1, type: 'context.view', payload: { kind: 'view', value: value, label: label } });
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Stellar colour runs blue-white through white and yellow to orange and red.
// Types take a class in order of first sight — the same stable-by-arrival rule
// the flat palette used, so a type keeps its colour across a reload.
const PALETTE=["#a8c2ff","#e9efff","#fbf4dd","#ffdf8f","#ffb46a","#ff8d6d","#8fa7ff","#d7b6ff","#bcd2ff","#ffe9b8","#ffc9a6","#c7ddff"];
// Internal type names are the model's vocabulary, not a reader's. A fallback to the
// raw name keeps an unknown type visible rather than silently unlabelled.
const TYPE_LABEL={
  host:'Host', 'compute.vm':'Virtual machine', container:'Container', pod:'Pod',
  'service.instance':'Service', 'service.listener':'Listening port', 'host.service':'System unit',
  db:'Database', 'network.interface':'Interface', 'network.address':'IP address',
  // "Network segment" and not "Network": the view tab is also called Network and
  // does something else entirely. Two controls with one name, one of which hides a
  // type while the other changes the whole view.
  'network.segment':'Network segment', 'network.device':'Network device', 'network.endpoint':'Endpoint',
  'network.route':'Route', 'network.neighbor':'Neighbour', 'cloud.resource':'Cloud resource',
  process:'Process'
};
const typeLabel=t=>TYPE_LABEL[t]||t;
const typeColor={};
const colorFor=t=>{ if(!(t in typeColor)) typeColor[t]=PALETTE[Object.keys(typeColor).length%PALETTE.length]; return typeColor[t]; };
const hidden=new Set();
// Declared with the other state, not next to the layer buttons: rebuild() can run
// before the wiring executes, and a temporal-dead-zone error there would blank the
// page on load.
let presentTypes=new Set();
const ENT={}, REL={};
const nodes=new vis.DataSet(), edges=new vis.DataSet();
let fitted=false;
let fitAfterSettle = false; // requested, not automatic: auto-fit would steal the reader's manual zoom/pan

const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
  // The library's pre-computed layout was measured as the cause of the blank
  // white canvas on a large fleet, so it is disabled here.
  layout:{improvedLayout:false},
  nodes:{shape:'dot',size:14,font:{color:'#c3d1ea',face:"'Geist Sans', system-ui, sans-serif",size:11,strokeWidth:0,vadjust:0},borderWidth:0},
  edges:{color:{color:'rgba(150,178,235,0.26)',highlight:'#cfe0ff',hover:'#cfe0ff'},
         font:{color:'#6f80a0',size:10,strokeWidth:3,strokeColor:'#05070f',align:'middle'},
         arrows:{to:{enabled:true,scaleFactor:.3}},smooth:false,width:0.9,selectionWidth:1.6},
  physics:{barnesHut:{gravitationalConstant:-12000,centralGravity:0.25,springLength:110,springConstant:.045,damping:.6,avoidOverlap:0.2},stabilization:{iterations:1500}},
  interaction:{hover:true,tooltipDelay:120,multiselect:true}
});

// --- the field ----------------------------------------------------------
// Unnamed stars behind the data, drawn in GRAPH coordinates so they pan and
// zoom with the chart instead of sliding behind it. Seeded, so it is the same
// sky on every reload: a chart whose background shuffles reads as noise.
const FIELD=(function(){ let s=20261029; const out=[];
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<460;i++) out.push({x:(rnd()-0.5)*3400,y:(rnd()-0.5)*2600,
                                   r:0.4+rnd()*1.35,a:0.10+rnd()*0.5});
  return out; })();
net.on('beforeDrawing',ctx=>{ for(const f of FIELD){
  ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
  ctx.fillStyle='rgba(205,222,255,'+f.a.toFixed(2)+')'; ctx.fill(); } });

// --- layout settling: run the force simulation only until it stabilises, then
// FREEZE it, so the graph stops drifting instead of jittering indefinitely (the
// "wait for it to stop moving" annoyance). A structural change (a node or edge
// added/removed) re-runs the simulation for a bounded window and freezes again;
// attribute-only updates (heartbeats) never disturb the layout. "relayout" re-runs
// it on demand.
let freezeTimer=null;
function freeze(){ clearTimeout(freezeTimer); freezeTimer=null; net.setOptions({physics:{enabled:false}}); }
function settle(ms=1600){
  // Not over a spread, whoever asks -- unfolding, relayout, the lot: physics
  // would scramble the eased picture. The fit that was expected still happens.
  if(spreadApplied){ if(fitAfterSettle){ fitAfterSettle=false; fitEmphasised(); } return; }
  net.setOptions({physics:{enabled:true}}); clearTimeout(freezeTimer);
  freezeTimer=setTimeout(()=>{ freeze(); rememberSky(); if(fitAfterSettle){ fitAfterSettle=false; fitEmphasised(); } }, ms); }
net.on('zoom',()=>{ syncLabelSize(); declutterLabels(); });   // zooming spreads the boxes: names can come back   // the font is in canvas units, so it shrinks with the view
net.on('stabilizationIterationsDone',()=>{ freeze();   // layout done -> freeze, remember, spread, fit, reveal
  if(!fitted) return;   // the empty-graph init pass, before any data — nothing to reveal yet
  rememberSky();
  // A large estate opens narrowed to Machines before this first settle: the
  // spread could not run then (the sky was not settled), so it runs now.
  if(activeView && !spreadApplied){ applySpread(); declutterLabels(); }
  // Through fitEmphasised, not a bare fit: this is the LAST framing the reader
  // sees. A bare fit reserved nothing for the strip -- the six-second reload used
  // to re-frame a moment later and hid that -- and it would now frame the
  // positions of the nodes that were REMOVED, leaving the camera on empty sky.
  fitEmphasised();
  const nv=document.getElementById('net'); if(nv) nv.classList.remove('laying');
  const err=document.getElementById('err'); if(err && err.textContent.startsWith('Drawing ')) err.textContent=''; });

// Node labels: a toggle between human-readable names and raw technical ids.
// Identities are opaque (host.id is a UUID, a listener is <host-uuid>:port); name
// mode resolves the readable name each entity type actually carries. The tooltip
// always shows the full identity, so names never hide the precise id.
let labelMode=localStorage.getItem('toise_viz_labels')||'name';   // 'name' | 'id'
const attrsOf=n=>Object.fromEntries((n.attributes||[]).map(a=>[a.key,a.value]));
const identOf=n=>Object.fromEntries((n.identity||[]).map(a=>[a.key,a.value]));
function hostNameById(hid){ for(const e of Object.values(ENT)){ if(e.type==='host' && identOf(e)['host.id']===hid) return attrsOf(e)['host.name']; } return null; }

// --- inferred links (a derived overlay; ON by default) ----------------------
// The engine stores facts only and never merges by heuristic, so an IP carried as
// a plain attribute (a listener's bind address, an endpoint's server.address, a
// route's next hop) is NOT linked to the network.address entity for that IP — the
// same address ends up smeared across disconnected nodes. This overlay draws a
// dashed edge from each IP-bearing entity to the matching network.address node, so
// the graph reads as connected. These edges are DERIVED, not stored relations.
// ON unless the reader turned it off. A graph database is used precisely so that
// relations can be traversed, and the derived links are often the only thing
// joining two halves of a real chain — a gateway's outbound dependency and the
// dashboard listening behind it are stored as an endpoint and a listener that no
// stored edge connects. Defaulting this overlay off produced a graph that looked
// like it had no links at all, and a reader has no way to tell that apart from a
// graph that genuinely has none. Off by default hid the answer; the toggle stays
// for whoever wants only stored facts.
let inferred=localStorage.getItem('toise_viz_inferred')!=='0';
const IPV4=/(?:^|[^0-9.])(\d{1,3}(?:\.\d{1,3}){3})(?![0-9.])/g;
// Host-local / non-routable addresses are NOT global join points: the same IP
// exists independently on every host, so linking through it smears unrelated nodes
// together (e.g. containers on different machines via the Docker bridge gateway
// 172.17.0.1). Skip wildcard, loopback, link-local (RFC 3927), and the Docker
// default bridge. (Other RFC 1918 ranges can be legitimately routable, so the real
// fix for a host-local address is producer-side — don't emit it as a shared entity.)
// Same list as the producer contract's "A bare IP is not a globally unique
// identity" rule, which is normative; this overlay only has to agree with it.
const notJoinable=ip=> !ip || ip==='0.0.0.0' || ip.startsWith('127.') || ip==='::' || ip==='::1'
  || ip.startsWith('169.254.')   // link-local, IPv4 (RFC 3927)
  || /^fe[89ab]/i.test(ip)       // link-local, IPv6 (fe80::/10) — scoped to one link
  || ip.startsWith('172.17.');   // Docker default bridge — same gateway on every host
function inferredEdges(visible){
  const addrByIp={};
  for(const n of Object.values(ENT)){ if(n.type==='network.address'){ const ip=identOf(n)['network.address']; if(ip) addrByIp[ip]=n.id; } }
  const real=new Set(); for(const r of Object.values(REL)){ real.add(r.fromId+'|'+r.toId); real.add(r.toId+'|'+r.fromId); }
  const out=[], seen=new Set();
  for(const n of Object.values(ENT)){
    if(n.type==='network.address' || !visible.has(n.id)) continue;
    const blob=[...(n.identity||[]),...(n.attributes||[])].map(a=>a.value).join(' ');
    const ips=new Set(); let m; IPV4.lastIndex=0; while((m=IPV4.exec(blob))) ips.add(m[1]);
    for(const ip of ips){ if(notJoinable(ip)) continue; const aid=addrByIp[ip];
      if(!aid || aid===n.id || !visible.has(aid) || real.has(n.id+'|'+aid)) continue;
      const id='inf:'+n.id+'~'+aid; if(seen.has(id)) continue; seen.add(id);
      out.push({id,from:n.id,to:aid,label:'≈',dashes:true,arrows:'',
                color:{color:'#e8b06a',opacity:0.65},font:{color:'#e8b06a',size:9},smooth:false}); }
  }
  return out;
}

// --- attribute filter: highlight matching nodes, dim the rest (exploratory) --
// Type a key (matches nodes carrying it), key=value (exact), or a free substring
// (matched against keys and values). It is a read-time view over the data already
// fetched — no query change — so it works on whatever attributes producers emit.
let attrQuery='', filterOnly=false;
// edges: shown faint / with type labels / hidden. Default hides edges on a big graph
// (they're an unreadable web) unless the user set a preference; small graphs keep them.
const edgePref=localStorage.getItem('toise_viz_edges');   // 'on' | 'labels' | 'off' | null
let showEdges=edgePref!=='off', edgeLabels=edgePref==='labels';
let staticLayout=localStorage.getItem('toise_viz_static')==='1';   // keep the layout fixed, don't re-animate on updates
function attrMatch(n){
  const q=attrQuery.trim().toLowerCase(); if(!q) return true;
  const kvs=[...(n.identity||[]),...(n.attributes||[])];
  const eq=q.indexOf('=');
  if(eq>=0){ const k=q.slice(0,eq).trim(), v=q.slice(eq+1).trim();
    return kvs.some(a=>a.key.toLowerCase()===k && (v===''||String(a.value).toLowerCase()===v)); }
  return kvs.some(a=>a.key.toLowerCase().includes(q) || String(a.value).toLowerCase().includes(q));
}

function idLabel(n){
  const id=(n.identity||[]);
  if(id.length){ const named=id.find(a=>/(^|\.)(name|id|endpoint|address)$/i.test(a.key));
    return (named?named.value:id.map(a=>a.value).join('·')).toString(); }
  return n.type+' '+n.id.slice(0,6);
}
// The readable name is Toise's to decide, not this page's. `displayName` is a
// contract field computed from a per-type registry, so asking for it is how a
// consumer gets the same name every other consumer shows.
//
// This page used to reimplement that registry, one case per type, and the copy
// had drifted where it mattered most: a network.device was labelled from its
// IDENTITY with the rung prefix stripped, so a switch reporting sysName
// "1000-5510HI-SR08" was drawn as "800063a280ec9b8b46032a00000001". The
// producer emitted sys.name, the server resolved it, and this page threw it
// away. Every other case merely duplicated what the server already returns.
//
// The one case kept is service.listener, and only because it composes something
// the registry does not: the port, and the host behind the endpoint's uuid. That
// is an enrichment, not a second opinion about the name.
function nameLabel(n){
  const A=attrsOf(n), I=identOf(n);
  if(n.type==='service.listener'){
    const ep=I['service.endpoint']||''; const m=ep.match(/^([0-9a-f-]{36}):(.+)$/i);
    const proc=A['process.executable.name']||n.displayName;
    if(proc) return proc+(m?' '+m[2]:'');
    return m?((hostNameById(m[1])||'')+':'+m[2]):ep;
  }
  if(n.displayName) return n.displayName;
  // Only reached against a server too old to send the field.
  const nk=Object.keys(A).find(k=>/(^|\.)name$/i.test(k))||Object.keys(I).find(k=>/(^|\.)name$/i.test(k));
  return (nk&&(A[nk]||I[nk]))||idLabel(n);
}
// The domain suffix the tenant's hosts share is noise on a map of that tenant:
// twenty names ending in the same ".senhub.io" are twenty labels a third wider
// than they need to be, and width is what the names collide on. Computed from
// the hosts themselves, never from a list, and only when at least two share it,
// so a lone fully qualified name keeps its full form. The full name stays in
// the tooltip and the card.
let COMMON_SUFFIX = null;
const AMBIGUOUS_SHORT = new Set();   // short forms two hosts would share: both keep their full name
function recomputeShortNames(){
  COMMON_SUFFIX = null; AMBIGUOUS_SHORT.clear();
  const counts = new Map();
  const hosts = Object.values(ENT).filter(n => n.type === 'host');
  for(const n of hosts){
    const suf = fqdnSuffix(nameLabel(n) || '');
    if(suf) counts.set(suf, (counts.get(suf) || 0) + 1);
  }
  let best = null, bestN = 1;
  for(const [suf, n] of counts) if(n > bestN){ best = suf; bestN = n; }
  COMMON_SUFFIX = best;
  if(!COMMON_SUFFIX) return;
  const seen = new Map();
  for(const n of hosts){
    const short = shortOf(nameLabel(n) || '', true);
    seen.set(short, (seen.get(short) || 0) + 1);
  }
  for(const [short, n] of seen) if(n > 1) AMBIGUOUS_SHORT.add(short);
}
// The suffix of a name that reads as a qualified host name, or ''. Split at the
// first dot and tested with linear patterns: the one-regex version had an
// ambiguous group and would have backtracked quadratically on a long dotless
// name, and names come from producers. Capped at the DNS maximum first.
function fqdnSuffix(name){
  if(!name || name.length > 253) return '';
  const i = name.indexOf('.');
  if(i <= 0 || i === name.length - 1) return '';
  const head = name.slice(0, i), tail = name.slice(i + 1);
  if(!/^[A-Za-z0-9_-]+$/.test(head) || !/[A-Za-z]/.test(head)) return '';
  if(!/^[A-Za-z0-9.-]+$/.test(tail)) return '';
  return tail;
}
function shortOf(name, raw){
  if(!COMMON_SUFFIX || !name) return name;
  // Never an address: 10.90.0.3 would become "10", which is not a shorter name
  // for that thing, it is a different thing.
  if(/^[0-9.:]+$/.test(name)) return name;
  if(!name.endsWith('.' + COMMON_SUFFIX)) return name;
  const short = name.slice(0, name.length - COMMON_SUFFIX.length - 1);
  if(!short || /^[0-9]+$/.test(short)) return name;
  if(!raw && AMBIGUOUS_SHORT.has(short)) return name;
  return short;
}
function labelOf(n){
  const full = (labelMode==='name'?nameLabel(n):idLabel(n))||n.id.slice(0,6);
  return (labelMode==='name' && n.type==='host') ? shortOf(full) : full;
}
// The tooltip opens with the FULL display name. It used to carry the type, the
// identity and the id -- a host's identity is a UUID -- so a host drawn under
// its short name had its full name nowhere on hover, which the short names had
// promised. Measured by lab on the production page.
function titleOf(n){
  const I=(n.identity||[]).map(a=>a.key+'='+a.value).join(', ');
  const full=nameLabel(n);
  return (full?full+'\n':'')+n.type+(I?' · '+I:'')+' · '+n.id;
}

// --- folding: a graph of 546 entities is unreadable at any stroke weight ------
// Measured on a real bench: 88% of entities are the CHILD of a single owner —
// an interface belongs to a device, a service runs on a host, a route belongs to
// a machine. Folding children into their owner takes 546 nodes to 68, which is
// the only change that alters the order of magnitude. Everything else (edge
// weight, node size) only reads well once that is done.
//
// CHILD_SIDE says, for each relation type, which END is the child. Only these
// relations nest; everything else is a peer link and is aggregated, never folded.
const CHILD_SIDE={has_interface:'to',has_route:'to',has_segment:'to',runs_on:'from',bound_to:'from',listens_on:'from'};
let folded=localStorage.getItem('toise_viz_folded')!=='0';   // ON by default: the dense case is the normal case
const dimmed=new Set();                                       // types a view turns down; NOT hidden -- the legend owns hiding
let degree={};                                                // filled by each redraw; the label pass reads it afterwards
const expanded=new Set();                                     // owners the reader opened, by id
const expandedKinds=new Set();                                // "<owner>\u0000<type>" the reader opened past the kind step

// Opening an owner used to hand back every child at once: double-click a host
// holding 357 services and you got 357 nodes — the hairball you folded to escape.
// Measured at two customers: 367 entities to 3 drawn nodes, 548 to 6, because 97%
// of their relations are a single runs_on. From an unreadable hairball to a nearly
// empty graph, and both useless.
//
// So expansion has three levels, not two: owner -> kinds -> things. A switch with
// twelve ports opens to "12 network.interface" and then to the ports, which costs
// one click and loses nothing. A host with 357 services opens to
// "357 service.instance" and STOPS there until the reader narrows it.
//
// A per-type fold switch was checked against those numbers first and rejected: on
// both estates the density IS one type, so folding everything except services
// leaves 360 of 367 nodes. A knob that does nothing on the shape that needs it.
const KIND='\u0000kind\u0000';
function kindId(owner,type){ return KIND+owner+'\u0000'+type; }
function isKind(id){ return typeof id==='string' && id.slice(0,KIND.length)===KIND; }
function kindParts(id){ const a=id.slice(KIND.length).split('\u0000'); return {owner:a[0],type:a[1]}; }

// Past this many children of one kind, opening draws the hairball again, so the
// reader is handed to the attribute filter instead. 60 is above any real port or
// interface count (the cases where opening everything is right) and far below the
// densities that produced this issue.
// Above a few thousand drawn nodes the main thread stays blocked for tens of
// seconds, so the drawing is capped and the cap is stated on screen.
const MAX_DRAWN=2500;
const KIND_OPEN_MAX=60;

// The whole grid is computed in SCREEN PIXELS, which is the only unit that
// decides whether a name is readable. Canvas units are then just those pixels:
// the fit scales them, and a tile that fits at scale 1 cannot overlap.
// An earlier version tested "is the tile bound by its width", which was a proxy,
// and it answered on the WIDENED tile -- so it reported that labels fit right
// after widening had made them not fit. Measured: 96 overlaps out of 260.
// entity.lifecycle.status is an OPEN enum, so an unrecognised value must NOT be
// painted as if it were fine: it gets the neutral border, exactly like an absent
// one. And only the border carries state -- the fill is the type, which is what
// the legend maps, and repainting it would make the legend lie.
const LIFECYCLE_BORDER = {active:'#7fd4a8', maintenance:'#e8b06a', decommissioning:'#e8b06a', retired:'#6f80a0'};
function stateBorder(n){
  const a=(n.attributes||[]).find(x=>x.key==='entity.lifecycle.status');
  const v=a&&typeof a.value==='string'?a.value.trim().toLowerCase():'';
  return v && Object.prototype.hasOwnProperty.call(LIFECYCLE_BORDER,v) ? LIFECYCLE_BORDER[v] : null;
}

function computeOwners(){
  OWNER={};
  for(const r of Object.values(REL)){
    const side=CHILD_SIDE[r.type]; if(!side) continue;
    const child=side==='from'?r.fromId:r.toId, owner=side==='from'?r.toId:r.fromId;
    if(child!==owner && !OWNER[child]) OWNER[child]=owner;   // first owner wins; a second would be a modelling error, not ours to resolve
  }
}
// repOf: the node actually drawn for x. Walk up while the parent is folded shut;
// stop at the first ancestor the reader opened, or at the top.
function repOf(id,guard){
  if(!folded) return id;
  // Before the climb: a revealed entity stands for itself, or it would fold into
  // a carrier and never be built at all, which would make the exemption in
  // keptOnMap moot for exactly the entities that need it most -- in Machines, a
  // service lives folded inside its host.
  if(REVEALED.has(id)) return id;

  const seen=guard||new Set();
  let cur=id;
  for(;;){
    if(seen.has(cur)) return cur;   // cycle guard: a malformed graph must not hang the page
    seen.add(cur);
    const up=OWNER[cur];
    if(!up || !ENT[up]) return cur;
    // An owner the READER unchecked takes its folded children with it. Stopping
    // here instead made each child represent itself, so unchecking "Interface"
    // surfaced the 92 addresses and listeners folded inside it: measured, 185
    // drawn became 277, and unchecking a type ADDED elements to the map. The
    // children now fold on up to the first ancestor still drawn -- counted
    // inside it rather than revealed beside it.
    //
    // This line used to return here, to stop Applications folding its services
    // into hosts it did not draw and coming out empty. That reason is gone: a
    // view fills `dimmed`, never `hidden`, and `hidden` is now only ever the
    // reader's own legend and layer buttons.
    //
    // No exception for the view's subject. One was tried and it broke the rule it
    // was meant to soften: in Applications with Host switched off, the services
    // and listeners ARE the subject, so all of them surfaced at once -- 22 drawn
    // became 554. A child of a switched-off parent folds on up, and if no
    // ancestor is drawn it is not drawn either. The notice below says so, because
    // a view that empties without a word is the worse failure of the two.
    if(hidden.has(ENT[up].type)){ cur=up; continue; }
    if(expanded.has(up)){
      // The owner is open. Its children are represented by one node per KIND
      // until the reader opens that kind too — the middle of the three levels.
      const t=ENT[cur]?ENT[cur].type:'';
      return (t && !expandedKinds.has(up+'\u0000'+t)) ? kindId(up,t) : cur;
    }
    cur=up;
  }
}
// What a folded node stands for, BY TYPE, so the badge says what is inside and
// not only how much. Measured at a customer: an estate that is one host and 357
// services, 97% of its relations a single runs_on. Folded, that is three nodes,
// and a bare "(357)" reads as an empty graph. "(357 service.instance)" reads as
// an accurate summary of an estate that really is shaped that way.
function foldedInside(){
  const n={};
  if(!folded) return n;
  for(const id of Object.keys(ENT)){
    const r=repOf(id); if(r===id) continue;
    const by=(n[r]=n[r]||{}); const t=ENT[id].type; by[t]=(by[t]||0)+1;
  }
  return n;
}
// "(357 service.instance)" for one kind, "(37 service.instance, 1 network.interface)"
// for two, "+N" past that so a label stays a label. Full type names, never
// abbreviated: a shortened type is a type the reader has to guess.
function badge(by){
  if(!by) return '';
  const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  return '  ('+e.slice(0,2).map(([t,c])=>c+' '+typeLabel(t)).join(', ')+(e.length>2?', +'+(e.length-2):'')+')';
}
function badgeTotal(by){ return by?Object.values(by).reduce((a,b)=>a+b,0):0; }
function badgeFull(by){ return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([t,c])=>c+' '+typeLabel(t)).join(', '); }

// kindGroups counts what each kind node stands for. Built from repOf, so it
// cannot disagree with what is actually drawn.
function kindGroups(){
  const g={};
  if(!folded) return g;
  for(const id of Object.keys(ENT)){
    if(hidden.has(ENT[id].type)) continue;
    const r=repOf(id); if(!isKind(r)) continue;
    const k=kindParts(r);
    const e=(g[r]=g[r]||{owner:k.owner,type:k.type,n:0,cited:0});
    e.n++;
    // A cited element folded into its owner must still light something up, or an
    // answer citing it looks like an answer citing nothing.
    if(CITED.size&&CITED.has(ENT[id].identityFingerprint)) e.cited++;
  }
  return g;
}

// say shows a transient line in the toolbar. Not an alert(): a modal dialog
// blocks the page and the layout animation behind it.
let hintTimer=null;
function say(msg){
  const h=document.getElementById('hint'); if(!h) return;
  h.textContent='\u00b7 '+msg; h.style.color='var(--warn)';
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{ h.textContent=''; h.style.color=''; },6000);
}

// Beyond a thousand nodes, extra iterations cost seconds of blocked main thread
// without making the layout more readable.
// The size decides only at the FIRST layout. Every later one just relaxes nodes
// that are already placed, so it has to be fast rather than pretty: measured in
// production, a view change paid 1500 iterations and froze the tab for 19 s on a
// park of 2 330 entities, where 150 iterations bring it to 0.8 s.
const LABEL_MIN_PX = 12;
let lastLabelSize = null;
function syncLabelSize() {
  // Screen size = font size * scale, so dividing by scale keeps it constant on screen.
  // Clamp at 11 so zooming in never shrinks labels below their base size.
    // Capped: past this the label is wider than the thing it names, and a fit that
  // still needs more is telling us the view draws too much, not that the font is small.
  // Capped high, not low: the old 40 existed to keep a label from growing wider
  // than its node, which is a COLLISION worry -- and collisions are now settled
  // by dropping names outright. Holding 12 screen pixels matters more than a
  // tidy ratio, so the cap only stops the absurd.
  const size = Math.min(140, Math.max(11, Math.ceil(LABEL_MIN_PX / net.getScale())));
  if (size !== lastLabelSize) {
    lastLabelSize = size;
    labelSizeCanvas = size;
    net.setOptions({nodes:{font:{size:size}}});
  }
}

// Frames the LIT nodes only. A view no longer moves anything, so the camera is
// the only thing that follows it: everything stays where the reader learnt it,
// and a view decides where to look rather than what exists.
function listenForHighlight() {
  // Any page embedding this one can post here, so every field is checked
  // before use; a malformed message must never reach the UI or the state.
  window.addEventListener('message', (event) => {
    if (event.origin !== location.origin) return;
    if (event.source !== window.parent) return;
    const data = event.data;
    if (data === null || typeof data !== 'object') return;
    if (data.v !== 1 || data.type !== 'highlight') return;
    // Two envelope shapes accepted on purpose: the published contract nests the
    // list under `fingerprints`, and the Dock sends the bare array. Strict on
    // every entry, tolerant on the wrapper -- rejecting a message over the shape
    // of its box would have been a silent refusal nobody could see.
    const payload = data.payload;
    const fingerprints = Array.isArray(payload) ? payload : (payload && payload.fingerprints);
    if (!Array.isArray(fingerprints)) return;
    if (fingerprints.length > 500) return;
    const valid = [];
    for (const fp of fingerprints) {
      if (typeof fp === 'string' && fp.length >= 1 && fp.length <= 128 && /^[A-Za-z0-9:._-]+$/.test(fp)) {
        valid.push(fp);
      }
    }
    if (fingerprints.length > 0 && valid.length === 0) {
      say('The highlight carried no usable reference; nothing was changed.');
      return;
    }
    CITED.clear();
    for (const fp of valid) CITED.add(fp);
    rebuild();
    fitEmphasised();
  });
}

const VIS_LABEL_DROP = 10.6;   // measured on the renderer, not assumed
// Text width at the labels' SCREEN size, from a 2D context with the same face.
// One offscreen canvas, created on first use.
let measureCtx = null;
let labelSizeCanvas = 12;   // what syncLabelSize last set, in canvas units
function labelScreenPx(){ return labelSizeCanvas * (net ? net.getScale() : 1); }
function labelWidthPx(text){
  const px = labelScreenPx();
  try{
    if(!measureCtx){ const c = document.createElement('canvas'); measureCtx = c.getContext('2d'); }
    if(!measureCtx) return text.length * px * 0.55;
    // At the labels' REAL screen size: 12px is only the target below scale 1,
    // and past it the font is 11 canvas units times the scale.
    measureCtx.font = px + "px 'Geist Sans', system-ui, sans-serif";
    return measureCtx.measureText(text).width;
  }catch(_){ return text.length * px * 0.55; }
}

function declutterLabels() {
  // Labels are removed, never moved: the layout is fixed and already
  // learned by the reader, so only visibility may change between views.
  // A HOST always carries its name -- Matthieu's ruling: twenty names is the
  // reason the Machines view exists, and the same holds for a host drawn in
  // any view. Hosts are placed first and never dropped; everything else shares
  // what room is left, cited entities first, then the most connected, then id
  // order so identical views always resolve identically.
  // A kind node is a count, not an entity: it has no type to dim and no
  // fingerprint to cite, so it is left alone rather than guessed about.
  // Drawn entities only. A node withheld by the search, the highlight or the
  // "only" mode is still in the dataset, hidden, with a position -- and once a
  // host's name became unconditional, a hidden host's name went on the board
  // and cost a visible neighbour its label against a box nobody could see.
  // (Its disc had been an obstacle before, too, which was never right either.)
  const ids = onMapIds().filter(id => {
    const e = ENT[id];
    return e && !dimmed.has(e.type);
  });
  if (ids.length < 2) return;

  const scale = net.getScale();
  const pos = net.getPositions(ids);

  const sorted = ids.slice().sort((a, b) => {
    const ea = ENT[a], eb = ENT[b];
    // Hosts first, before even the cited: a host's name is unconditional, so it
    // must be on the board before anything that could be dropped for it.
    const ha = ea.type === 'host', hb = eb.type === 'host';
    if (ha !== hb) return ha ? -1 : 1;
    const ca = CITED.has(ea.identityFingerprint) ? 0 : 1;
    const cb = CITED.has(eb.identityFingerprint) ? 0 : 1;
    if (ca !== cb) return ca - cb;
    const da = degree[a] || 0, db = degree[b] || 0;
    if (da !== db) return db - da;
    return a < b ? -1 : 1;
  });

  // The discs are obstacles too. Testing a name only against other NAMES let it
  // sit squarely on a neighbour's disc -- measured, "sfh912.senhub.io" across the
  // circle next to it. Every lit disc is an occupied box before the first name is
  // placed; a node's own disc is excluded, since its name hangs just below it.
  const discs = {};
  for (const id of ids) {
    const nd = nodes.get(id), q = pos[id];
    if (!nd || !q) continue;
    const r = (typeof nd.size === 'number' ? nd.size : 0) * scale;
    discs[id] = { x1: q.x * scale - r, x2: q.x * scale + r, y1: q.y * scale - r, y2: q.y * scale + r };
  }
  const hits = (b, o) => b.x1 < o.x2 && b.x2 > o.x1 && b.y1 < o.y2 && b.y2 > o.y1;
  const kept = [];
  const updates = [];

  const labelH = (labelScreenPx() + 4) / scale;   // the label's height in canvas units
  for (const id of sorted) {
    const label = labelOf(ENT[id]);
    const p = pos[id];
    if (!p || !label) continue;
    const cx = p.x * scale;
    const nd = nodes.get(id);
    const r = (nd && typeof nd.size === 'number') ? nd.size : 0;
    // MEASURED, not estimated. "length × 6.6 + 8" under-read proportional text
    // enough that eight overlapping pairs passed as clear while only one name
    // was moved -- the portal counted the overlaps on the rendered page.
    const w = labelWidthPx(label) + 8;
    // Drop by the node's own radius plus the renderer's gap, both in canvas
    // units, THEN convert: a constant drop is wrong by exactly the size of the
    // disc, which is how this pass cleared Network and missed Machines.
    const lh = labelScreenPx() + 4;
    const boxAt = (dy) => {
      const top = (p.y + r + VIS_LABEL_DROP + dy) * scale;
      return { x1: cx - w / 2, x2: cx + w / 2, y1: top, y2: top + lh };
    };
    const blocked = (b) => kept.some(k => hits(b, k))
      || ids.some(other => other !== id && discs[other] && hits(b, discs[other]));
    // The camera frames discs, not labels, so a seat above a disc at the top
    // edge can lie outside the canvas. A seat is only a seat inside the frame.
    const frameH = (document.getElementById('net') || {}).clientHeight || 0;
    const inFrame = (dy) => {
      if (!frameH) return true;
      const top = net.canvasToDOM({ x: 0, y: p.y + r + VIS_LABEL_DROP + dy }).y;
      return top >= 0 && top + 16 <= frameH;
    };
    const unconditional = ENT[id].type === 'host';
    if (unconditional) {
      // A host's name is never dropped. When its default seat would land on a
      // name already kept, it is MOVED -- above the disc, then further below --
      // and only when every seat is taken does it go on its default seat
      // regardless. vis only shifts a label vertically, so seats are vertical.
      const seats = [0, -(2 * r + 2 * VIS_LABEL_DROP + labelH), labelH + 2, -(2 * r + 2 * VIS_LABEL_DROP + 2 * labelH + 2), 2 * labelH + 4];
      let chosen = seats[0], box = boxAt(seats[0]);
      for (const dy of seats) { const b = boxAt(dy); if (!blocked(b) && inFrame(dy)) { chosen = dy; box = b; break; } }
      kept.push(box);
      updates.push({ id, label, font: { vadjust: chosen } });
      continue;
    }
    // Any other label survives only if its box touches no box already kept and
    // no disc; it is never moved, since the room it would move into belongs to
    // the names placed before it.
    const box = boxAt(0);
    const clash = blocked(box);
    if (!clash) kept.push(box);
    updates.push({ id, label: clash ? undefined : label, font: { vadjust: 0 } });
  }

  // One single update so the map is not redrawn once per node.
  nodes.update(updates);
}

// Frames what is DRAWN, read from the nodes themselves rather than recomputed
// from whichever rule withheld the rest. Since what is not kept is now removed
// instead of dimmed, a bare fit would frame the hidden nodes' positions too and
// leave the camera staring at empty sky; and there are four ways to withhold
// something -- a view, the legend, the search, a highlight -- which a rule-based
// target would have to enumerate correctly every time. The drawn node knows.
function onMapIds() {
  const out = [];
  for (const id of nodes.getIds()) {
    const nd = nodes.get(id);
    if (nd && nd.hidden !== true) out.push(id);
  }
  return out;
}

function fitEmphasised() {
  const shown = onMapIds();
  if (CITED.size) {
    // A highlight frames what was highlighted. Framing everything drawn instead
    // would bury the handful of things the Dock asked to look at.
    const cited = [];
    for (const id of shown) {
      const n = ENT[id];
      if ((n && CITED.has(n.identityFingerprint)) || CITED_OWNERS.has(id)) cited.push(id);
    }
    if (cited.length) { fitReservingPanel(cited); declutterLabels(); return; }
  }
  // null rather than an empty list: fitting "no nodes" is not a frame, and an
  // empty map should still be framed as a whole rather than left wherever it was.
  fitReservingPanel(shown.length ? shown : null);
  declutterLabels();
}

function fitReservingPanel(onlyNodes) {
  try { net.fit(onlyNodes ? {nodes:onlyNodes,animation:false,maxZoomLevel:3} : {animation:false,maxZoomLevel:3}); } catch (e) {}
  syncLabelSize();   // vis emits 'zoom' for the reader's gestures only, never for fit()
  const panel = document.getElementById('detail');
  const strip = document.getElementById('mapstat');
  // Half the width, half the height: the drawing recentres in what is left free
  // once the card on the right and the strip at the bottom have taken their room.
  // The RESTING card reserves nothing: it floats over the map and the names it
  // covers are the ones it lists. Reserving for it cost 56% of the canvas and
  // left one name on the drawing. A selected element's card reserves as before.
  const resting = panel && panel.classList.contains('list');
  const dx = (panel && !resting && getComputedStyle(panel).visibility !== 'hidden') ? panel.offsetWidth / 2 : 0;
  const stripH = strip ? strip.offsetHeight + 8 : 0;
  // Shrink before shifting. fit() leaves the drawing filling the frame, so
  // shifting it up to clear the strip pushes the top row out the other side --
  // one element out of frame, which is what the portal measured. Making room
  // first costs 7% of the height and puts nothing outside.
  //
  // 3% under what the arithmetic allows: the computation is exact and the
  // renderer is not, and a margin of zero has put something out of frame every
  // time it has been tried tonight.
  const view = document.getElementById('net');
  const H = view ? view.clientHeight : 0;
  if (stripH && H) {
    const k = ((H - stripH) / H) * 0.97;
    if (k > 0 && k < 1) { try { net.moveTo({scale: net.getScale() * k}); } catch (e) {} }
    syncLabelSize();
  }
  const dy = -stripH / 2;
  if (dx || dy) { try { net.moveTo({offset:{x: dx, y: dy}}); } catch (e) {} }
  declutterLabels();   // the scale moved, so which names fit moved with it
}

function stabilizationFor(drawnCount,firstLayout){
  if(!firstLayout) return 150;
  return drawnCount>1000?200:1500;
}
// `fmt` is already taken by a date formatter in another scope, so this gets its own name.
function fmtCount(n){ return (typeof n==='number' && isFinite(n)) ? n.toLocaleString() : n; }

// A reader who sees a subset after a successful load believes they see the whole
// set, so the map must state what it omits and how to reach it.
let narrowedOnce = false;

function announceThenDefer(fn){
  const err = document.getElementById('err');   // an existing error message outranks the drawing notice
  if (err && err.textContent === '') err.textContent = 'Drawing the map for ' + fmtCount(Object.keys(ENT).length) + ' entities…';
  // The redraw is synchronous: once it returns the freeze is over, so the notice
  // is cleared here rather than from a layout event settle() may never fire.
  setTimeout(function(){
    try { fn(); }
    finally { if (err && err.textContent.startsWith('Drawing ')) err.textContent = ''; }
  }, 0);
}

function openNarrowOnLargeEstate() {
  // Large estates freeze the tab on first paint, so we open on the machines layer only.
  // The notice needs its own element because capStat is rewritten on every redraw.
  // It must run once per page load, otherwise every redraw would re-narrow a view the reader just left.
  if (narrowedOnce) return false;
  if (activeView !== null) return false;
  if (Object.keys(ENT).length <= 5000) return false;
  narrowedOnce = true;
  applyView('vHosts');
  const cap = document.getElementById('narrowStat');
  if (cap) {
    cap.textContent = 'Map opened on machines only because the estate is large (' + fmtCount(Object.keys(ENT).length) + ' entities). ';
    const btn = document.createElement('button');
    btn.className = 'retry';
    btn.textContent = 'Show everything';
    // applyView announces, defers and clears this notice itself, so there is
    // nothing to capture here and nothing to repeat.
    btn.addEventListener('click', function(){ if (activeView) applyView(activeView); });
    cap.appendChild(btn);
  }
  // applyView has already redrawn; the caller must not redraw again.
  return true;
}

// Names the checkbox that is withholding things, which the map can no longer
// show for itself: the elements are gone from the canvas, not faint on it, so
// without this a reader sees a thin map and no cause.
function sayOrphaned(byType){
  const el=document.getElementById('narrowStat');
  if(!el) return;
  if(!byType || !byType.size){ if(el.dataset.orphan==='1'){ el.textContent=''; el.dataset.orphan=''; } return; }
  // This element also carries the narrowing notice. Never speak over a message
  // that is not ours: a reader loses the one explanation they were given.
  if(el.textContent && el.dataset.orphan!=='1') return;
  // One type: name it with ITS OWN count. Several: give the total and name them
  // all. The first version summed every withheld type and pinned the total on
  // whichever had the most -- "4 elements hang from Service" over a map still
  // drawing twenty, with the four actually spread across two types.
  el.dataset.orphan='1';
  const rows=[...byType.entries()].sort((a,b)=>b[1]-a[1]);
  let total=0;
  for(const [,n] of rows) total+=n;
  if(rows.length===1){
    const [t,n]=rows[0];
    el.textContent = fmtCount(n)+' element'+(n===1?'':'s')+' folded inside '+typeLabel(t)+
      ' '+(n===1?'is':'are')+' not shown. Switch '+typeLabel(t)+' back on in the legend to see '+(n===1?'it':'them')+'.';
  } else {
    el.textContent = fmtCount(total)+' elements are not shown: they are folded inside '+
      rows.map(([t,n])=>typeLabel(t)+' ('+fmtCount(n)+')').join(', ')+
      ', switched off in the legend.';
  }
}

function sayCap(drawn,total,criterion){
  const el=document.getElementById('capStat'); if(!el) return;
  el.textContent = drawn>=total ? '' :
    'Showing the '+drawn+' '+criterion+' of '+total+' entities. Search or filter to see the others.';
}

let rebuildTimer=null;
function scheduleRebuild(){ if(rebuildTimer) return; rebuildTimer=setTimeout(()=>{rebuildTimer=null;rebuild();},250); }
// The sky was seeded at RANDOM on every first load, so the same estate came out
// differently each time: a reader who learns where their machines are would find
// them moved on the next visit, and the names that survive the decluttering pass
// changed with them -- eleven one load, five the next.
//
// Seeded from the entity's own FINGERPRINT instead, which every replica computes
// identically and which survives a reload: the same machine lands in the same
// place, today and tomorrow, here and on the other replica. The id would not do,
// it is local to the replica that answered.
function seededPos(key){
  let h = 2166136261 >>> 0;                       // FNV-1a, enough for a scatter
  const k = String(key || '');
  for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const a = h / 4294967296;
  const h2 = Math.imul(h ^ 0x9e3779b9, 2654435761) >>> 0;
  const b = h2 / 4294967296;
  return { x: a * 1600 - 800, y: b * 1600 - 800 };
}

// What is NOT kept is REMOVED from the map rather than turned down. The owner of
// the product chose this over the dimming it replaces: a reader looking for ten
// machines among sixteen thousand ghosts was reading the ghosts.
//
// `hidden` on a vis node, never a delete: a hidden node keeps its entry and so
// keeps its POSITION, and vis hides every edge touching a hidden end on its own,
// which is exactly "the links between what is kept stay visible". Deleting and
// re-adding would lose the positions and restart the physics.
// Entities pulled out of the current view's removal one at a time, by name, via
// "go to". It exists because removal happens in TWO independent places -- the
// fold drops an entity before a node is even built for it, and keptOnMap hides
// the node that is built -- so an exemption has to be honoured in both.
const REVEALED = new Set();

// A loopback address or endpoint is a machine talking to itself. It is
// real and it is kept in the data, but it carries no topology and it was
// carrying the labels: hidden from the drawing, counted in the footer, and
// still reachable by name through "go to".
function loopbackOf(n){
  let ip = '';
  if(n.type === 'network.address') ip = identOf(n)['network.address'] || '';
  // Not service.listener: its identity is <host-uuid>:<port>/<proto>, with no
  // address in it, so there is nothing for this to read. Addresses and
  // endpoints are where the loopback labels came from.
  else if(n.type === 'network.endpoint'){
    // The WHOLE address token, never a suffix: a suffix match took 2001:db8::1
    // for ::1 and would have hidden a real address. Conservative on purpose --
    // an unrecognised form is treated as not loopback, so at worst a loopback
    // is drawn, never a real address hidden.
    const tok = String(nameLabel(n) || '').trim().split(/\s+/).pop() || '';
    let m;
    if((m = tok.match(/^\[([0-9a-f:.]+)\](?::\d+)?$/i))) ip = m[1];                       // [v6]:port
    else if((m = tok.match(/^(\d+\.\d+\.\d+\.\d+)(?::\d+)?$/))) ip = m[1];               // v4[:port]
    else if((m = tok.match(/^[a-z0-9.-]+:(\d+\.\d+\.\d+\.\d+)(?::\d+)?$/i))) ip = m[1];   // host:v4[:port]
    else if((m = tok.match(/^[a-z0-9.-]+:\[([0-9a-f:.]+)\](?::\d+)?$/i))) ip = m[1];        // host:[v6]:port
    else if(/^[0-9a-f:]+$/i.test(tok) && tok.includes(':')) ip = tok;                   // bare v6, no port
  }
  return !!ip && (ip.startsWith('127.') || ip === '::1' || ip === '0.0.0.0' || ip === '::');
}

function keptOnMap(n, q, ok){
  if(hidden.has(n.type)) return false;                       // the legend's own checkbox
  // Right after the legend and before everything else. Naming an element by hand
  // is the most specific intent on the page, so it outranks the view, the search
  // and the Dock's highlight -- Matthieu's decision, 10/11 -- and the page says
  // which of them it is being shown outside of. It does not outrank the legend:
  // switching a type off must never put more on the map, and a type the reader
  // unchecked is dropped upstream of here anyway, so this line could not save it.
  if(REVEALED.has(n.id)) return true;
  if(CITED.size && !CITED.has(n.identityFingerprint) && !CITED_OWNERS.has(n.id)) return false;
  if(q && !ok && !MATCH_OWNERS.has(n.id)) return false;
  if(dimmed.has(n.type)) return false;                       // the view's subject
  return true;
}

// If the rule would remove EVERYTHING, remove nothing instead and say so. An
// empty canvas reads as "there is nothing here", which is a different statement
// from "nothing matched" and the one the reader will believe.
function applyHiding(nodeList, explained){
  // The legend needs no special case here: a type the reader unchecked never
  // reaches this list at all -- it is dropped while candidates are chosen, well
  // before a node is built -- so the rescue below cannot undo their choice.
  let kept = 0;
  for(const nd of nodeList) if(!nd.hidden) kept++;
  // `explained` is the whole argument for this rescue, inverted. It exists because
  // an empty canvas is MUTE -- it reads as "there is nothing here" rather than
  // "nothing survived what you asked". When the map already names the checkbox
  // doing the withholding, it is not mute, and overriding the reader to avoid a
  // silence that is not there would add elements they just switched off.
  // Measured: Machines with Host switched off went 20 -> 165 that way.
  if(kept === 0 && nodeList.length && !explained){
    for(const nd of nodeList) nd.hidden = false;
    say('Nothing matched what you asked for, so the whole map is shown.');
    kept = nodeList.length;
  }
  return {kept, offerable: nodeList.length};
}

// Clears what a VIEW withholds, not what the reader unchecked in the legend:
// `hidden` is an explicit choice of theirs and silently undoing it would be
// taking a decision back.
function showAll(){
  // Leave the VIEW first. Clearing `dimmed` alone did nothing: rebuild() calls
  // syncLayerView(), which refills it from whichever view is still active -- so
  // "Show all" put everything back and the next line took it away again. The
  // view is the state; `dimmed` is only its shadow.
  activeView = null;
  syncViewButtons();
  const cap = document.getElementById('narrowStat');
  if(cap) cap.textContent = '';           // the notice must not outlive the narrowed map
  dimmed.clear(); CITED.clear(); CITED_OWNERS.clear();
  const hadRevealed = REVEALED.size > 0;
  REVEALED.clear();                     // leaving the state drops the per-element exemptions with it
  attrQuery = '';                       // the real state; `q` is derived from it inside rebuild
  const attr = document.getElementById('attr');
  if(attr) attr.value = '';
  rebuild();
  if(hadRevealed){
    // The revealed element folds back into its carrier on this redraw, so the
    // node it was no longer exists: a selection and a card left pointing at it
    // would describe something with no position on the map.
    try{ net.unselectAll(); }catch(_){}
    inspect(null);
  }
  publishView();                        // the Dock shows the view as a token; it learns it here
  fitEmphasised();
}

// Visible only when something really is withheld, and it says how much: with the
// dimmed ghosts gone, nothing else on the canvas hints that there is more.
function syncShowAll(keptCount, totalCount){
  const b = document.getElementById('showall');
  if(!b) return;
  // totalCount excludes the legend's own choices, so the button never offers to
  // undo something it leaves alone.
  const n = document.getElementById('showallN');
  // A reveal with nothing else withheld leaves kept === total, yet it is a state
  // the reader must be able to leave, and the message offers this button for
  // it: so it shows, with an empty badge, because nothing is being withheld.
  if(keptCount >= totalCount && REVEALED.size){
    b.classList.remove('off');
    if(n) n.textContent = '';
    b.title = 'Put the revealed element back where it was folded';
    return;
  }
  if(keptCount < totalCount){
    b.classList.remove('off');
    // The badge counts what this button will PUT BACK, which is the drawn set, not
    // the estate: the strip at the bottom is what states the estate's size, and two
    // different totals in two places would each make the other look wrong.
    if(n) n.textContent = fmtCount(keptCount) + '/' + fmtCount(totalCount);
    b.title = 'Put back the ' + fmtCount(totalCount - keptCount) +
              ' elements a view, a highlight or the search is withholding';
  } else {
    b.classList.add('off');
    if(n) n.textContent = '';
  }
}

// The sky's settled positions, kept so a view can lay its few nodes out for
// reading and the map can come back to the one layout the reader learned.
const SKY_POS = {};
let spreadApplied = false;
let skySettled = false;   // the first stabilization has run and SKY_POS holds it
function rememberSky(){
  // Never while a spread is on the board; otherwise the sky would learn the
  // view's positions. On the FIRST settle a view may already be active -- a
  // large estate opens narrowed to Machines before any layout -- and that is
  // exactly when the sky must be remembered, since nothing has been spread yet.
  if(spreadApplied) return;
  if(activeView && skySettled) return;
  try{ Object.assign(SKY_POS, net.getPositions()); skySettled = true; }catch(_){ }
}

// In a view that draws few nodes, the sky's picture is kept but made readable:
// measured at 1440, twenty hosts inside a 250px circle at the centre of an
// 800 x 530 map, two isolates at the edges, the fit framing the isolates.
//
// The rule from the night before stands -- a reader learns where their
// machines are -- so a view does NOT re-lay them out. The drawn nodes keep the
// sky's relative positions; the fit scales that picture to the frame; and then
// hosts closer than 60 screen pixels are eased apart, each pair pushed along
// the line between them by half the deficit, a bounded number of times, so a
// host stays where it was, larger. The scale is re-read on every pass because
// pushing apart can widen the picture and shrink the fit. Only when the easing
// cannot reach 60 pixels within the bound does the view fall back to a
// sunflower spiral, and then the footer says so.
const SPREAD_MAX = 60;
const SPREAD_TARGET_PX = 60;          // and 40 on a phone: measured at 390px, eighteen
const SPREAD_TARGET_PHONE_PX = 40;    // hosts on a hundred pixels, thirty-five overlaps
const SPREAD_PASSES = 120;
let spreadFallback = false;
// What the last easing was computed FROM and what it produced: a redraw whose
// inputs are unchanged -- the six-second poll, a legend click, a live arrival
// that touched nothing drawn -- re-applies the same positions and never
// measures again. Measuring means fitting the camera, and a fit the reader
// did not ask for, three times per poll, took their zoom and pan away.
let spreadKey = '';
let spreadPos = {};
let spreadFallbackCached = false;   // the footer's spiral notice must survive a cached redraw
function applySpread(){
  const ids = onMapIds().filter(id => ENT[id] || isKind(id));
  spreadFallback = false;
  if(!activeView || ids.length === 0 || ids.length > SPREAD_MAX || !skySettled){
    if(spreadApplied){
      // EVERY node the sky knows, not only the visible ones: a node spread and
      // then hidden by a search would otherwise keep a view's coordinates and
      // reappear there in the sky.
      spreadApplied = false; spreadKey = ''; spreadPos = {};
      const present = new Set(nodes.getIds());
      const back = Object.keys(SKY_POS).filter(id => present.has(id)).map(id => ({ id, x: SKY_POS[id].x, y: SKY_POS[id].y }));
      if(back.length) nodes.update(back);
    }
    return;
  }
  // A settle may still be running -- one starts on every structural redraw, a
  // live arrival included -- and would go on moving what is placed here until
  // its timer fires. Freeze first; the sky it was settling has been remembered.
  freeze();
  const view = document.getElementById('net');
  const W = (view && view.clientWidth) || 800, H = (view && view.clientHeight) || 530;
  const key = activeView + '|' + W + 'x' + H + '|' + ids.slice().sort().join(',') + '|' + ids.map(id => SKY_POS[id] ? (SKY_POS[id].x | 0) + ':' + (SKY_POS[id].y | 0) : '').join(';');
  if(key === spreadKey && spreadApplied){
    spreadFallback = spreadFallbackCached;
    nodes.update(ids.filter(id => spreadPos[id]).map(id => ({ id, x: spreadPos[id].x, y: spreadPos[id].y })));
    return;
  }
  // Start from the sky's positions, which is the picture the reader knows; the
  // current ones only for a node the sky never settled.
  let cur = {};
  try{ cur = net.getPositions(ids); }catch(_){ }
  const base = {};
  for(const id of ids){ const q = SKY_POS[id] || cur[id]; if(q) base[id] = { x: q.x, y: q.y }; }
  const hosts = ids.filter(id => ENT[id] && ENT[id].type === 'host' && base[id]);
  // The non-hosts a host must not land on: they keep the sky's places, but a
  // host pushed off another host must not come to rest on one of them -- in
  // Network, an address or an endpoint. Their discs' real radii, from the nodes.
  const others = ids.filter(id => base[id] && !(ENT[id] && ENT[id].type === 'host'));
  const radius = {};
  for(const id of ids){
    const nd = nodes.get(id);
    if(isKind(id)){
      // A kind box is sized by vis on its text, not on `size`: "357
      // service.instance" is a hundred units wide. Half its text width, at the
      // 12 canvas units its label is set in, plus the box's own padding.
      let half = 24;
      try{
        if(!measureCtx){ const c = document.createElement('canvas'); measureCtx = c.getContext('2d'); }
        if(measureCtx){ measureCtx.font = "12px 'Geist Sans', system-ui, sans-serif"; half = (measureCtx.measureText(String((nd && nd.label) || '')).width + 16) / 2; }
      }catch(_){ }
      radius[id] = Math.max(half, 12);
    } else {
      radius[id] = (nd && typeof nd.size === 'number') ? nd.size : 14;
    }
  }
  const target = (W < 560 ? SPREAD_TARGET_PHONE_PX : SPREAD_TARGET_PX);
  // The loop converges to within two percent, and the objective is "at least":
  // measured, 59 where 60 were asked and 38 where 40 were. So the loop aims
  // three percent above the target, and the real-scale check demands the target
  // itself, not its neighbourhood.
  const aim = target * 1.03;
  // The scale the fit will really give. Estimating it from the bounding box
  // came out 13% too generous -- measured: 52px where 60 were asked -- because
  // vis fits node extents, not centres, and the strip then takes its share. So
  // the easing runs, the real fit is read, and if the hosts are still short the
  // easing runs again against that real scale, a few rounds at most.
  const strip = document.getElementById('mapstat');
  const stripShare = strip ? Math.max(0.1, (H - (strip.offsetHeight + 8)) / H) : 1;
  let realScale = 0;
  const ease = (scaleOverride) => {
  let eased = hosts.length === 0 || (hosts.length < 2 && others.length === 0);
  let hostsSettled = eased;   // the objective: hosts clear of each other
  for(let pass = 0; pass < SPREAD_PASSES && !eased; pass++){
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for(const id of ids){ const q = base[id]; if(!q) continue; if(q.x < x1) x1 = q.x; if(q.x > x2) x2 = q.x; if(q.y < y1) y1 = q.y; if(q.y > y2) y2 = q.y; }
    const bw = Math.max(x2 - x1, 1), bh = Math.max(y2 - y1, 1);
    const scale = scaleOverride || (Math.min(W / bw, H / bh) * 0.9);
    const d = aim / scale;   // screen pixels, in canvas units
    let moved = false;
    for(let i = 0; i < hosts.length; i++){
      for(let j = i + 1; j < hosts.length; j++){
        const a = base[hosts[i]], b = base[hosts[j]];
        let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
        if(dist >= d * 0.98) continue;                  // within two percent of the target is there
        if(dist < 1e-6){ dx = 1; dy = 0; dist = 1; }    // the same spot: part them along x
        const push = (d - dist) / 2;
        a.x -= dx / dist * push; a.y -= dy / dist * push;
        b.x += dx / dist * push; b.y += dy / dist * push;
        moved = true;
      }
    }
    hostsSettled = !moved;   // before the non-host pass: did the hosts themselves need moving?
    // Then off anything that is not a host: the host alone moves, by the whole
    // deficit, so the non-host stays exactly where the sky put it. The clearance
    // is the two discs' radii plus a few screen pixels of daylight.
    const daylight = 6 / scale;
    for(const h of hosts){
      for(const o of others){
        const a = base[h], b = base[o];
        let dx = a.x - b.x, dy = a.y - b.y, dist = Math.hypot(dx, dy);
        const need = radius[h] + radius[o] + daylight;
        if(dist >= need * 0.98) continue;
        if(dist < 1e-6){ dx = 1; dy = 0; dist = 1; }
        const push = need - dist;
        a.x += dx / dist * push; a.y += dy / dist * push;
        moved = true;
      }
    }
    if(!moved) eased = true;
  }
  // Judged on the FINAL state: the last pass's non-host push can land a host on
  // another after the host-host pass has already been counted as clean.
  if(!eased){
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for(const id of ids){ const q = base[id]; if(!q) continue; if(q.x < x1) x1 = q.x; if(q.x > x2) x2 = q.x; if(q.y < y1) y1 = q.y; if(q.y > y2) y2 = q.y; }
    const scale = scaleOverride || (Math.min(W / Math.max(x2 - x1, 1), H / Math.max(y2 - y1, 1)) * 0.9);
    const d = aim / scale;
    hostsSettled = true;
    for(let i = 0; i < hosts.length && hostsSettled; i++)
      for(let j = i + 1; j < hosts.length; j++){
        const a = base[hosts[i]], b = base[hosts[j]];
        if(Math.hypot(b.x - a.x, b.y - a.y) < d * 0.98){ hostsSettled = false; break; }
      }
  }
  return { eased, hostsSettled };
  };
  // The camera is the reader's: whatever the measuring fits below do to it is
  // undone before this returns, and the framing that follows a view change is
  // fitEmphasised's, as before.
  let savedView = null;
  try{ savedView = { pos: net.getViewPosition(), scale: net.getScale() }; }catch(_){ }
  let { eased, hostsSettled } = ease(0);
  for(let round = 0; round < 3 && hosts.length > 1; round++){
    nodes.update(ids.filter(id => base[id]).map(id => ({ id, x: base[id].x, y: base[id].y })));
    try{ net.fit({ nodes: ids, animation: false, maxZoomLevel: 3 }); realScale = net.getScale() * 0.97 * stripShare; }catch(_){ realScale = 0; }
    if(!realScale) break;
    let minPx = Infinity;
    for(let i = 0; i < hosts.length; i++) for(let j = i + 1; j < hosts.length; j++){
      const a = base[hosts[i]], b = base[hosts[j]];
      minPx = Math.min(minPx, Math.hypot(b.x - a.x, b.y - a.y) * realScale);
    }
    // The objective itself, measured at the real scale -- and it IS the verdict:
    // a pair judged short at the estimated scale, then found clear at the real
    // one, must not leave "hosts settled" false and send sixty nodes to a spiral.
    if(minPx >= target){ hostsSettled = true; break; }
    ({ eased, hostsSettled } = ease(realScale));
  }
  // At the bound, the positions reached are the best effort and they are kept
  // -- a single host wedged between two fixed discs, bounced from one into the
  // other every pass, must not throw sixty nodes onto a spiral. The spiral is
  // for the one failure that defeats the objective: hosts still on each other.
  if(savedView){ try{ net.moveTo({ position: savedView.pos, scale: savedView.scale, animation: false }); }catch(_){ } }
  spreadPos = {};
  if(eased || hostsSettled){
    for(const id of ids) if(base[id]) spreadPos[id] = { x: base[id].x, y: base[id].y };
    nodes.update(ids.filter(id => base[id]).map(id => ({ id, x: base[id].x, y: base[id].y })));
  } else {
    // Fallback, and the footer says so: a spiral filling the frame's ellipse,
    // deterministic -- hosts first, by name -- so at least it is the same spiral
    // every time. It is not where the reader expects things to be.
    spreadFallback = true;
    const name = id => ENT[id] ? labelOf(ENT[id]) : (nodes.get(id) || {}).label || id;
    const order = ids.slice().sort((a, b) => {
      const ha = !!(ENT[a] && ENT[a].type === 'host'), hb = !!(ENT[b] && ENT[b].type === 'host');
      if(ha !== hb) return ha ? -1 : 1;
      const na = name(a), nb = name(b);
      return na < nb ? -1 : na > nb ? 1 : (a < b ? -1 : 1);
    });
    const ax = 400, ay = 400 * (H / W), phi = Math.PI * (3 - Math.sqrt(5)), N = order.length;
    const up = order.map((id, i) => {
      const r = Math.sqrt((i + 0.5) / N), t = i * phi;
      return { id, x: ax * r * Math.cos(t), y: ay * r * Math.sin(t) };
    });
    for(const u of up) spreadPos[u.id] = { x: u.x, y: u.y };
    nodes.update(up);
  }
  spreadKey = key;
  spreadFallbackCached = spreadFallback;
  spreadApplied = true;
}

function rebuild(){
  computeOwners();
  const prevNodeIds=new Set(nodes.getIds());
  const allTypes=new Set(), nodeIds=new Set(), nUp=[];
  syncLayerView();   // re-apply the chosen view to whatever types exist now
  const q=attrQuery.trim(); let matched=0;
  // Filled before the node loop below, not inside kindGroups() further down: that one
  // runs AFTER this loop, so the set would be empty on the first pass and correct on
  // the next -- wrong intermittently, which is worse than wrong.
  // #567: the fold check used to return before the filter ran, so a folded child was
  // never tested. The page then reported "0 match", which reads as "this estate has
  // no eth0" -- an absence produced by the reader's own bounds, stated as a fact about
  // the world. Measured: 0 matches folded against 54 unfolded, same graph, same query.
  MATCH_OWNERS.clear(); foldedMatches=0;
  if(q) for(const id of Object.keys(ENT)){
    const n=ENT[id]; if(hidden.has(n.type)) continue;
    const r=repOf(id); if(r===id) continue;          // drawn in its own right
    if(!attrMatch(n)) continue;
    foldedMatches++;
    MATCH_OWNERS.add(isKind(r)?kindParts(r).owner:r);
  }
  CITED_OWNERS.clear();
  if(CITED.size) for(const id of Object.keys(ENT)){
    if(!CITED.has(ENT[id].identityFingerprint)) continue;
    const r=repOf(id); if(r===id) continue;      // drawn in its own right, nothing to carry
    // With nothing expanded -- the default -- repOf returns the OWNER, not a kind
    // node: kinds only appear once a reader opens an owner. An earlier version only
    // handled the kind case, so by default this set stayed empty and no owner lit up.
    CITED_OWNERS.add(isKind(r)?kindParts(r).owner:r);
  }
  // An exemption outlives the entity it names when that entity leaves the estate
  // between two polls; left in place it kept the Show all button up for an
  // element that no longer existed.
  for(const id of REVEALED) if(!ENT[id]) REVEALED.delete(id);
  // Here, not only after a full load: a host that arrives or is renamed through
  // the live feed would otherwise be shortened against the suffix and the
  // ambiguity set of the last full load, and two discs could read the same
  // until the next one. Hosts only, so it is cheap.
  recomputeShortNames();
  const firstLoad=!fitted;   // scatter new nodes on the very first layout so stabilisation spreads them
  const inside=foldedInside();
  let hiddenByFold=0, loopbackHidden=0;
  const orphanedBy=new Map();   // type switched off -> how many entities it is withholding
  // Degree drives node size: dist1 with eight links must read as bigger than acc3
  // with one, so the shape of the network is legible before a single label is.
  degree={};
  Object.values(REL).forEach(r=>{ const a=repOf(r.fromId), b=repOf(r.toId);
    if(a!==b){ degree[a]=(degree[a]||0)+1; degree[b]=(degree[b]||0)+1; } });
  // Phase 1: census every candidate with the exact same exclusions, in the same order.
  const candidates=[];
  let matchCandidates=0;
  Object.values(ENT).forEach(n=>{ allTypes.add(n.type); if(hidden.has(n.type)) return;
    if(loopbackOf(n) && !REVEALED.has(n.id)){ loopbackHidden++; return; }
    if(repOf(n.id)!==n.id){
      hiddenByFold++;
      // Its representative is a type the reader switched off, so this entity has
      // no drawn ancestor to be counted inside: it is withheld BY THE LEGEND, and
      // the reader needs to be told which checkbox is doing it.
      const rep=ENT[repOf(n.id)];
      if(rep && hidden.has(rep.type)) orphanedBy.set(rep.type,(orphanedBy.get(rep.type)||0)+1);
      return;
    }
    const ok=attrMatch(n); if(q && ok) matchCandidates++;
    // "only" mode hides non-matching, but not an owner hiding a match -- and not
    // an element named by hand, which withheldBy promises the search yields to.
    if(q && !ok && !MATCH_OWNERS.has(n.id) && filterOnly && !REVEALED.has(n.id)) return;
    candidates.push({n, d:degree[n.id]||0}); });

  // Priority: what the reader explicitly asked for (filter, then citations) comes
  // before what the algorithm deems important (degree); id breaks ties so the map
  // stays identical from one render to the next.
  let cappedTotal=candidates.length, cappedOut=0;
  candidates.sort((a,b)=>{
    // An element named by hand is never the one the cap cuts.
    const ar=REVEALED.has(a.n.id), br=REVEALED.has(b.n.id);
    if(ar!==br) return ar?-1:1;
    const am=q&&(attrMatch(a.n)||MATCH_OWNERS.has(a.n.id)), bm=q&&(attrMatch(b.n)||MATCH_OWNERS.has(b.n.id));
    if(am!==bm) return am?-1:1;
    const ac=CITED.size&&(CITED.has(a.n.identityFingerprint)||CITED_OWNERS.has(a.n.id)),
          bc=CITED.size&&(CITED.has(b.n.identityFingerprint)||CITED_OWNERS.has(b.n.id));
    if(ac!==bc) return ac?-1:1;
    if(a.d!==b.d) return b.d-a.d;
    return a.n.id<b.n.id?-1:(a.n.id>b.n.id?1:0);
  });
  const kept=candidates.slice(0,MAX_DRAWN); cappedOut=candidates.length-kept.length;
  let capCriterion='most connected';
  if(q) capCriterion='matching your search first, then the most connected';
  else if(CITED.size) capCriterion='cited first, then the most connected';
  sayCap(kept.length,cappedTotal,capCriterion);
  sayOrphaned(orphanedBy);

  // Phase 2: build exactly what the old loop built, for the retained candidates only.
  kept.forEach(({n,d})=>{ const ok=attrMatch(n);
    nodeIds.add(n.id); if(q&&ok) matched++;
    const by=inside[n.id], k=badgeTotal(by);
    // The count is NOT in the label: measured, "sha018 (6 Container, 3 Service, +1)"
    // is ~250px wide and eighty of them overlap. It lives in the tooltip and in
    // the disc's size, both of which cost no horizontal room.
    const node={id:n.id,label:labelOf(n),
              childCount:k,   // the REAL number folded inside, which the grid sizes the disc from
              title:titleOf(n)+(k?('\nfolded inside: '+badgeFull(by)+'  \u2014 double-click to open'):''),
              hidden:!keptOnMap(n,q,ok),
              // Opacity no longer hides anything; a deleted entity is the only
              // thing still drawn faint, because it IS there and is on its way out.

    nUp.push(node); });
  // One node per kind under an opened owner. Drawn as a labelled count rather
  // than a thing, because that is what it is: "357 service.instance" is an

  const kinds=kindGroups();
  Object.entries(kinds).forEach(([id,k])=>{
    if(!nodeIds.has(k.owner)) return;            // its owner is filtered out; the kind has nothing to hang from

    const openable=k.n<=KIND_OPEN_MAX;

      title:k.n+' '+typeLabel(k.type)+' inside '+(labelOf(ENT[k.owner])||k.owner)+'\n'+
            (openable?'double-click to open them':'too many to draw \u2014 narrow with the attribute filter instead, then open'),
      shape:'box', opacity:1, hidden:!!(CITED.size&&!k.cited),
      size:Math.min(30,12+Math.sqrt(k.n)*2.4),
      borderWidth:openable?2:3,

  // The heavy-render notice lives on the status line, not in the transient hint:

  net.setOptions({physics:{stabilization:{iterations:stabilizationFor(nUp.length,!fitted)}}});
// Threshold is a ratio because a sparse graph is sparse relative to its size: 19 edges among 80 nodes is noise, but 19 among 20 nodes is structure.
// Threshold is a ratio because a sparse graph is sparse relative to its size:
// 19 edges among 80 nodes is noise, but 19 among 20 nodes is structure.
// No grid and no clusters: the map keeps ONE stable layout for everything, and a
// view only changes what is lit. Rejected by Matthieu on the real estate -- a
// square of discs says nothing about how an infrastructure is actually shaped.
  const hid = applyHiding(nUp, orphanedBy.size > 0);
  syncShowAll(hid.kept, hid.offerable);
  nodes.update(nUp);
  // Say what is not shown. "0 match" was the lie; "0 shown, 54 inside folded nodes"
  // is the same number with its bound declared.
  const ms=document.getElementById('matchStat');
  let shownMatchForColour=-1;   // -1: no query, the field keeps its normal colour
  if(!q){ ms.textContent=''; }
  else{
    // "shown" was this number's own word until nothing matching meant the whole
    // map got drawn instead: "0 shown" then sat under 185 visible discs. It
    // counts MATCHES, so it says match, and the no-match case says what the map
    // did about it in the same breath.
    // Count what is SHOWN and matches, owners included: "nginx" isolates six hosts
    // through the services they carry, and `matched` counted direct hits only, so
    // the footer said "no match" under six drawn, named, matching machines.
    let shownMatch=0;
    for(const nd of nUp){ if(nd.hidden) continue; const e=ENT[nd.id]; if(e && (attrMatch(e)||MATCH_OWNERS.has(e.id))) shownMatch++; }
    shownMatchForColour=shownMatch;
    if(shownMatch===0){
      ms.textContent='· no match — the whole map is shown';
    } else {
      const parts=['· '+fmtCount(shownMatch)+' match'];
      if(foldedMatches>0) parts.push(foldedMatches+' inside folded nodes');
      if(matchCandidates-matched>0) parts.push((matchCandidates-matched)+' not drawn (cap)');
      ms.textContent=parts.join(', ');

  }

  const ai=document.getElementById('attr'); if(ai) ai.style.color=(q&&shownMatchForColour===0)?'var(--warn)':'var(--fg)';
  nodes.getIds().forEach(id=>{ if(!nodeIds.has(id)) nodes.remove(id); });
  applySpread();   // the node set is final here; edges do not care where their ends are
  const edgeIds=new Set(), eUp=[];
  let realCount=Object.values(REL).filter(r=>nodeIds.has(r.fromId)&&nodeIds.has(r.toId)).length;
  // Folded: several relations between two owners collapse into one drawn link,
  // thickened by how many it stands for. core1<->dist1 is one line, not two.
  const agg={};
  if(folded){
    realCount=0;
    Object.values(REL).forEach(r=>{ const a=repOf(r.fromId), b=repOf(r.toId);
      if(a===b || !nodeIds.has(a) || !nodeIds.has(b)) return;    // internal to one owner, or filtered out
      realCount++;
      const k=a+'\u0000'+b+'\u0000'+r.type;
      (agg[k]=agg[k]||{from:a,to:b,type:r.type,n:0}).n++; });
  }
  // Edges are ALWAYS added (the springs are what lay the graph out); "off" only makes
  // them invisible, so hiding them can't fling the nodes apart.
  const vis=showEdges?{color:{color:'rgba(150,178,235,0.26)',highlight:'#cfe0ff',hover:'#cfe0ff'},arrows:{to:{enabled:true,scaleFactor:.3}}}
                     :{color:{color:'rgba(0,0,0,0)',highlight:'rgba(0,0,0,0)',hover:'rgba(0,0,0,0)'},arrows:{to:{enabled:false}}};
  // An edge is only as lit as its dimmest end: a bright line into a turned-down

  const dimVis={color:{color:'rgba(150,178,235,0.05)',highlight:'rgba(150,178,235,0.05)',hover:'rgba(150,178,235,0.05)'},arrows:{to:{enabled:false}}};
  const edgeVis=(a,b)=>(showEdges && !(dimmed.size && ((ENT[a]&&dimmed.has(ENT[a].type))||(ENT[b]&&dimmed.has(ENT[b].type))))) ? vis : (showEdges?dimVis:vis);
  if(folded){
    Object.values(agg).forEach(a=>{ const id='agg:'+a.from+'|'+a.to+'|'+a.type; edgeIds.add(id);
      eUp.push({id,from:a.from,to:a.to,
        title:a.type+(a.n>1?' \u00d7'+a.n:''),
        label:(showEdges&&edgeLabels)?(a.type+(a.n>1?' \u00d7'+a.n:'')):undefined,
        width:showEdges?Math.min(6,1.4+Math.log2(a.n)*1.1):0.7, ...vis}); });
  } else {
    Object.values(REL).forEach(r=>{ if(nodeIds.has(r.fromId)&&nodeIds.has(r.toId)){ edgeIds.add(r.id);
      eUp.push({id:r.id,from:r.fromId,to:r.toId,title:r.type,label:(showEdges&&edgeLabels)?r.type:undefined,...edgeVis(r.fromId,r.toId)}); } });
  }
  if(showEdges && inferred) inferredEdges(nodeIds).forEach(e=>{ if(!edgeIds.has(e.id)){ edgeIds.add(e.id); eUp.push(e); } });
  edges.update(eUp);
  edges.getIds().forEach(id=>{ if(!edgeIds.has(id)) edges.remove(id); });
  // A folded node hides its children; a count that does not say so reads as a
  // graph that simply has fewer things in it (#378).
  // What is DRAWN, not what was built: nodeIds counted hidden nodes too, so the
  // footer said "186 (+912 folded)" in every view while Machines drew twenty.
  const nN=document.getElementById('nNodes');
  const withheld=(SCOPE && SCOPE.hiddenEntities)||0;
  nN.textContent=fmtCount(hid.kept)+(hiddenByFold?'  (+'+fmtCount(hiddenByFold)+' folded)':'')+(loopbackHidden?'  ('+fmtCount(loopbackHidden)+' loopback hidden)':'')+(withheld?'  ('+fmtCount(withheld)+' withheld by the portal)':'')+(spreadFallback?'  (hosts laid out on a spiral: 60 px apart was not reachable)':'');
  nN.title=(hiddenByFold?(hiddenByFold+' entities are folded into their owner \u2014 double-click a node to open it. '):'')+
           (loopbackHidden?(loopbackHidden+' loopback or wildcard addresses and endpoints are not drawn; name one in "go to" to see it.'):'');
  // Never let a hidden thing read as an absent thing: when edges are painted
  // invisible the canvas is indistinguishable from a graph with no relations, so
  // the counter says which of the two it is.
  const nE=document.getElementById('nEdges');
  // The count must match what is drawn. Saying only the stored edges while the
  // inferred overlay adds more to the screen is a wrong number, which is worse than
  // the jargon that was removed with it.
  // "0" is a true number and a false sentence: the relations are there, painted
  // transparent. A reader cannot tell that from a zero, so say which it is.
  nE.textContent=showEdges?edgeIds.size:'hidden';
