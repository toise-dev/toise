  nE.title=showEdges?'':edgeIds.size+' relations are loaded and drawn transparent — the edges button turns them back on';
  presentTypes=allTypes; renderLayers();
  const leg=document.getElementById('legend'); leg.innerHTML='';
  // The inferred-links legend is jargon for this audience; the overlay itself
  // stays available under the advanced controls.
  [...allTypes].sort().forEach(t=>{ const s=document.createElement('span'); s.className=hidden.has(t)?'off':'';
    s.innerHTML='<i style="background:'+colorFor(t)+'"></i>'+esc(typeLabel(t));
    s.onclick=()=>{ hidden.has(t)?hidden.delete(t):hidden.add(t); rebuild(); }; leg.appendChild(s); });
  // Re-run the layout only when the set of nodes changed (a node appeared or went
  // away), then freeze — never on a plain attribute/heartbeat update.
  let structural = nodeIds.size!==prevNodeIds.size;
  if(!structural){ for(const id of nodeIds){ if(!prevNodeIds.has(id)){ structural=true; break; } } }
  const card=document.getElementById('detail');
  if(card && !card.querySelector('.actions')) renderLitList(card);   // resting state, or nothing ever asks for the list
  if(structural && fitted && !staticLayout) settle();   // settle() stands down over a spread itself, and still honours the fit it was asked for
  // First data render: lay the graph out ONCE while the canvas is hidden, then reveal
  // it already-settled (no visible fly-in). Reveal + fit happen on stabilizationIterationsDone.
  if(!fitted && nodeIds.size){ fitted=true; net.setOptions({physics:{enabled:true}});
    const err=document.getElementById('err');
    if(nodeIds.size>1000 && err && !err.textContent) err.textContent='Drawing '+fmtCount(nodeIds.size)+' entities…';

    setTimeout(()=>{ net.stabilize();
    setTimeout(()=>{ const nv=document.getElementById('net'); if(nv) nv.classList.remove('laying'); const e=document.getElementById('err'); if(e && e.textContent.startsWith('Drawing ')) e.textContent=''; },12000); },0); }  // safety reveal

}

// The server caps every connection page at 200 items, so a single
// entities(first:N) returns at most 200 — loading one page renders a
// truncated, inconsistent graph above ~200 entities (orphan nodes whose
// host lives on a later page). Follow pageInfo.hasNextPage / endCursor to
// fetch the whole connection before rebuilding (#209).
async function fetchAll(id){
  const nodes=[]; let after=null, guard=0;
  do{
    const asOf = asOfISO();
    const variables = after
      ? { first: 200, after, ...(asOf ? { asOf } : {}) }
      : { first: 200, ...(asOf ? { asOf } : {}) };
    const r=await fetch(API,{method:'POST',headers:gqlHeaders(),credentials:'same-origin',body:JSON.stringify({id,variables})});
    if(!r.ok) throw new Error(readFailureMessage(r.status,'read failed with status '+r.status));
    const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
    const c=j.data[id];
    c.edges.forEach(e=>nodes.push(e.node));
    after=c.pageInfo.hasNextPage?c.pageInfo.endCursor:null;
  }while(after && ++guard<1000);
  return nodes;
}
let SCOPE = null;

// Reads the served perimeter so the page can tell which park it is drawing and whether the load was truncated.
async function refreshScope(opts) {
  // The page sends persisted-document ids only, never a query: that is the
  // security property of this build, and the relay refuses anything else.
  //
  // Reading the scope in the present while the page shows a past instant
  // manufactures a gap that does not exist, so the read must follow the page.
  const asOf = asOfISO();
  try {
    const body = asOf !== null
      ? { id: 'graphScope', variables: { asOf } }
      : { id: 'graphScope' };
    const res = await fetch(API, {
      method: 'POST',
      headers: gqlHeaders(),
      credentials: 'same-origin',
      body: JSON.stringify(body)
    });
    const json = await res.json();
    // A known scope is better than none: only overwrite on a real payload.
    if (json && json.data && json.data.graphScope) {
      SCOPE = json.data.graphScope;
      scopeAsOf = asOf;
    }
  } catch (e) {
    // Keep the previous SCOPE on transient failure.
  }
  // The page trusts the instant it asked for, not the one the server echoes:
  // an omitted asOf would otherwise be read as "the present" and mask a stale scope.
  const serverMentionsAsOf = SCOPE != null && 'asOf' in SCOPE;
  // Compared as moments, not as text: the server reformats the instant it was
  // sent, so the same moment can come back spelled differently.
  let serverAgrees;
  if (!serverMentionsAsOf) {
    serverAgrees = true;
  } else if (SCOPE.asOf == null) {
    serverAgrees = asOf == null;
  } else {
    const echoed = Date.parse(SCOPE.asOf);
    // An unreadable echo is not a contradiction: the page's own record is the
    // authority here, and treating an unparsable stamp as a disagreement would
    // silently suppress detection without ever surfacing the mismatch.
    serverAgrees = Number.isNaN(echoed) ? true : echoed === Date.parse(asOf);
  }
  scopeDescribesInstant = SCOPE == null || (scopeAsOf === asOf && serverAgrees);
  sayScope();
  // Retention bounds do not depend on the read instant, but the scope counters do:
  // keep the scope for the timeline, refuse only the comparison inside sayIncomplete.
  // Quiet means "do not warn about data that has not landed yet", never "leave a
  // false claim standing", so a scope that cannot describe the instant still
  // reaches sayIncomplete — where it can only clear.
  if (!(opts && opts.quiet) || !scopeDescribesInstant) {
    sayIncomplete(Object.keys(ENT).length, Object.keys(REL).length);
  }
}

// Renders the scope line; no relative age from newestEvent because the page has no trustworthy clock.
function sayScope() {
  const el = document.getElementById('scopeStat');
  if (!el) return;
  if (!SCOPE) { el.textContent = 'scope unavailable'; return; }
  const t = (SCOPE.tenantName && SCOPE.tenantName.length) ? SCOPE.tenantName : 'tenant ' + SCOPE.tenant;
  // The tenant name does not depend on the instant, so it survives; the counters
  // were read at another moment and would misstate this one.
  if (!scopeDescribesInstant) {
    el.textContent = t + ' · scope for this instant is not known';
  } else if (SCOPE.entities === 0) {
    el.textContent = 'Tenant ' + t + ': 0 entities, no events yet.';
  } else {
    // The relay is the one that filters, so it is the one that names what was
    // removed; the page only relays its notice and never invents its own.
    const notice = (typeof SCOPE.hiddenNotice === 'string' && SCOPE.hiddenNotice.length) ? ' · ' + SCOPE.hiddenNotice : '';
    el.textContent = t + ' · ' + SCOPE.entities + ' entities · ' + SCOPE.relations + ' relations' + notice;
  }
}

// Warns only on a deficit; a surplus is ignored because the graph is live and a creation mid-read is not a truncation.
function sayIncomplete(loadedE, loadedR, bounds) {
  const el = document.getElementById('incompleteStat');
  if (!el) return;
  // Callers invoke this directly with their own bounds, so the guard must live
  // here: a check placed at the call site only protects callers that remember it.
  if (!scopeDescribesInstant) { el.textContent = ''; return; }
  // Comparing against every scope reading tolerates a creation or deletion that
  // happened during the load, without inventing an arbitrary tolerance threshold.
  // ONE convention, written in the manifest: the scope's totals are what the
  // relay will DELIVER, after whatever it withholds. hiddenEntities is how many
  // it withheld, said apart in the footer, and never subtracted here. The page
  // had subtracted it from a total that already excluded it -- two relays, two
  // conventions -- so the expected count went negative and "Incomplete" could
  // never fire again, even on 1,038 delivered of 1,088. Measured by lab.
  const say = (lE, totalE, lR, totalR) => {
    const gapE = lE < totalE, gapR = lR < totalR;
    el.textContent = (gapE || gapR)
      ? 'Incomplete: entities ' + fmtCount(lE) + ' of ' + fmtCount(totalE) +
        ', relations ' + fmtCount(lR) + ' of ' + fmtCount(totalR) + ' loaded.'
      : '';
  };
  if (bounds && bounds.length) {
    // The smaller of the two scope readings: a creation during the load must
    // not read as a gap.
    say(loadedE, Math.min(...bounds.map(b => b.entities)), loadedR, Math.min(...bounds.map(b => b.relations)));
    return;
  }
  if (!SCOPE) { el.textContent = ''; return; } // without a total, any claimed gap would be invented
  say(loadedE, SCOPE.entities, loadedR, SCOPE.relations);
}

async function loadFull() {
  // Callers invoke this directly without checking the flag, so the guard belongs here.
  if (loading) return false;
  loading = true;
  const err = document.getElementById('err'); err.textContent = '';
  try {
    // Quiet on the way in too: at this point the maps are empty, so comparing
    // would claim "0 of N" until the data lands.
    await refreshScope({ quiet: true });
    const first = SCOPE ? { entities: SCOPE.entities, relations: SCOPE.relations } : null;
    const [ents, rels] = await Promise.all([fetchAll('entities'), fetchAll('relations')]);
    for (const k in ENT) delete ENT[k]; for (const k in REL) delete REL[k];
    ents.forEach(n => ENT[n.id] = n);
    rels.forEach(n => REL[n.id] = n);
    // Before the first paint, not after: narrowing afterwards would pay the very
    // layout cost it exists to avoid. applyView redraws on its own, so narrowing
    // REPLACES this first rebuild rather than adding a second full node build.
    if (!openNarrowOnLargeEstate()) rebuild();
    await refreshScope({ quiet: true });
    const second = SCOPE ? { entities: SCOPE.entities, relations: SCOPE.relations } : null;
    // Remember what the scope said at the moment this graph was read, so the
    // poll can tell "nothing happened" from "we have not looked".
    if (SCOPE) loadedCounts = SCOPE.entities+'/'+SCOPE.relations;
    // Date.now() as the floor when the probe cannot answer: it makes the next tick
    // compare against now rather than against zero, which would reload forever.
    // Set NOW, synchronously, before the probe is even sent: the probe answers a
    // round trip later and the first tick arrives five seconds in, so a stamp left
    // at zero made that tick re-read the graph it had just read -- a megabyte on
    // every page open. The probe then refines this downward to the real instant,
    // and anything newer than that still triggers a reload.
    loadedChangeAt = Date.now();
    newestMeaningfulChange().then(t=>{ if(t) loadedChangeAt = t; });
    const bounds = [first, second].filter(Boolean);
    sayIncomplete(Object.keys(ENT).length, Object.keys(REL).length, bounds.length ? bounds : undefined);
  } catch (e) {
    err.textContent = '⚠ ' + e.message;
    noteLoadFailure();
    return false;
  } finally {
    loading = false;
  }
  return true;
}

const GRID_MS = 300000; // Producers observe in ticks of a few minutes; a finer grid would offer precision the data does not have.
let asOfMs = null; // null means "the present"
let scopeDescribesInstant = true; // Scope counters are only valid for the instant the scope itself describes.
let scopeAsOf = null; // The page remembers the instant it asked for, because an absent field in the response is indistinguishable from the present.

function snapToGrid(ms) {
  return Math.floor(ms / GRID_MS) * GRID_MS;
}

// Rounding down at the lower bound would push the value outside the window.
function snapWithin(ms, lo, hi) {
  let v = snapToGrid(ms);
  if (v < lo) v += GRID_MS;
  if (v > hi) v -= GRID_MS;
  return v;
}

function asOfISO() {
  if (asOfMs === null) return null;
  return new Date(asOfMs).toISOString().replace(/\.\d{3}Z$/, 'Z');
}

function horizonMs() {
  if (SCOPE && SCOPE.oldestAnswerable) {
    const t = Date.parse(SCOPE.oldestAnswerable);
    return Number.isNaN(t) ? null : t;
  }
  return null;
}

function withinHorizon(ms) {
  const h = horizonMs();
  if (h === null) return false; // unknown horizon: never offer a journey whose bound we don't know
  return ms >= h && ms <= Date.now();
}

let replaying = false;

async function goToInstant(ms) {
  if (replaying) {
    say('A past read is already in flight…');
    return;
  }
  if (ms === 'unknown-horizon') {
    say('The readable window is not known for that instant.');
    return;
  }
  const now = Date.now();
  const h = horizonMs();
  const aligned = ms === null ? null : snapWithin(ms, h == null ? -Infinity : h, now);
  if (aligned !== null && !withinHorizon(aligned)) {
    say('That instant is outside the readable window (oldest answerable: ' +
        (h === null ? 'unknown' : new Date(h).toISOString()) + ').');
    return;
  }
  if (loading) {
    say('A load is already running, please wait…');
    return;
  }
  const prevAsOf = asOfMs;
  asOfMs = aligned;
  replaying = true;
  try {
    const ok = await loadFull();
    if (!ok) {
      asOfMs = prevAsOf;
      // The scope was read BEFORE the entities failed, so SCOPE.asOf carries the
      // instant that was not served while the map stays at the previous one --
      // and the label prefers what the scope echoes. Read the scope again at the
      // instant the map is actually at, so label, button and map agree.
      await refreshScope({ quiet: true });
      say('That instant could not be read; the view remains at the previous instant.');
    }
    // The strip reads the instant too, and nothing else reloads it on a move:
    // left alone it would describe another moment than the map beside it.
    loadProfile();
  } finally {
    replaying = false;
  }
}

function readFailureMessage(status, fallback) {
  // 503 means "too loaded, retry" — it must never be readable as an empty park.
  // The wording follows the instant being read: "re-read the past" names a
  // cost the live reader never paid, and a message that misnames the cause
  // teaches the reader to distrust the next one.
  // 429 and 503 share one consequence -- wait, then retry -- and not the cause:
  // 503 is the server saturated, 429 is this page asking too fast.
  if (status === 503) {
    if (asOfMs == null) {
      return 'The server is too busy right now — please retry.';
    }
    return 'The server is too loaded to re-read the past right now — please retry.';
  }
  if (status === 429) {
    if (asOfMs == null) {
      return 'Too many reads are in progress right now — wait a moment, then retry.';
    }
    return 'Too many past reads are in progress right now — wait a moment, then retry.';
  }
  return fallback;
}

// The handle spans the WINDOW the ruler shows, never the whole retention. It
// used to map 0..1000 onto [horizon, now], so with a 6h window drawn above it a
// nudge to the left landed a week back on a map of three entities -- measured in
// the UX walkthrough of 10/11. tlInstant() below already did this right and was
// wired to a slider that does not exist; this is that logic, on the real handle.
function sliderToMs(v) {
  if (v === 1000 && isLiveSpan()) return null;
  const h = horizonMs();
  if (h == null) return 'unknown-horizon';
  const [s, e] = spanBounds();
  const lo = Math.max(s, h);
  const ms = s + (e - s) * (v / 1000);
  return snapWithin(Math.max(ms, lo), lo, e);
}

function sayInstant() {
  const el = document.getElementById('tlAtLabel');
  if (!el) return;
  const fmt = ms => new Date(ms).toLocaleString();
  // Show what was served, not what was requested.
  // An unreadable echo is not a date: fall back to what the page asked for, which
  // is what it already trusts for the counters.
  // Prefer what the scope echoes only while the scope describes THIS instant.
  // After a failed read and a failed re-read of the scope, the echo is of an
  // instant the map never reached; scopeDescribesInstant already knows that, so
  // the label falls back to the instant the map is actually at.
  const echoed = (SCOPE && SCOPE.asOf != null && scopeDescribesInstant) ? Date.parse(SCOPE.asOf) : NaN;
  const served = Number.isNaN(echoed) ? asOfMs : echoed;
  // The "historical" mark on the live button is about the MAP's instant, so it
  // is set here, where that instant is known, and nowhere else. The window
  // shift used to set it, and a map at the present then wore it after Earlier.
  const liveBtn = document.getElementById('tlLive');
  if (liveBtn) liveBtn.classList.toggle('hist', served != null);
  if (served == null) {
    el.textContent = 'live';
    el.title = '';
    return;
  }
  const h = horizonMs();
  el.textContent = `as of ${fmt(served)}`;
  el.title = h == null ? '' : `readable back to ${fmt(h)}`;
}

// --- timeline: PRESENT in this build --------------------------------------------
// The relay exposes an asOf argument on entities, relations and graphScope, so
// the slider tlAt, the LIVE button tlLive and the label tlAtLabel all have a
// caller. Reads happen on change only, with a single replay in flight, and a
// 503 is read as "too busy, retry", never as an empty park. The footer itself
// IS visible: it carries the heatmap.
let historical=false;
const WINDOWS={'1h':3600e3,'6h':6*3600e3,'24h':86400e3,'7d':604800e3};
let tlWindow=localStorage.getItem('toise_viz_window')||'24h';
const tlRange=()=>document.getElementById('tlRange');

// Timeline span [start,end]. Live while spanEnd is null (end tracks "now"); a brush
// selection on the density profile zooms to an arbitrary past [start,end].
let spanEnd=null, spanMs=WINDOWS[tlWindow]||WINDOWS['24h'];
function spanBounds(){ const e=spanEnd?+spanEnd:Date.now(); return [e-spanMs,e]; }
const isLiveSpan=()=>spanEnd===null;
function tlInstant(){ const v=+tlRange().value; const [s,e]=spanBounds();
  if(isLiveSpan() && v>=1000) return null;
  return new Date(s+(e-s)*v/1000); }

// A graduated ruler with absolute time labels on "nice" round boundaries, so the
// scale stays meaningful at any window and when zoomed to a past period.
const _M=60000,_H=3600000,_D=86400000;
const NICE=[_M,2*_M,5*_M,10*_M,15*_M,30*_M,_H,2*_H,3*_H,6*_H,12*_H,_D,2*_D,7*_D];
function niceStep(W,target){ for(const s of NICE){ if(W/s<=target) return s; } return NICE[NICE.length-1]; }
const _p=n=>String(n).padStart(2,'0');
function fmtAbs(d,W){ const hm=_p(d.getHours())+':'+_p(d.getMinutes());
  if(W>2*_D) return _p(d.getDate())+'/'+_p(d.getMonth()+1);
  if(W>12*_H) return _p(d.getDate())+'/'+_p(d.getMonth()+1)+' '+hm;
  return hm; }
function renderRuler(){
  const el=document.getElementById('tlRuler'); if(!el) return; el.innerHTML='';
  const [s,e]=spanBounds(), W=e-s;
  const add=(cls,frac,txt)=>{ const d=document.createElement('div'); d.className=cls;
    d.style.left=(frac*100)+'%'; if(txt!=null) d.textContent=txt; el.appendChild(d); };
  add('base',0);
  const minor=niceStep(W,26); for(let t=Math.ceil(s/minor)*minor;t<=e;t+=minor) add('tick min',(t-s)/W);
  // A "nice" step knows nothing about screen width; only pixels tell whether two labels would collide.
  const cw=el.clientWidth;
  const nLab=cw>0?Math.min(8,Math.max(2,Math.round(cw/110))):6;
  const major=Math.max(niceStep(W,nLab),minor);
  // Every k-th major, not "skip the ones that are too close": when consecutive
  // steps fall just under the gap, skipping drops them ALL and leaves one label.
  const stepFrac=major/W, minGap=cw>0?110/cw:0;
  const stride=(stepFrac>0&&minGap>0)?Math.max(1,Math.ceil(minGap/stepFrac)):1;
  let k=0;
  for(let t=Math.ceil(s/major)*major;t<=e;t+=major,k++){ const f=(t-s)/W; add('tick maj',f);
    if(k%stride===0) add('lab',f,fmtAbs(new Date(t),W)); }
}
// Zoom the timeline to a selected [a,b] period (ms since epoch).
// setSpan is REMOVED with the brush that was its only caller. It set spanMs to an
// arbitrary span, which the relay's closed list of windows would refuse, and it
// reached for the slider and the LIVE button that no longer exist.
// --- change-density heatmap: one row per entity type, a grid of small cells across
// the span (empty cells drawn faint grey, like a contribution graph), cell colour =
// the type's colour and intensity = how many changes it saw — so which kind of thing
// churned and when jumps out. Type names live in the left gutter, off the grid. Built
// from the global recentChanges feed (heartbeats excluded), rendered progressively as
// pages arrive so it fills in instead of blocking.
const CELL_PX=9, GAP_PX=2, ROW_PX=11;
let profileGen=0;
async function loadProfile(){
  const el=document.getElementById('tlProfile'); if(!el) return;
  const gen=++profileGen;   // supersede any in-flight profile load
  const errEl=document.getElementById('tlErr'); if(errEl) errEl.textContent='';
  const [s,e]=spanBounds();
  // Derived from the window, never from a second clock read: spanBounds() already
  // took the time, and reading it again makes the span one millisecond longer, so
  // the duration comes out 86401s for a 24h window. The relay accepts a closed list
  // of windows, so that is a 400 and an empty heatmap -- and it only looked right
  // when both reads landed in the same millisecond, which is to say by luck.
  const durS=Math.round(spanMs/1000);
  const data=new Map();     // entity type -> [event timestamps within the span]
  let after=null, guard=0;
  try{
    do{
      // MEANINGFUL entity changes only — heartbeats (entity.unchanged) are not changes
      // and would drown the signal; relation changes have no entity type, so skip them.
      const asOf = asOfISO();
      let windowVars;
      // Absolute bounds whenever the window is not live, not only under asOf:
      // after Earlier with a live map, a window relative to now was fetched and
      // then filtered to the shifted bounds, which left the strip empty.
      if (asOf || !isLiveSpan()) {
        const [fromMs, toMs] = spanBounds();
        // Absolute bounds, and NO asOf: recentChanges has no such argument, and a
        // relay that refuses unknown variables answers 400. The window already
        // says which period to read; asOf would be a second way to say it.
        windowVars = {
          from: new Date(fromMs).toISOString().replace(/\.\d{3}Z$/, 'Z'),
          to: new Date(toMs).toISOString().replace(/\.\d{3}Z$/, 'Z')
        };
      } else {
        windowVars = { window: durS + 's' };
      }
      const variables = after
        ? { ...windowVars, first: 200, after }
        : { ...windowVars, first: 200 };
      const r=await fetch(API,{method:'POST',headers:gqlHeaders(),credentials:'same-origin',body:JSON.stringify({id:'recentChanges',variables})});
      if(!r.ok) throw new Error(readFailureMessage(r.status,'read failed with status '+r.status));
      const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
      if(gen!==profileGen) return;   // a newer load started; drop this one
      const c=j.data.recentChanges;
      for(const ed of c.edges){ const n=ed.node; if(n.changeType.endsWith('UNCHANGED') || !n.entity) continue;
        const t=Date.parse(n.eventTime);
        if(t>=s && t<=e){ let arr=data.get(n.entity.type); if(!arr){ arr=[]; data.set(n.entity.type,arr); } arr.push(t); } }
      after=c.pageInfo.hasNextPage?c.pageInfo.endCursor:null;
      if((guard&3)===0) renderProfile(data,s,e);   // progressive fill (every 4 pages)
    }while(after && ++guard<40);
    if(gen===profileGen) renderProfile(data,s,e);
  }catch(err){
    // A partial read must not look like a complete one: the strip only shows
    // what arrived before the failure, so the message has to say so.
    if(gen===profileGen){
      const e2=document.getElementById('tlErr');
      if(e2){
        const reason=(err&&typeof err.message==='string'&&err.message)?err.message:(err!=null?String(err):'unknown cause');
        e2.textContent=data.size===0
          ?'⚠ change history unavailable: '+reason
          :'⚠ change history incomplete, reading stopped partway: '+reason;
      }
    }
  }
}
function renderProfile(data,s,e){
  // The count comes from the same pass that draws the strip, so it can never
  // disagree with it: a number computed separately would drift from the picture
  // it labels, and the picture is the thing the reader trusts.
  const ev=document.getElementById('tlEvents');
  if(ev){ let n=0; for(const arr of data.values()) n+=arr.length;
    ev.textContent = n ? fmtCount(n)+' events' : ''; }
  const el=document.getElementById('tlProfile'), gut=document.getElementById('tlGutter');
  if(!el||!gut) return;
  el.querySelectorAll('.cell').forEach(x=>x.remove()); gut.innerHTML='';
  const types=[...data.keys()].sort(); const W=e-s||1;
  const B=Math.max(24,Math.min(160,Math.round((el.clientWidth||600)/(CELL_PX+GAP_PX))));
  el.style.height=Math.max(14,types.length*ROW_PX)+'px';
  const grid=types.map(ty=>{ const a=new Array(B).fill(0);
    for(const t of data.get(ty)) a[Math.min(B-1,Math.max(0,Math.floor((t-s)/W*B)))]++; return a; });
  let max=1; for(const a of grid) for(const v of a) if(v>max) max=v;
  const cw=100/B;
  types.forEach((ty,ri)=>{ const a=grid[ri], col=colorFor(ty);
    for(let i=0;i<B;i++){ const n=a[i], d=document.createElement('div'); d.className='cell';
      d.style.left=(i*cw)+'%'; d.style.width='calc('+cw+'% - '+GAP_PX+'px)';
      d.style.top=(ri*ROW_PX)+'px'; d.style.height=(ROW_PX-GAP_PX)+'px';
      if(n){ d.style.background=col; d.style.opacity=(0.3+0.7*(n/max)).toFixed(2);
        d.title=typeLabel(ty)+' · '+n+' change'+(n>1?'s':''); }
      else d.style.background='rgba(180,190,205,.06)';   // empty = faint grey square
      el.appendChild(d); }
    const lab=document.createElement('div'); lab.className='rowlab'; lab.textContent=typeLabel(ty);
    lab.style.top=(ri*ROW_PX)+'px'; lab.style.color=col; gut.appendChild(lab); });
}
// Immediate cursor readout: the exact timestamp under the handle, updated on every
// move so you always know where the cursor is; the as-of query stays debounced.
function updateCursorLabel(){
  const t=tlInstant(), lbl=document.getElementById('tlLabel'), live=document.getElementById('tlLive');
  if(!t){ lbl.textContent='now'; live.classList.remove('hist'); }
  else{ lbl.textContent=t.toLocaleString(); live.classList.add('hist'); }
}
async function loadAsOf(iso){
  // Kept only so no existing reference breaks; no caller reaches it any more.
}
function returnLive(){ playing=false; clearTimeout(playTimer); syncPlayBtn(); historical=false;
  spanEnd=null; spanMs=WINDOWS[tlWindow]||WINDOWS['24h']; tlRange().value=1000;
  document.getElementById('tlLabel').textContent='now';
  document.getElementById('tlLive').classList.remove('hist');
  renderRuler(); loadProfile();
  setStatus('poll','polling');
  loadFull(); }
let tlTimer=null;
function onTimeline(){ clearTimeout(tlTimer); tlTimer=setTimeout(()=>{
  const t=tlInstant();
  if(!t){ returnLive(); return; }
  historical=true;
  document.getElementById('tlLabel').textContent=t.toLocaleString();
  document.getElementById('tlLive').classList.add('hist');
  setStatus('poll','as-of '+t.toLocaleString());
  loadAsOf(t.toISOString());
},180); }

// --- replay: play history forward from the cursor, fast-forwarding like scrubbing
// a video to hunt for a moment. Each frame nudges the cursor forward (by the speed)
// and loads that instant; frames wait for the query so the server is never flooded.
let playing=false, playTimer=null;
function syncPlayBtn(){ const b=document.getElementById('tlPlay');
  b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing); }
function pausePlay(){ playing=false; clearTimeout(playTimer); syncPlayBtn(); }
async function playFrame(){
  if(!playing) return;
  const v=+tlRange().value + (+document.getElementById('tlSpeed').value);
  if(v>=1000){ pausePlay(); returnLive(); return; }   // reached now -> resume live
  tlRange().value=v; historical=true;
  const t=tlInstant();
  document.getElementById('tlLive').classList.add('hist');
  document.getElementById('tlLabel').textContent=t.toLocaleString();
  setStatus('poll','▶ replay '+t.toLocaleString());
  await loadAsOf(t.toISOString());
  if(playing) playTimer=setTimeout(playFrame,250);
}
function play(){ if(playing) return;
  if(+tlRange().value>=1000) tlRange().value=0;   // at now -> start from the window's oldest edge
  playing=true; historical=true; syncPlayBtn(); playFrame(); }

function feed(txt){ const f=document.getElementById('feed'); if(!f) return; const d=document.createElement('div');
  d.textContent=new Date().toLocaleTimeString()+'  '+txt; f.prepend(d);
  while(f.childNodes.length>40) f.removeChild(f.lastChild); }
function flashStatus(){ const i=document.querySelector('#status i'); i.classList.remove('pulse'); void i.offsetWidth; i.classList.add('pulse'); }

function applyEntity(ce){ if(historical) return; const n=ce&&ce.entity; if(!n) return;
  if(ce.changeType==='ENTITY_DELETED') n.deleted=true;
  ENT[n.id]=n; scheduleRebuild();
  if(ce.changeType!=='ENTITY_UNCHANGED'){ feed(ce.changeType+'  '+n.type+' '+labelOf(n)); flashStatus(); } }
function applyRelation(ce){ if(historical) return; const r=ce&&ce.relation; if(!r) return;
  if(ce.changeType==='RELATION_DELETED') delete REL[r.id]; else REL[r.id]=r;
  scheduleRebuild();
  if(ce.changeType!=='RELATION_UNCHANGED'){ feed(ce.changeType+'  '+r.type); flashStatus(); } }

// The side panel is filled from an entity id, not from a click: every view of
// the graph inspects the same way, so a second renderer cannot grow a second
// opinion of what a node is.
// With nothing selected the card carries the LIST of what is lit, named and
// clickable. It is the answer to a name the map could not fit: every lit thing
// is reachable by its name here, even when its label lost its seat on the
// canvas. Built with DOM nodes, never innerHTML: these names come from the
// network.
const LIT_LIST_MAX = 60;
function renderLitList(box){
  box.textContent='';
  box.classList.remove('list');
  const lit=[];
  for(const id of onMapIds()){
    if(ENT[id]) lit.push(id);   // kind summaries are not entities and are not listed
  }
  if(!lit.length){ const d=document.createElement('div'); d.className='empty';
    d.textContent='Click an element to see its details.'; box.appendChild(d); return; }
  lit.sort((a,b)=>{
    const ea=ENT[a], eb=ENT[b];
    const ca=CITED.has(ea.identityFingerprint)?0:1, cb=CITED.has(eb.identityFingerprint)?0:1;
    if(ca!==cb) return ca-cb;
    const da=degree[a]||0, db=degree[b]||0;
    if(da!==db) return db-da;
    const la=labelOf(ea), lb=labelOf(eb);
    return la<lb?-1:la>lb?1:0;
  });
  box.classList.add('list');
  // A <details>: it folds to its own title with no script, and a folded card
  // reserves almost nothing, which is the whole point of the exercise.
  // CLOSED by default: open, this list sat in the middle of the map. Folded it is
  // a pill the width of its own title, and the chevron says it is a control.
  const det=document.createElement('details'); det.open=false;
  const sum=document.createElement('summary');
  const chev=document.createElement('span'); chev.className='chev';
  sum.appendChild(document.createTextNode(fmtCount(lit.length)+' shown '));
  chev.textContent='\u25BE';
  sum.appendChild(chev);
  det.appendChild(sum);
  box.appendChild(det);
  const ul=document.createElement('div'); ul.className='litlist';
  for(const id of lit.slice(0,LIT_LIST_MAX)){
    const e=ENT[id];
    const row=document.createElement('button');
    row.type='button'; row.className='litrow';
    row.textContent=labelOf(e);
    row.title=nameLabel(e)+' \u00b7 '+typeLabel(e.type);   // the FULL name, which the drawn label may have shortened
    // Hover points at it on the map, click opens its card. Pointing costs
    // nothing and undoes itself; opening is the reader's decision.
    row.onmouseenter=()=>{ try{ net.selectNodes([id]); }catch(_){} };
    row.onmouseleave=()=>{ try{ net.unselectAll(); }catch(_){} };
    row.onfocus=row.onmouseenter; row.onblur=row.onmouseleave;   // the keyboard points too
    row.onclick=()=>{ inspect(id); try{ net.selectNodes([id]); }catch(_){} };
    ul.appendChild(row);
  }
  det.appendChild(ul);
  det.addEventListener('toggle',()=>{
    chev.textContent = det.open ? '\u25B4' : '\u25BE';
    fitEmphasised();   // folding gives pixels back to the map
  });
  if(lit.length>LIT_LIST_MAX){
    const more=document.createElement('div'); more.className='muted';
    // Says the bound rather than ending silently: a list that simply stops is a
    // list the reader believes is complete.
    more.textContent='and '+fmtCount(lit.length-LIT_LIST_MAX)+' more — narrow with a view or the search';
    det.appendChild(more);
  }
}

function inspect(id){
  // Writes into #detail, never into the whole aside: the question panel and the
  // activity feed are siblings, and replacing the aside's contents destroyed both
  // on the first click -- the ask box could not be used again without a reload.
  const box=document.getElementById('detail');
  const blank='<div class="empty">Click an element to see its details.</div>';
  box.classList.remove('list');
  const n=id&&ENT[id];
  if(!n){ publishView(); renderLitList(box); return; }   // deselection: the Dock refuses an empty selection, so fall back to the view
  if(n.identityFingerprint){
    sendContext({ v:1, type:'context.selection', payload:{ kind:'element', value:n.identityFingerprint, label:(n.displayName||'').slice(0,80) } });
  } else {
    // A selection without a fingerprint designates nothing quotable, and the id is
    // local to the replica that answered it.
    publishView();
  }
  // Never surface an attribute whose key mentions a contact: the values are real
  // personal addresses, and this panel gets screen-shared.
  const visible=a=>(a||[]).filter(x=>!/contact/i.test(x.key));
// Escape FIRST, then insert the break hints: inserting <wbr> first would let a
// hostile key inject markup, and escaping afterwards would print "&lt;wbr&gt;".
const escKeyBreakable=s=>esc(s).replace(/([._:\-\/])/g,'$1<wbr>');
  const rows=a=>visible(a).map(x=>'<tr><td class="k">'+escKeyBreakable(x.key)+'</td><td>'+esc(x.value)+'</td></tr>').join('')||'<tr><td class="muted" colspan=2>\u2014</td></tr>';
  const attr=k=>{ const hit=(n.attributes||[]).find(x=>x.key===k); return hit?hit.value:null; };
  const version=attr('service.version')||attr('db.system.version')||attr('os.version');
  // REL is an object keyed by relation id, not an array: Object.values first.
  const hostRel=Object.values(REL).find(r=>r.fromId===id&&r.type==='runs_on');
  const host=hostRel&&ENT[hostRel.toId]?ENT[hostRel.toId].displayName:null;
  const status=attr('entity.lifecycle.status');
  const F='style="font-family:inherit"';
  box.innerHTML='<button id="panelClose" title="Close" style="float:right">\u00d7</button>'
    +'<h2>'+esc(n.displayName||n.id)+(n.deleted?' <span class="muted">(deleted)</span>':'')+'</h2>'
    +'<table>'
    +'<tr><td class="k" '+F+'>Name</td><td '+F+'>'+esc(n.displayName||n.id)+'</td></tr>'
    +'<tr><td class="k" '+F+'>Type</td><td '+F+'>'+esc(typeLabel(n.type))+'</td></tr>'
    +(version?'<tr><td class="k" '+F+'>Version</td><td '+F+'>'+esc(version)+'</td></tr>':'')
    +(host?'<tr><td class="k" '+F+'>Server</td><td '+F+'>'+esc(host)+'</td></tr>':'')
    +(status?'<tr><td class="k" '+F+'>State</td><td '+F+'>'+esc(status)+'</td></tr>':'')
    +'</table>'
    +'<details><summary class="muted">Technical details</summary>'
    // The fingerprint, not the id: an id is local to the replica that answered.
    +'<div class="muted" style="word-break:break-all">'+esc(n.identityFingerprint||'\u2014')+'</div>'
    +'<table>'+rows(n.identity)+'</table>'
    +'<table>'+rows(n.attributes)+'</table>'
+'</details>'
    +'<div class="actions">'
    +'<button id="btnAsk" class="primary"'+(n.identityFingerprint?'':' hidden')+'>Ask about it</button>'
    +'<button id="btnNeighbors" class="secondary">Neighbors</button>'
    +'</div>';
const cb=document.getElementById('panelClose');
  if(cb) cb.onclick=()=>{ renderLitList(box); publishView(); };
  const ask=document.getElementById('btnAsk');
  if(ask && n.identityFingerprint) ask.onclick=()=>{
    // Contract fixed by the portal; no fingerprint means no button, so no send.
    sendContext({v:1, type:"ask", payload:{kind:"element", value:n.identityFingerprint, label:(n.displayName||'').slice(0,80)}});
  };
  const nb=document.getElementById('btnNeighbors');
  if(nb) nb.onclick=()=>{
    // Opens the machine down to its CHILDREN, never stopping at the kind level:
    // a kind node carries no fingerprint, so it has no detail and no Ask about
    // it, which is the opposite of what this button offers.
    if(folded && ENT[id]){
      if(expanded.has(id)){ expanded.delete(id); }
      else {
        expanded.add(id);
        for(const k in ENT){ if(OWNER[k]===id) expandedKinds.add(id+'\u0000'+ENT[k].type); }
      }
      rebuild();
      if(!expanded.has(id)){
        // Closing frames the whole DRAWN map again. Keeping the zoom of the
        // opening brought 190 machines back at scale 3, with 478 discs on names.
        fitEmphasised();
        return;
      }
    }
    // Then frames the machine and its children. maxZoomLevel is raised here on
    // purpose: a handful of nodes should fill the canvas, which is the whole
    // point of asking to see one machine's neighbours.
    // Through the reserving fit as well: this one runs with the detail card OPEN,
    // so a bare fit here frames the neighbours under the card and the strip.
    try{ fitReservingPanel([id, ...net.getConnectedNodes(id)]); }catch(e){}
  };
}
net.on('click',p=>{ inspect(p.nodes.length?p.nodes[0]:null); });
// Clearing the highlight is deliberately NOT bound to a background click: the canvas
// emits one at the end of a pan over empty space, so moving the view would have
// silently thrown the highlight away and forced a full redraw. The labelled button
// under the answer is the only way out, which is also the discoverable one.
// Dimming everything but an answer's citations is a state, and a state needs a way
// out: if the citations match nothing held here, the whole graph goes faint and the
// reader is stuck. Clicking the background clears it, and a button says so.
function clearHighlight(){
  if(!CITED.size) return;
  CITED.clear(); document.getElementById('panel').classList.remove('wide');
  const b=document.getElementById('clearHl'); if(b) b.remove();
  rebuild();
}

// --- the question panel ------------------------------------------------------
// The browser never sends GraphQL and never sees a tenant: it posts a question to
// the portal relay, which holds both. Everything coming back is written with
// textContent, because an answer is text from a model, not markup we authored.
const CITED=new Set();   // fingerprints the latest answer cited; dims the rest
const CITED_OWNERS=new Set();   // owners holding a cited child, so a folded hit still shows
const MATCH_OWNERS=new Set();   // owners holding a filter match hidden by the fold (#567)
let foldedMatches=0;
const askQ=document.getElementById('askQ'), askBtn=document.getElementById('askBtn');
const askState=document.getElementById('askState'), askOut=document.getElementById('askOut');
async function ask(){
  const q=askQ.value.trim(); if(!q) return;
  askBtn.disabled=true; askState.textContent='Working…'; askOut.textContent='';
  const say=t=>{ const p=document.createElement('p'); p.textContent=t; askOut.appendChild(p); };
  const ac=new AbortController(); let timedOut=false;
  const timer=setTimeout(()=>{ timedOut=true; ac.abort(); },30000);
  try{
    const r=await fetch('/cartography/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'same-origin',body:JSON.stringify({question:q}),signal:ac.signal});
    if(!r.ok){
      let msg='Request failed.';
      try{ const j=await r.json(); if(j&&j.error) msg=String(j.error); }catch(_){}
      say(msg); return;
    }
    const j=await r.json();
    if(j&&j.answer!=null) say(String(j.answer));
    if(j&&j.table) renderTable(j.table);
    CITED.clear();
    if(j&&Array.isArray(j.cited)) for(const f of j.cited) CITED.add(String(f));
    rebuild();
    document.getElementById('panel').classList.add('wide');
    if(CITED.size){
      const b=document.createElement('button'); b.type='button'; b.id='clearHl';
      b.textContent='Clear highlight'; b.addEventListener('click',clearHighlight);
      askOut.appendChild(b);
    }
  }catch(_){
    say(timedOut?'The question took longer than 30 seconds and was cancelled.':'Request failed.');
  }finally{ clearTimeout(timer); askBtn.disabled=false; askState.textContent=''; }
}
// A row is an ARRAY, positional against columns -- not an object keyed by label.
const cellOf=(row,i)=>{ const v=Array.isArray(row)?row[i]:undefined; return (v===null||v===undefined)?null:v; };
function renderTable(t){
  if(!t||!Array.isArray(t.columns)||!Array.isArray(t.rows)) return;
  const table=document.createElement('table'); table.className='sh-list';
  const thead=document.createElement('thead'), hr=document.createElement('tr');
  for(const c of t.columns){ const th=document.createElement('th'); th.textContent=c&&c.label?c.label:''; hr.appendChild(th); }
  thead.appendChild(hr); table.appendChild(thead);
  const tb=document.createElement('tbody');
  for(const row of t.rows){
    const tr=document.createElement('tr');
    t.columns.forEach((c,i)=>{ const td=document.createElement('td');
      const v=cellOf(row,i); td.textContent=v===null?'—':String(v); tr.appendChild(td); });
    tb.appendChild(tr);
  }
  table.appendChild(tb); askOut.appendChild(table);
  if(t.truncated){ const d=document.createElement('div'); d.className='muted';
    d.textContent='Incomplete list.'; askOut.appendChild(d); }
  const bar=document.createElement('div'); bar.className='sh-export';
  const add=(label,name,mime,make)=>{ const b=document.createElement('button'); b.type='button';
    b.textContent=label; b.addEventListener('click',()=>download(name,mime,make(t))); bar.appendChild(b); };
  add('Export CSV','result.csv','text/csv;charset=utf-8',toCSV);
  add('Export JSON','result.json','application/json',toJSON);
  askOut.appendChild(bar);
}
function toCSV(t){
  const cell=v=>{
    let s=(v===null||v===undefined)?'':String(v);
    // A leading =, +, - or @ makes a spreadsheet treat the cell as a formula, so it
    // is prefixed with an apostrophe. The export is data, never something to run.
    //
    // The test skips leading whitespace and control characters first: a cell of
    // "\t=cmd" passes a naive first-character check, and the spreadsheet strips the
    // tab before parsing, so the formula runs anyway. Column labels go through this
    // same function, because a header is a cell too.
    // A plain number is exempt: "-5" is a value, and prefixing it would turn a
    // numeric column into text that no longer adds up. Anything else starting with
    // one of those characters is prefixed, whatever the column claims its type is --
    // trusting the declared type would move the decision to the relay.
    const lead=s.replace(/^[\s\u0000-\u001f]+/,'');
    if(/^[=+\-@]/.test(lead) && !/^[+-]?\d+(\.\d+)?$/.test(lead)) s="'"+s;
    if(/[",\r\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const out=[t.columns.map(c=>cell(c&&c.label)).join(',')];
  for(const row of t.rows) out.push(t.columns.map((c,i)=>cell(cellOf(row,i))).join(','));
  return out.join('\r\n');
}
function toJSON(t){
  return JSON.stringify(t.rows.map(row=>{ const o={};
    t.columns.forEach((c,i)=>{ o[(c&&c.label)||('c'+i)]=cellOf(row,i); }); return o; }),null,2);
}
function download(name,mime,text){
  const url=URL.createObjectURL(new Blob([text],{type:mime}));
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
askBtn.addEventListener('click',ask);
askQ.addEventListener('keydown',e=>{
  // IME composition fires keydown mid-input (keyCode 229); sending then would cut off typing
  if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229||askBtn.disabled)return;
  e.preventDefault();
  ask();
});

// Three plain-language views for a reader who does not know our type names. Each
// one fills `hidden` so only its own layer stays drawn.
//
// Two things the obvious shape gets wrong: `hidden` is a const Set, so it is
// cleared and refilled rather than reassigned; and `allTypes` is local to
// rebuild(), so the set of known types is taken from the entities themselves.
// Routes and remote endpoints are two thirds of the volume and are not what a
// reader means by "the network": dim by default, switched back on from Options.
// A view that lights everything shows nothing.
const VIEW_EXTRAS={vNet:['network.route','network.endpoint','network.neighbor']};
let showExtras=false;
const VIEWS={
  vNet:['host','network.interface','network.address','network.segment','network.device','network.endpoint','network.route','network.neighbor'],
  vHosts:['host','compute.vm','container','pod'],
  vApps:['host','service.instance','service.listener','db','cloud.resource'],
};
// The host is listed in all three views because it ANCHORS them: in Network it
// carries the interfaces, in Applications it carries the services, and a view
// that lit the children while turning their machine off would show a set of
// orphans. The fold is global and identical in every view -- a view changes what
// is lit, never what is drawn.
// The chosen view is remembered and re-applied on every redraw, not filled once at
// click time: the page polls every six seconds, so a type that arrives later would
// otherwise have escaped the filter and invited itself into all three views.
let activeView=null;
// Renamed from syncView: that name collided with the 360-dome function declared
// later in the same scope, and the collision was silent -- the layer views had
// been calling the dome.
function syncLayerView(){
  dimmed.clear();
  if(!activeView) return;
  // A view no longer REMOVES anything: it lights its subject and turns the rest
  // almost off. The map keeps one stable layout, so changing view moves nothing
  // and costs nothing -- and the reader keeps the shape of the whole estate in
  // view instead of being handed three unrelated pictures.
  const keep=new Set(VIEWS[activeView]);
  if(!showExtras) for(const t of (VIEW_EXTRAS[activeView]||[])) keep.delete(t);
  for(const n of Object.values(ENT)) if(!keep.has(n.type)) dimmed.add(n.type);
}
// The segments' look, in one place: showAll leaves a view too, and a second copy
// of this loop would be a second thing to forget.
function syncViewButtons(){
  for(const id of Object.keys(VIEWS)){
    const el = document.getElementById(id);   // tolerate a missing button like the rest of the page
    // The class owns the segment's look: an inline colour here would beat it and
    // paint amber on amber.
    if(el){ el.style.color = ''; el.classList.toggle('on', id===activeView); }
  }
}
function applyView(btn){
  const wasActive = activeView;
  activeView = (activeView===btn) ? null : btn;   // clicking the active view shows everything again
  const cap = document.getElementById('narrowStat');   // the notice must not outlive the narrowed map
  if (activeView !== wasActive && cap) cap.textContent = '';
  // An exemption was granted against ONE view. Carrying it into the next one
  // would leave an element the new view withholds sitting on the map with no
  // control on screen to explain it.
  if(activeView !== wasActive && REVEALED.size){
    REVEALED.clear();
    // The card was opened BY the reveal, on the revealed element. Leaving it up
    // over a map that no longer draws that element describes something the
    // reader cannot see -- and so would a selection left on it.
    try{ net.unselectAll(); }catch(_){}
    inspect(null);
  }
  if(!activeView){
    dimmed.clear();
  } else {
    syncLayerView();
    // The fold STAYS ON in a view. Undoing it was this page's own doing, and it is
    // what made Machines unreadable: measured on a real tenant, 400 drawn nodes,
    // a fit scale of 0.05 and labels half a pixel tall. Folded, the same view is
    // twenty machines carrying their children as satellites and counts.
  }
  syncFoldBtn();
  syncViewButtons();
  publishView();   // the Dock shows the view as a context token; it learns it from here
  // Nothing is re-laid out any more, so there is nothing to settle: the redraw
  // only repaints opacities and labels, and the camera does the rest. That is
  // why changing view is now nearly free.
  if (Object.keys(ENT).length >= 1000) announceThenDefer(() => { rebuild(); fitEmphasised(); });
  else { rebuild(); fitEmphasised(); }
}
for(const id of Object.keys(VIEWS)) document.getElementById(id).onclick=()=>applyView(id);

// Realtime: the relay exposes no subscription, so polling is the only path. The
// page kept a websocket with a polling fallback; only the fallback remains.
let pollTimer=null;
function setStatus(cls,txt){
  // The status pill is not shown in this build: "polling" says nothing to a reader
  // who did not ask how the page refreshes. Tolerate its absence rather than throw
  // at load, since the polling fallback calls this before anything else runs.
  const s=document.getElementById('status'); if(!s) return;
  s.className=cls; const t=document.getElementById('statusTxt'); if(t) t.textContent=txt;
}
function startPolling(){ if(!pollTimer) pollTimer=setInterval(tick,6000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function fallback(){ setStatus('poll','polling'); startPolling(); }
// A portal tab stays open for hours. Polling a full reload every 6s while nobody
// looks at it is load on the server for nothing, and stopPolling had lost its only
// caller when the websocket acknowledgement went away.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stopPolling(); } else { startPolling(); loadFull(); } });

let loading=false;   // one in-flight load at a time: overlapping full reloads pile up on a big park
let failedAt=0;      // after a definitive failure, wait before retrying: hammering a broken endpoint every 6s turns an outage into load
let lastScopeAt=0;
let loadedCounts='';      // the counts when the graph we hold was read
let loadedChangeAt=0;     // and the newest NON-heartbeat change at that moment   // above the entity threshold, refresh only the scope, and at most once a minute

// The grid is computed from the container height, and that height can change after layout settles.
function watchCanvasSize() {
  var el = document.getElementById('net');
  if (!el || typeof ResizeObserver === 'undefined') return;
  var lastW = -1, lastH = -1, timer = null;
  new ResizeObserver(function (entries) {
    // The sky's canvas was sized at switch-on and on window resize only; the
    // panel's drag handle resizes #net without either, and the bounds that
    // keep labels inside the canvas were then read against a stale width.
    try{ if(typeof domeMode !== 'undefined' && domeMode) sizeCanvas(); }catch(_){ }
    var r = entries[entries.length - 1].contentRect;
    if (r.width === lastW && r.height === lastH) return; // same size: never react to our own redraw
    lastW = r.width;
    lastH = r.height;
    // Guards are read when we ACT, not when we observe: a resize during a load
    // would otherwise be recorded and then never applied, since the observer
    // does not fire twice for the same size.
    if (timer !== null) clearTimeout(timer);
    timer = setTimeout(function () { if (!loading) fitEmphasised(); }, 150);   // the layout is stable; only the framing follows the canvas
  }).observe(el);
}

// The newest change that is NOT a heartbeat, in milliseconds; 0 when the window
// holds none, and null when the question could not be answered -- a caller must
// treat those two differently, because "nothing changed" lets the page hold still
// while "I could not tell" must not.
//
// One edge is enough: the answer is newest-first and the persisted document fixes
// includeHeartbeats to false, so the first edge IS the newest real change.
// Why a reload happened, on the console. Three guesses have now been made about
// an unnecessary reload five seconds after opening -- the portal's, mine, and the
// one before it -- and all three were reasoning about code instead of reading
// what the page did. A branch that fires should say so.
function sayReload(why){ try{ console.log('[toise/carto] reload: '+why); }catch(_){ } }

async function newestMeaningfulChange(){
  try{
    const r = await fetch(API,{method:'POST',headers:gqlHeaders(),credentials:'same-origin',
      body:JSON.stringify({id:'recentChanges',variables:{window:'3600s',first:1}})});
    if(!r.ok) return null;
    const j = await r.json();
    if(j.errors) return null;
    const rc = j.data && j.data.recentChanges;
    if(!rc || !rc.edges) return null;
    if(!rc.edges.length) return 0;                      // an hour with no real change
    const n = rc.edges[0].node;
    // The document excludes heartbeats, so this should not fire. If it ever does,
    // the filter is not what this code believes and guessing would be worse.
    if(!n || !n.eventTime || String(n.changeType||'').endsWith('UNCHANGED')) return null;
    const t = Date.parse(n.eventTime);
    return Number.isNaN(t) ? null : t;
  }catch(_){ return null; }
}

function tick(){
  if(loading) return;                                  // never start a load while one is running
  if(Date.now()-failedAt < 60000) return;              // no retry within 60s of a definitive failure
  // A failure is a reason to reload, and the size rule exists only to avoid
  // reloading a big fleet for no reason, so it must not swallow this case.
  if(failedAt !== 0){
    loadFull().then(ok => { if(ok) failedAt = 0; });  // retry the full load once the cooldown passed; reset only on success
    return;
  }
  // Re-read the SCOPE, which is one small answer, and reload the graph only when
  // it says something actually happened. Measured by the portal: a full re-read
  // every six seconds is 1.1 MB a burst, about 180 kB/s per open tab, and on a
  // quiet fleet every byte of it re-fetches what the page already holds.
  //
  // The old guard keyed on how many entities were LOADED, over two thousand. The
  // relay strips half the fleet before the page sees it, so a 2332-entity tenant
  // arrives as 1088 and never reached the guard -- a threshold defeated by a
  // filter upstream of it.
  if(Date.now()-lastScopeAt < 5000) return;
  lastScopeAt=Date.now();
  refreshScope({quiet:true}).then(()=>{
    if(!SCOPE) return;
    // Counts first: an entity gained or lost is a change whatever the journal says.
    const counts = SCOPE.entities+'/'+SCOPE.relations;
    if(counts !== loadedCounts){ sayReload('counts '+loadedCounts+' -> '+counts); loadFull(); return; }
    // Then ask what CHANGED, not when anything last happened. graphScope's
    // newestEvent is the last key of the time index, heartbeats included, so on a
    // fleet that beats it advances without anything visible moving -- measured by
    // the portal, two full reloads in a hundred seconds for nothing. A heartbeat
    // is a producer saying it is still there; it is not a change.
    newestMeaningfulChange().then(t=>{
      if(t === null){ sayReload('probe unanswerable'); loadFull(); return; }
      if(t > loadedChangeAt) sayReload('change '+new Date(t).toISOString()+' newer than read '+new Date(loadedChangeAt).toISOString()), loadFull();
    });
  });
}

function noteLoadFailure(){ failedAt=Date.now(); }

// Positions the map as the reader types, without changing the scale: they asked
// to go somewhere, not to zoom. Hosts are proposed first because that is what
// the reader names when they name a thing.
// Is this entity currently removed from the map? Read from the drawn node, not
// recomputed from the rule: the two could disagree and the drawn one is the truth.
function isOffMap(id){
  try{ const nd = nodes.get(id); return !nd || nd.hidden === true; }catch(_){ return false; }
}

// Show an entity and centre on it. "The search shows and centres the match" was
// the requirement, so picking something the current view withholds must put it
// back rather than quietly focus a node nobody can see.
// What is keeping this entity off the map, by name, so the page can say it. An
// empty set with the entity off the map means the fold alone: it is riding
// inside a carrier, withheld by nothing.
function withheldBy(id){
  const e = ENT[id];
  const why = new Set();
  if(!e){ why.add('gone'); return why; }
  if(hidden.has(e.type)) why.add('legend');
  if(activeView && dimmed.has(e.type)) why.add('view');
  if(CITED.size && !CITED.has(e.identityFingerprint) && !CITED_OWNERS.has(e.id)) why.add('highlight');
  if(attrQuery.trim() && !attrMatch(e) && !MATCH_OWNERS.has(e.id)) why.add('search');
  if(loopbackOf(e)) why.add('loopback');
  // Its carrier switched off in the legend is not a reason to refuse -- the rule
  // "switching a type off never puts more on the map" holds, since nothing
  // appeared at the moment of switching, and the reader asked for this element
  // by name -- but it is a reason the message must give.
  if(hiddenAncestorType(e.id)) why.add('carrier');
  return why;
}

// The type of the first carrier up the chain that the reader switched off, or
// '' when none is. The whole chain, not the direct owner: a service folded in a
// container folded in a host is held back by the host, and the direct owner is
// the container, which is on. Walked before any exemption is granted, so the
// climb is the one the fold would have made.
function hiddenAncestorType(id){
  const seen = new Set();
  let cur = id;
  for(;;){
    if(seen.has(cur)) return '';
    seen.add(cur);
    const up = OWNER[cur];
    if(!up || !ENT[up]) return '';
    if(hidden.has(ENT[up].type)) return ENT[up].type;
    cur = up;
  }
}

function reveal(id){
  // The view STAYS. Only this element leaves the withholding, which is what was
  // asked for: showing one machine by name should not undo the reader's view.
  //
  // Its links do not come with it. vis keeps an edge hidden while either end is
  // hidden, so a lone revealed element arrives without its neighbours -- and that
  // is the right trade: revealing them too would widen the view by an unbounded
  // amount, which is the opposite of naming one element.
  if(isOffMap(id)){
    // Decide the cause BEFORE acting. The first version acted, then blamed the
    // legend whatever the cause -- measured: an element held back by the search
    // or the Dock's highlight stayed hidden under a message naming a legend
    // nobody had touched, while the badge rose by one with nothing more drawn,
    // because the exemption had been added, built, hidden, and then dropped
    // without a redraw.
    const why = withheldBy(id);
    if(why.has('gone')){ say('That element is no longer on the map.'); return; }
    if(why.has('legend')){
      say(typeLabel(ENT[id].type)+' is switched off in the legend, so this element cannot be shown. Switch it back on first.');
      return;
    }
    REVEALED.add(id);
    rebuild();
    if(isOffMap(id)){
      // Still verify: a cause this function does not know about must not become
      // a false "showing". Undo, redraw so the badge tells the truth, and say so.
      REVEALED.delete(id);
      rebuild();
      say('This element could not be shown.');
      return;
    }
    // Leave the field. With the focus still in it, Escape went to the field's own
    // handler and never reached showAll, so the sentence below was false on the
    // main path -- Enter -- and only true after a mouse click on a suggestion.
    const g = document.getElementById('goto');
    if(g && document.activeElement === g) g.blur();
    const names = {view:'the current view', search:'the search', highlight:"the Dock's highlight", loopback:'the loopback filter'};
    const outside = [...why].filter(w => names[w]).map(w => names[w]);
    const offType = why.has('carrier') ? hiddenAncestorType(id) : '';
    const carrierOff = offType ? ' Its '+typeLabel(offType)+' is switched off in the legend.' : '';
    say((outside.length
      ? 'Showing this element outside '+outside.join(' and ')+'.'
      : 'Showing this element on its own, out of the carrier it was folded into.')
      + carrierOff + ' Esc or Show all puts everything back.');
  }
  try{ net.selectNodes([id]); net.focus(id,{scale:net.getScale(),animation:false}); }catch(_){}
  syncLabelSize();
  inspect(id);
}

function wireGoto(){
  const inp = document.getElementById('goto');
  if(!inp) return;
  const list = document.createElement('div');
  list.className = 'goto-list';
  list.style.display = 'none';
  (inp.parentNode || document.body).appendChild(list);
  let matches = [];

  const close = () => { list.style.display='none'; list.textContent=''; matches=[]; };

  const draw = () => {
    list.textContent = '';
    if(!matches.length){
      const d = document.createElement('div'); d.className='goto-none';
      d.textContent = 'no match'; list.appendChild(d);
    } else {
      for(const m of matches){
        const b = document.createElement('button');
        b.type='button'; b.className='goto-item';
        // "sfh914 · sfh914.senhub.io": the short form the map draws, and the
        // full name it stands for, when the two differ.
        const shortName = labelOf(m.e), fullName = nameLabel(m.e) || '';
        b.textContent = (fullName && fullName !== shortName) ? shortName + ' \u00b7 ' + fullName : shortName;
        b.title = titleOf(m.e);
        if(m.off){
          const tag=document.createElement('span');
          tag.textContent=' \u00b7 hidden';
          tag.style.opacity='.6';
          b.appendChild(tag);   // say so, rather than let the click look broken
        }
        b.onclick = () => { close(); inp.value=''; reveal(m.id); };
        list.appendChild(b);
      }
    }
    list.style.display = 'block';
  };

  let typeTimer = 0;
  const onType = () => {
    const want = inp.value.trim().toLowerCase();
    if(!want){ close(); return; }                 // an empty field moves nothing
    // Two buckets, not one pass with an early exit: hosts have to be collected
    // even when they come late in ENT, and ENT is in no useful order. Stopping
    // only when BOTH buckets are full keeps the walk bounded on a large estate
    // without ever dropping a host in favour of eight services.
    const hosts = [], others = [];
    for(const id in ENT){
      if(hosts.length >= 8 && others.length >= 8) break;
      const e = ENT[id];
      // Matched on the full name, so a typed domain still finds its host; shown short.
      const lab = (nameLabel(e) || labelOf(e));
      if(!lab || lab.toLowerCase().indexOf(want) !== 0) continue;
      if(e.type === 'host'){ if(hosts.length < 8) hosts.push({id, e}); }
      else if(others.length < 8) others.push({id, e});
    }
    const byName = (a,b) => { const la=labelOf(a.e), lb=labelOf(b.e); return la<lb?-1:la>lb?1:0; };
    hosts.sort(byName); others.sort(byName);
    matches = hosts.concat(others).slice(0, 8);
    for(const m of matches) m.off = isOffMap(m.id);
    // Only a visible match is worth centring on while typing. An invisible one is
    // still proposed -- it exists -- and picking it reveals it.
    const firstOn = matches.find(m => !m.off);
    if(firstOn){

// --- the dome: the same chart, wrapped around the viewer --------------------
// A SECOND VIEW of the one layout, never a second layout. The settled 2-D
// positions are read back from the network and mapped onto the celestial
// sphere by an inverted azimuthal projection: distance from the layout's
// centre becomes polar angle, bearing becomes azimuth. The middle of the graph
// therefore sits straight ahead and its outskirts wrap behind your shoulders,
// which is the one arrangement where "turn around to see the rest" is
// literally true, and where the two views are the same sky rather than two
// pictures that happen to share a colour scheme.
//
// Everything a star looks like is read from the SAME vis.DataSet the plate
// draws from: size, colour, opacity, label, and an edge's own colour (so
// "edges: off" paints transparent here too, for free). Nothing about a node's
// appearance is decided twice. This page already shipped that defect once, by
// reimplementing the server's display-name cascade in JavaScript.
//
// The projection is gnomonic, so a great circle through two stars draws as a
// STRAIGHT segment: a relation needs no sampling, only clipping at the near
// plane. It distorts towards the edges, which is why the field of view stays
// well under 180 degrees — you cannot see the whole sky at once, by

// Unit directions spread uniformly over the whole sphere (uniform in cos, not
// in the polar angle) so the field is not bunched at the poles. Same seed as
// the flat field: one sky, identical on every reload.
const FIELD_DOME=(function(){ let s=20261029; const out=[];
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<900;i++){ const u=rnd()*2-1, ph=rnd()*Math.PI*2, r=Math.sqrt(1-u*u);

// layout keeps moving for a bounded window after any structural change, so a
// cached wrap would show an arrangement the plate has already left. One hypot
// and one atan2 per node, next to a projection we do anyway.
function wrapLayout(){
  const pos=net.getPositions(), ids=Object.keys(pos);
  for(const k in dirOf) delete dirOf[k];

  let cx=0, cy=0;
  for(const id of ids){ cx+=pos[id].x; cy+=pos[id].y; }
  cx/=ids.length; cy/=ids.length;
  let R=0;
  for(const id of ids){ const d=Math.hypot(pos[id].x-cx,pos[id].y-cy); if(d>R) R=d; }
  if(R<=0) R=1;

    // name on nothing, and three of them sat at the edges at 1440.
    if(it.p.x<0||it.p.x>cvW||it.p.y<0||it.p.y>cvH) continue;
    let x=Math.max(Math.min(it.p.x-w/2, cvW-w-2), 2), y=it.p.y+it.rad+4;   // max last: a name wider than the canvas keeps its head
    if(y+12>cvH-2) y=it.p.y-it.rad-14;
    y=Math.max(2, Math.min(y, cvH-14));   // and never off the top either
    const box={x0:x-2,y0:y-1,x1:x+w+2,y1:y+12};
    let clash=false;
    if(!isHost(it) && !isKind(it.n.id)) for(const q of placed){
      if(box.x0<q.x1 && box.x1>q.x0 && box.y0<q.y1 && box.y1>q.y0){ clash=true; break; }
    }
    if(clash) continue;
    placed.push(box);
    ledger.push(Object.freeze({id:it.n.id, kind:isHost(it)?'host':(isKind(it.n.id)?'kind':'other'), text, box:Object.freeze({...box})}));
    g2.globalAlpha=it.alpha;
    g2.fillStyle='rgba(195,209,234,0.92)';
    g2.fillText(text, x+w/2, y);   // at the clamped centre, not the disc's
    g2.globalAlpha=1;
  }
  try{
    window.toiseDomeLabels=Object.freeze({
      // Inside the canvas only, as the naming is: a half disc at the edge is
      // drawn but not named, and the measure compares the two.
      drawn:Object.freeze((()=>{ const ins=drawn.filter(it=>!(it.p.x<0||it.p.x>cvW||it.p.y<0||it.p.y>cvH)); return {hosts:ins.filter(isHost).length, kinds:ins.filter(it=>isKind(it.n.id)).length, others:ins.filter(it=>!isKind(it.n.id)&&!isHost(it)).length}; })()),
      labels:Object.freeze(ledger)
    });
  }catch(_){ }

  const az=((yaw*180/Math.PI)%360+360)%360, alt=pitch*180/Math.PI;
  document.getElementById('bearing').textContent=
    'az '+String(Math.round(az)).padStart(3,'0')+'° alt '+
    (alt<0?'-':'+')+String(Math.round(Math.abs(alt))).padStart(2,'0')+'°';
}

function domeLoop(){
  raf=null;
  if(!domeMode) return;
  if(!document.hidden){
    if(drift && !domeDrag && !reduceMotion) yaw+=0.0012;
    drawDome();
  }
  raf=requestAnimationFrame(domeLoop);
}
function kick(){ if(domeMode && raf===null) raf=requestAnimationFrame(domeLoop); }

cv.addEventListener('pointerdown',ev=>{ domeDrag=true;
  lastX=startX=ev.clientX; lastY=startY=ev.clientY;
  cv.classList.add('drag'); try{ cv.setPointerCapture(ev.pointerId); }catch(_){} });
cv.addEventListener('pointermove',ev=>{ if(!domeDrag) return;
  const k=fov/cvH;
  yaw-=(ev.clientX-lastX)*k;
  pitch=Math.max(-1.45,Math.min(1.45,pitch+(ev.clientY-lastY)*k));
  lastX=ev.clientX; lastY=ev.clientY; });
cv.addEventListener('pointerup',ev=>{ if(!domeDrag) return;
  domeDrag=false; cv.classList.remove('drag');
  // Measured from where the press STARTED, not from the last move: a turn ends
  // a few pixels from its previous frame and would otherwise read as a click.
  if(Math.hypot(ev.clientX-startX,ev.clientY-startY)<4) pickAt(ev); });
cv.addEventListener('pointercancel',()=>{ domeDrag=false; cv.classList.remove('drag'); });
cv.addEventListener('wheel',ev=>{ ev.preventDefault();
  fov=Math.max(26*Math.PI/180,Math.min(118*Math.PI/180,fov+ev.deltaY*0.0012)); },{passive:false});

function pickAt(ev){
  const r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
  let best=null, bd=Infinity;
  for(const h of hitBoxes){ const d=Math.hypot(h.x-x,h.y-y); if(d<=h.r && d<bd){ bd=d; best=h.id; } }
  // A kind box stands for a count; there is nothing to inspect behind it, and
  // opening it belongs to the plate where double-click lives.
  inspect(isKind(best)?null:best);
}

const viewBtn=document.getElementById('view'), domeBar=document.getElementById('domebar');
function syncView(){
  viewBtn.textContent='view: '+(domeMode?'dome 360':'chart');
  viewBtn.style.color=domeMode?'var(--accent)':'';
  cv.hidden=!domeMode; domeBar.hidden=!domeMode;
  // The footer and the sky's bar share the bottom edge. With the footer grown
  // by "withheld by the portal" it ran under the bar's buttons -- measured at
  // 1440. The footer precedes the bar in the DOM, so no sibling selector can
  // see the bar's state: a class on the footer does.
  const strip=document.getElementById('mapstat'); if(strip) strip.classList.toggle('dome', domeMode);
  if(domeMode){ sizeCanvas(); kick(); }
  else if(raf!==null){ cancelAnimationFrame(raf); raf=null; }
}
viewBtn.onclick=()=>{ domeMode=!domeMode;
  localStorage.setItem('toise_viz_view',domeMode?'dome':'chart'); syncView(); };
const recentreBtn=document.getElementById('recentre');
recentreBtn.onclick=()=>{ yaw=0; pitch=0; fov=78*Math.PI/180; };
const driftBtn=document.getElementById('drift');
driftBtn.onclick=()=>{ drift=!drift; driftBtn.classList.toggle('on',drift); };
if(reduceMotion) driftBtn.title='Drift is off: this browser asks for reduced motion.';
const gridBtn=document.getElementById('grid');
gridBtn.onclick=()=>{ showGrid=!showGrid; gridBtn.classList.toggle('on',showGrid); };
window.addEventListener('resize',()=>{ if(domeMode) sizeCanvas(); });
document.addEventListener('visibilitychange',kick);
syncView();

(function(){ const rz=document.getElementById('resizer'), aside=document.getElementById('panel');
  const saved=parseInt(localStorage.getItem('toise_viz_aside')||'',10);
  if(saved>=280 && saved<=900) aside.style.width=saved+'px';
  let x0=0, w0=0, dragging=false;
  // Resize the canvas WITH the panel, but throttled to one redraw per animation frame
  // (rAF) — resizing on every raw mousemove froze the drag; letting CSS stretch the
  // canvas and only fixing it on release made it blink. rAF keeps it smooth.
  let raf=0;
  const redraw=()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0;
    try{ net.setSize('100%','100%'); net.redraw(); }catch(_){} }); };
  rz.addEventListener('mousedown',ev=>{ dragging=true; x0=ev.clientX; w0=aside.getBoundingClientRect().width;
    rz.classList.add('drag'); document.body.style.userSelect='none'; ev.preventDefault(); });
  window.addEventListener('mousemove',ev=>{ if(!dragging) return;
    aside.style.width=Math.max(280,Math.min(900, w0+(x0-ev.clientX)))+'px'; redraw(); });
  window.addEventListener('mouseup',()=>{ if(!dragging) return; dragging=false; rz.classList.remove('drag');
    document.body.style.userSelect=''; localStorage.setItem('toise_viz_aside', String(Math.round(aside.getBoundingClientRect().width))); redraw(); }); })();
watchCanvasSize();   // a grid computed from a height must notice the height changing
if (EMBEDDED) {
  listenForHighlight();   // the Dock can ask this map to light a set of entities
  // Hidden, not removed: the question panel's controls are wired further down.
  const askPanel = document.getElementById('ask');
  if (askPanel) askPanel.hidden = true;
  publishView();   // the Dock must have a context before the reader clicks anything
}
loadFull().then(fallback);
</script>
</body>
</html>
