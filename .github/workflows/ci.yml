name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main. Every merge shares the ref, so in a burst of merges each
  # one cancelled the previous one's run and only the last merged tree was ever
  # tested — which is how main went red on 2026-10-14 with six green branches
  # behind it: the branch checks passed, the merged tree did not, and nothing
  # looked at the difference. On a pull request superseding is still right: a
  # force-push means the previous tree no longer exists.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # pkg/emit is a nested module (ADR 0027): ./... from the root does not
      # reach it, so the SDK is built and tested in its own directory.
      - name: Build (pkg/emit module)
        working-directory: pkg/emit
        run: go build ./...

      - name: Test (pkg/emit module)
        working-directory: pkg/emit
        run: go test -race ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
