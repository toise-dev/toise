name: Republish image

# Manual republish of the GHCR container image for a given version, building
# from a ref (default main). Use it when the tag-triggered Release built the
# binaries but the image job failed (e.g. a Dockerfile fix landed after the
# tag): the Release workflow only fires on a tag and rebuilds the broken tree,
# so a clean image needs this out-of-band build from a fixed ref.
#
# Builds multi-arch and pushes ghcr.io/toise-dev/toise:<version> (plus :latest
# for a stable version, i.e. one without a "-" prerelease suffix).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, e.g. v0.7.0"
        required: true
      ref:
        description: "Git ref to build from (must contain a buildable Dockerfile)"
        required: false
        default: main

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tags="ghcr.io/toise-dev/toise:${VERSION}"
          # Only move :latest for a stable version (no "-" prerelease suffix).
          if [[ "${VERSION}" != *-* ]]; then
            tags="${tags}"$'\n'"ghcr.io/toise-dev/toise:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
