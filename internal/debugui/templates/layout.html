{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toise — {{.Title}}</title>
<style>
:root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --warn:#d29922; --ok:#3fb950; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
header { display:flex; align-items:center; gap:1rem; padding:.6rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
header .brand { font-weight:700; color:var(--fg); }
header .tag { color:var(--dim); font-size:12px; border:1px solid var(--line); border-radius:4px; padding:0 .35rem; }
header nav { display:flex; gap:1rem; margin-left:auto; }
main { padding:1rem; max-width:1100px; margin:0 auto; }
h1 { font-size:18px; margin:.2rem 0 1rem; }
h2 { font-size:14px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin:1.5rem 0 .5rem; }
table { border-collapse:collapse; width:100%; margin:.3rem 0 1rem; }
th,td { text-align:left; padding:.35rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--dim); font-weight:600; }
td.k { color:var(--dim); white-space:nowrap; }
.pill { display:inline-block; padding:0 .4rem; border:1px solid var(--line); border-radius:4px; font-size:12px; color:var(--dim); }
.pill.struct { color:var(--warn); border-color:var(--warn); }
.pill.del { color:var(--warn); border-color:var(--warn); }
.muted { color:var(--dim); }
.cards { display:flex; gap:.6rem; flex-wrap:wrap; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.6rem .9rem; min-width:8rem; }
.card .n { font-size:22px; font-weight:700; }
.card .l { color:var(--dim); font-size:12px; }
form.filter { display:flex; gap:.5rem; align-items:center; margin:.5rem 0 1rem; flex-wrap:wrap; }
input,select,button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:.3rem .5rem; font:inherit; }
button { cursor:pointer; }
code { color:var(--fg); }
.ct { color:var(--accent); }
.empty { color:var(--dim); padding:1rem 0; }
footer { color:var(--dim); padding:1rem; text-align:center; border-top:1px solid var(--line); margin-top:2rem; font-size:12px; }
</style>
</head>
<body>
<header>
<a href="/" class="brand">Toise</a><span class="tag">debug UI</span>
<nav>
<a href="/">Dashboard</a>
<a href="/entities">Entities</a>
<a href="/changes">Changes</a>
<a href="/playground">GraphQL</a>
</nav>
</header>
<main>{{end}}

{{define "foot"}}</main>
<footer>{{.Version}} · phase 1 · no authentication — trusted networks only</footer>
</body>
</html>{{end}}
