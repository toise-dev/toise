# golangci-lint configuration (schema v2).
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck # in v2 staticcheck also covers the former gosimple checks
    - unconvert
    - unused
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # Allow the occasional explanatory comment block without nagging.
        - commentFormatting
        # Domain types (Entity, Event, ...) use value receivers deliberately for
        # value semantics and to avoid mixing pointer/value receivers. They are
        # not on a proven hot path that warrants pointer receivers in phase 1.
        - hugeParam
    govet:
      enable:
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    # Presets replicate v1's default exclusions (v2 ships them off by default).
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files may favor readability over some lint rules.
      - path: _test\.go
        linters:
          - gocritic
          - prealloc

issues:
  # Keep the bootstrap friendly: surface everything rather than capping counts.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/toise-dev/toise
