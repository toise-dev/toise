syntax = "proto3";

package toise.v1;

option go_package = "github.com/toise-dev/toise/proto/toise/v1;toisev1";

// Value is a typed attribute value mirroring the OpenTelemetry AnyValue:
// the four scalars (string, int64, double, bool) plus recursive array and
// kvlist forms. Descriptive attributes (entity.description) carry the full
// AnyValue; identity values stay scalar by contract (ADR 0018). See ADR 0004.
message Value {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    // array_value and kvlist_value are wrapper messages because a oneof field
    // cannot itself be `repeated` (this mirrors OTLP's ArrayValue/KeyValueList).
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
  }
}

// ArrayValue is an ordered list of Values (the array AnyValue form).
message ArrayValue {
  repeated Value values = 1;
}

// KeyValueList is an ordered list of KeyValues (the kvlist/map AnyValue form).
message KeyValueList {
  repeated KeyValue values = 1;
}

// KeyValue is a single attribute.
message KeyValue {
  string key = 1;
  Value value = 2;
}

// ChangeType classifies an event per the Toise change taxonomy. See ADR 0006.
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_ENTITY_CREATED = 1;
  CHANGE_TYPE_ENTITY_DELETED = 2;
  CHANGE_TYPE_ENTITY_IDENTITY_CHANGED = 3;
  CHANGE_TYPE_ENTITY_ATTRIBUTE_UPDATED = 4;
  CHANGE_TYPE_ENTITY_STATE_CHANGED = 5;
  CHANGE_TYPE_ENTITY_UNCHANGED = 6;
  CHANGE_TYPE_RELATION_ADDED = 7;
  CHANGE_TYPE_RELATION_REMOVED = 8;
  CHANGE_TYPE_RELATION_ATTRIBUTE_CHANGED = 9;
}

// Entity is an infrastructure entity aligned with the OpenTelemetry entity data
// model. See ADR 0004 and ADR 0017.
message Entity {
  // entity_id is the stable logical ID (a ULID), assigned on first sight and
  // stable across identity changes. See ADR 0017.
  string entity_id = 1;
  // identity_hash is a deterministic hash (SHA-256, 128-bit, type-prefixed hex)
  // of the current identifying attributes. It changes when identity changes;
  // entity_id does not. See ADR 0017.
  string identity_hash = 2;
  // type is the entity type, e.g. "host", "process". See ADR 0004.
  string type = 3;
  // identity holds the identifying attributes (their values together identify
  // the entity).
  repeated KeyValue identity = 4;
  // attributes holds descriptive (non-identifying) attributes.
  repeated KeyValue attributes = 5;
  // schema_url versions the entity definition.
  string schema_url = 6;
}

// Relation is a typed directed edge between two entities. See ADR 0004.
message Relation {
  // relation_id is a deterministic hash of (type, from_entity_id, to_entity_id).
  string relation_id = 1;
  string type = 2;
  // from_entity_id and to_entity_id reference logical entity IDs.
  string from_entity_id = 3;
  string to_entity_id = 4;
  repeated KeyValue attributes = 5;
  // structural indicates the relation's appearance/disappearance is significant
  // (suitable for alerting) rather than merely descriptive.
  bool structural = 6;
}

// DeleteSource attributes the AUTHOR of a disappearance event: the producer
// (explicit delete, or an edge removed by absence on re-emit), Toise's liveness
// expiry (no heartbeat within entity.report.interval), or the cascade that
// removes incident edges when a node dies. It is consumer-authored provenance,
// deliberately distinct from delete_reason (which stays producer-supplied,
// verbatim): without it an expiry and a reason-less producer delete are
// indistinguishable on every read surface. UNSPECIFIED marks events written
// before this field existed — read it as "unknown", never as "producer".
enum DeleteSource {
  DELETE_SOURCE_UNSPECIFIED = 0;
  DELETE_SOURCE_PRODUCER = 1;
  DELETE_SOURCE_LIVENESS_EXPIRY = 2;
  DELETE_SOURCE_CASCADE = 3;
}

// EntityEvent is a classified change about an entity. Bi-temporal: see ADR 0005.
message EntityEvent {
  // event_id is a ULID identifying this event.
  string event_id = 1;
  ChangeType change_type = 2;
  Entity entity = 3;
  // event_time_unix_nano is when the fact became true in the real world,
  // provided by the producer.
  int64 event_time_unix_nano = 4;
  // recorded_at_unix_nano is when Toise recorded the event, set at ingestion.
  int64 recorded_at_unix_nano = 5;
  // schema_version is the Toise schema version, e.g. "1.0".
  string schema_version = 6;
  // changed_keys lists the attribute keys that changed, for
  // attribute_updated/state_changed events.
  repeated string changed_keys = 7;
  // delete_reason is the producer-supplied motive for an entity.delete
  // (entity.delete.reason), an OPEN enum (free string, never a closed set on
  // Toise's side). Empty for non-delete events and for deletes that carried no
  // reason. See the OTel entity-events spec (1.58.0).
  string delete_reason = 8;
  // delete_source attributes the author of an entity_deleted event. Only
  // meaningful on deletes; UNSPECIFIED elsewhere and on pre-1.1 events.
  DeleteSource delete_source = 9;
}

// RelationEvent is a classified change about a relation. Bi-temporal: ADR 0005.
message RelationEvent {
  string event_id = 1;
  ChangeType change_type = 2;
  Relation relation = 3;
  int64 event_time_unix_nano = 4;
  int64 recorded_at_unix_nano = 5;
  string schema_version = 6;
  repeated string changed_keys = 7;
  // delete_source attributes the author of a relation_removed event: an
  // explicit/absence removal by the producer, the cascade of a dying endpoint,
  // or a per-edge liveness expiry. Relations previously had NO discriminant at
  // all — the same relation_removed covered all three origins.
  DeleteSource delete_source = 8;
}

// Event is the envelope stored in the append-only event log.
message Event {
  oneof event {
    EntityEvent entity_event = 1;
    RelationEvent relation_event = 2;
  }
}
