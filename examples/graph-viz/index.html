<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toise — Graph</title>
<!--
  Example consumer of the Toise GraphQL API — NOT part of toise-server.
  A standalone, dependency-free page (vis-network from a CDN) that loads the
  entity/relation graph with a query and then streams live changes over the
  entityChanged / relationChanged subscriptions. See README.md.

  Endpoint: defaults to a same-origin /graphql (serve this file behind the same
  proxy as toise-server). Override with ?api=https://host:port/graphql.

  Labels: a header toggle switches node labels between human-readable names
  (host.name, service.name, interface.name, the listener's process, …) and the raw
  technical identities. The choice is remembered (localStorage).

  Inferred links (off by default): an optional overlay of dashed, derived edges that
  link each IP-bearing entity (a listener's bind address, an endpoint's
  server.address, a route's next hop) to the network.address node for that IP. The
  engine stores facts only and never merges by heuristic, so these are NOT stored
  relations — they are a consumer-side reading aid. Host-local addresses that are not
  global join points are skipped: wildcard, loopback, link-local, and the Docker
  default bridge (172.17.0.0/16) — the same 172.17.0.1 exists on every host.

  Attribute filter: the header "attr" box highlights nodes whose identity/attributes
  match (a key, key=value, or a free substring) and dims the rest — a read-time view
  over the fetched data, so it works on whatever attributes producers emit.

  Timeline (time travel): the bottom bar folds the graph to a past instant via the
  entities(asOf:) / relations(asOf:) event-time arguments — drag left to rewind, click
  LIVE (or drag back to now) to resume streaming. Live updates are ignored while
  browsing history so the past view stays put; a request before the retention horizon
  is refused and surfaced.

  Layout: the force simulation runs only until it stabilises, then FREEZES, so the
  graph settles once instead of drifting forever. A structural change (a node/edge
  added or removed) re-runs it briefly and re-freezes; attribute-only heartbeats never
  move it. "relayout" re-runs the layout on demand.

  Multi-tenancy (ADR 0025): pick a tenant with ?tenant=<id>. It is sent as the
  X-Scope-OrgID header on queries; for the live subscription (a browser can't set a
  header on a WebSocket) it is appended as ?tenant=, which a translating proxy maps
  to the header. Absent => the server's "default" tenant.
-->
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js" integrity="sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ" crossorigin="anonymous"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#c9d1d9;--dim:#8b949e;--accent:#58a6ff;--warn:#d29922;--ok:#3fb950;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
header .brand{font-weight:700;}
header .tag{color:var(--dim);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 .35rem;}
header nav{display:flex;gap:1rem;}
header a{color:var(--accent);text-decoration:none;}
header a:hover{text-decoration:underline;}
.stats{margin-left:auto;display:flex;gap:1rem;align-items:center;color:var(--dim);font-size:12px;flex-wrap:wrap;}
.stats b{color:var(--fg);}
#status{display:flex;align-items:center;gap:.35rem;}
#status i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dim);}
#status.live i{background:var(--ok);box-shadow:0 0 6px var(--ok);}
#status.poll i{background:var(--warn);}
#status.down i{background:#ff7b72;}
.pulse{animation:p 1.2s ease-out;}
@keyframes p{from{box-shadow:0 0 0 0 var(--accent);}to{box-shadow:0 0 0 14px rgba(88,166,255,0);}}
main{flex:1;display:flex;min-height:0;}
#net{flex:1;min-width:0;}
aside{width:320px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:.8rem;}
aside h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:.2rem 0 .6rem;}
aside table{border-collapse:collapse;width:100%;}
aside td{padding:.25rem .4rem;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word;}
aside td.k{color:var(--dim);white-space:nowrap;}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .8rem;padding:.5rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;}
.legend span{display:flex;align-items:center;gap:.3rem;cursor:pointer;opacity:.85;}
.legend span.off{opacity:.3;text-decoration:line-through;}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;}
.muted{color:var(--dim);}
.empty{color:var(--dim);padding:2rem;text-align:center;}
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:.2rem .5rem;font:inherit;cursor:pointer;}
#feed{font-size:11px;color:var(--dim);max-height:30vh;overflow:auto;margin-top:.4rem;}
#feed div{padding:.15rem 0;border-bottom:1px solid var(--line);}
#err{color:var(--warn);font-size:12px;}
.timeline{display:flex;align-items:center;gap:.7rem;padding:.35rem 1rem .45rem;background:var(--panel);border-top:1px solid var(--line);font-size:12px;}
.tlwrap{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px;}
/* change-density profile behind the ruler: darker = more changes; drag to zoom */
.tlprofile{position:relative;min-height:16px;cursor:crosshair;background:rgba(127,127,127,.05);border-radius:2px;overflow:hidden;}
.tlprofile .cell{position:absolute;}
.tlprofile .rowlab{position:absolute;left:2px;font-size:8px;line-height:8px;opacity:.9;pointer-events:none;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000;}
.tlprofile .brush{position:absolute;top:0;bottom:0;background:rgba(88,166,255,.22);border-left:1px solid var(--accent);border-right:1px solid var(--accent);pointer-events:none;}
.tlaxis{position:relative;height:24px;}
/* a real graduated ruler: flat baseline + major (labelled) and minor ticks */
.tlruler{position:absolute;left:0;right:0;bottom:0;height:24px;pointer-events:none;}
.tlruler .base{position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--line);}
.tlruler .tick{position:absolute;bottom:0;width:1px;background:var(--line);}
.tlruler .tick.min{height:5px;opacity:.55;}
.tlruler .tick.maj{height:10px;background:var(--dim);}
.tlruler .lab{position:absolute;bottom:12px;transform:translateX(-50%);font-size:10px;line-height:1;color:var(--dim);white-space:nowrap;}
/* the range input is the moving cursor over the ruler — a thin needle, no fill */
.tlwrap input[type=range]{position:absolute;left:0;bottom:0;width:100%;height:24px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;}
.tlwrap input[type=range]:focus{outline:none;}
.tlwrap input[type=range]::-webkit-slider-runnable-track{height:24px;background:transparent;border:none;}
.tlwrap input[type=range]::-moz-range-track{height:24px;background:transparent;}
.tlwrap input[type=range]::-moz-range-progress{height:24px;background:transparent;}
.tlwrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:24px;margin-top:0;background:var(--accent);border:none;border-radius:1px;box-shadow:0 0 5px var(--accent);}
.tlwrap input[type=range]::-moz-range-thumb{width:3px;height:24px;background:var(--accent);border:none;border-radius:1px;box-shadow:0 0 5px var(--accent);}
.timeline select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;padding:.05rem .2rem;}
#tlLive{color:var(--ok);border-color:var(--ok);}
#tlLive.hist{color:var(--warn);border-color:var(--warn);}
#tlPlay{width:2rem;text-align:center;}
#tlPlay.on{color:var(--accent);border-color:var(--accent);}
#tlLabel{min-width:12.5rem;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<header>
  <span class="brand">Toise</span><span class="tag">graph</span>
  <nav>
    <a href="/">Dashboard</a><a href="/entities">Entities</a><a href="/changes">Changes</a><a href="/playground">GraphQL</a>
  </nav>
  <div class="stats">
    <span id="err"></span>
    <span id="status"><i></i><span id="statusTxt">connecting…</span></span>
    <span><b id="nNodes">0</b> entities</span>
    <span><b id="nEdges">0</b> relations</span>
    <span id="matchStat" class="muted"></span>
    <label class="muted" for="attr">attr<input id="attr" spellcheck="false" autocomplete="off" placeholder="key or key=value" title="Highlight nodes whose identity/attributes match; dims the rest. e.g. service.criticality=critical, entity.owner.team, or a free substring." style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;padding:.1rem .35rem;width:11rem;margin-left:.3rem;"></label>
    <label class="muted" for="tn">tenant<input id="tn" spellcheck="false" autocomplete="off" placeholder="default" title="X-Scope-OrgID — sent as a header on queries and as ?tenant= on the subscription" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;padding:.1rem .35rem;width:8rem;margin-left:.3rem;"></label>
    <button id="labels" title="Toggle node labels: human-readable names vs technical ids">labels: names</button>
    <button id="inferred" title="Overlay derived (not stored) edges linking IP-bearing entities to their network.address hub">inferred: off</button>
    <button id="relayout" title="Re-run the force layout, then freeze it">relayout</button>
    <button id="resync">resync</button>
    <button id="fit">fit</button>
  </div>
</header>
<div class="legend" id="legend"></div>
<main>
  <div id="net"></div>
  <aside id="panel">
    <div class="empty">Click a node to inspect its identity &amp; attributes.</div>
    <h2 style="margin-top:1rem">Live feed</h2>
    <div id="feed"></div>
  </aside>
</main>
<footer class="timeline">
  <button id="tlLive" title="Jump back to the live view">● LIVE</button>
  <button id="tlPlay" title="Replay history forward from the cursor (fast-forward, like scrubbing a video)">▶</button>
  <select id="tlSpeed" title="Replay speed">
    <option value="10">1×</option><option value="35" selected>4×</option><option value="90">12×</option></select>
  <div class="tlwrap">
    <div class="tlprofile" id="tlProfile" title="Change density — darker means more changes. Drag across to zoom into that period."></div>
    <div class="tlaxis">
      <div class="tlruler" id="tlRuler"></div>
      <input type="range" id="tlRange" min="0" max="1000" value="1000" step="1"
        title="Drag left to view the topology as it was at a past instant (event-time). Far right = live.">
    </div>
  </div>
  <label class="muted">window <select id="tlWin">
    <option value="1h">1h</option><option value="6h">6h</option>
    <option value="24h">24h</option><option value="7d">7d</option></select></label>
  <span id="tlLabel">now</span>
</footer>
<script>
// GraphQL endpoint: same-origin /graphql by default; override with ?api=...
const params=new URLSearchParams(location.search);
const API=params.get('api')||'/graphql';
// Multi-tenancy: ?tenant=<id> -> X-Scope-OrgID header on queries, ?tenant= on the WS.
const TENANT=(params.get('tenant')||'').trim();
function withTenant(u){ if(!TENANT) return u; return u+(u.includes('?')?'&':'?')+'tenant='+encodeURIComponent(TENANT); }
function gqlHeaders(){ const h={'Content-Type':'application/json'}; if(TENANT) h['X-Scope-OrgID']=TENANT; return h; }
function wsURL(){ let u; try{ u=new URL(API,location.href); }catch{ u=new URL('/graphql',location.href); }
  u.protocol=(u.protocol==='https:'?'wss:':'ws:'); if(TENANT) u.searchParams.set('tenant',TENANT); return u.toString(); }

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PALETTE=["#58a6ff","#3fb950","#d29922","#bc8cff","#f778ba","#39c5cf","#ff7b72","#a5d6ff","#7ee787","#ffa657","#d2a8ff","#79c0ff"];
const typeColor={};
const colorFor=t=>{ if(!(t in typeColor)) typeColor[t]=PALETTE[Object.keys(typeColor).length%PALETTE.length]; return typeColor[t]; };
const hidden=new Set();
const ENT={}, REL={};
const nodes=new vis.DataSet(), edges=new vis.DataSet();
let fitted=false;

const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
  nodes:{shape:'dot',size:14,font:{color:'#c9d1d9',face:'ui-monospace, monospace',size:12,strokeWidth:3,strokeColor:'#0d1117'},borderWidth:2},
  edges:{color:{color:'#30363d',highlight:'#58a6ff'},font:{color:'#8b949e',size:10,strokeWidth:3,strokeColor:'#0d1117',align:'middle'},
         arrows:{to:{enabled:true,scaleFactor:.5}},smooth:{type:'dynamic'}},
  physics:{barnesHut:{gravitationalConstant:-9000,springLength:130,springConstant:.03,damping:.5},stabilization:{iterations:180}},
  interaction:{hover:true,tooltipDelay:120,multiselect:true}
});

// --- layout settling: run the force simulation only until it stabilises, then
// FREEZE it, so the graph stops drifting instead of jittering indefinitely (the
// "wait for it to stop moving" annoyance). A structural change (a node or edge
// added/removed) re-runs the simulation for a bounded window and freezes again;
// attribute-only updates (heartbeats) never disturb the layout. "relayout" re-runs
// it on demand.
let freezeTimer=null;
function freeze(){ clearTimeout(freezeTimer); freezeTimer=null; net.setOptions({physics:{enabled:false}}); }
function settle(ms=1600){ net.setOptions({physics:{enabled:true}}); clearTimeout(freezeTimer);
  freezeTimer=setTimeout(freeze, ms); }
net.on('stabilizationIterationsDone',freeze);   // initial layout done -> freeze

// Node labels: a toggle between human-readable names and raw technical ids.
// Identities are opaque (host.id is a UUID, a listener is <host-uuid>:port); name
// mode resolves the readable name each entity type actually carries. The tooltip
// always shows the full identity, so names never hide the precise id.
let labelMode=localStorage.getItem('toise_viz_labels')||'name';   // 'name' | 'id'
const attrsOf=n=>Object.fromEntries((n.attributes||[]).map(a=>[a.key,a.value]));
const identOf=n=>Object.fromEntries((n.identity||[]).map(a=>[a.key,a.value]));
function hostNameById(hid){ for(const e of Object.values(ENT)){ if(e.type==='host' && identOf(e)['host.id']===hid) return attrsOf(e)['host.name']; } return null; }

// --- inferred links (an optional, derived overlay; OFF by default) ----------
// The engine stores facts only and never merges by heuristic, so an IP carried as
// a plain attribute (a listener's bind address, an endpoint's server.address, a
// route's next hop) is NOT linked to the network.address entity for that IP — the
// same address ends up smeared across disconnected nodes. This overlay draws a
// dashed edge from each IP-bearing entity to the matching network.address node, so
// the graph reads as connected. These edges are DERIVED, not stored relations.
let inferred=localStorage.getItem('toise_viz_inferred')==='1';
const IPV4=/(?:^|[^0-9.])(\d{1,3}(?:\.\d{1,3}){3})(?![0-9.])/g;
// Host-local / non-routable addresses are NOT global join points: the same IP
// exists independently on every host, so linking through it smears unrelated nodes
// together (e.g. containers on different machines via the Docker bridge gateway
// 172.17.0.1). Skip wildcard, loopback, link-local (RFC 3927), and the Docker
// default bridge. (Other RFC 1918 ranges can be legitimately routable, so the real
// fix for a host-local address is producer-side — don't emit it as a shared entity.)
const notJoinable=ip=> !ip || ip==='0.0.0.0' || ip.startsWith('127.') || ip==='::' || ip==='::1'
  || ip.startsWith('169.254.')   // link-local
  || ip.startsWith('172.17.');   // Docker default bridge — same gateway on every host
function inferredEdges(visible){
  const addrByIp={};
  for(const n of Object.values(ENT)){ if(n.type==='network.address'){ const ip=identOf(n)['network.address']; if(ip) addrByIp[ip]=n.id; } }
  const real=new Set(); for(const r of Object.values(REL)){ real.add(r.fromId+'|'+r.toId); real.add(r.toId+'|'+r.fromId); }
  const out=[], seen=new Set();
  for(const n of Object.values(ENT)){
    if(n.type==='network.address' || !visible.has(n.id)) continue;
    const blob=[...(n.identity||[]),...(n.attributes||[])].map(a=>a.value).join(' ');
    const ips=new Set(); let m; IPV4.lastIndex=0; while((m=IPV4.exec(blob))) ips.add(m[1]);
    for(const ip of ips){ if(notJoinable(ip)) continue; const aid=addrByIp[ip];
      if(!aid || aid===n.id || !visible.has(aid) || real.has(n.id+'|'+aid)) continue;
      const id='inf:'+n.id+'~'+aid; if(seen.has(id)) continue; seen.add(id);
      out.push({id,from:n.id,to:aid,label:'≈',dashes:true,arrows:'',
                color:{color:'#d29922',opacity:0.65},font:{color:'#d29922',size:9},smooth:false}); }
  }
  return out;
}

// --- attribute filter: highlight matching nodes, dim the rest (exploratory) --
// Type a key (matches nodes carrying it), key=value (exact), or a free substring
// (matched against keys and values). It is a read-time view over the data already
// fetched — no query change — so it works on whatever attributes producers emit.
let attrQuery='';
function attrMatch(n){
  const q=attrQuery.trim().toLowerCase(); if(!q) return true;
  const kvs=[...(n.identity||[]),...(n.attributes||[])];
  const eq=q.indexOf('=');
  if(eq>=0){ const k=q.slice(0,eq).trim(), v=q.slice(eq+1).trim();
    return kvs.some(a=>a.key.toLowerCase()===k && (v===''||String(a.value).toLowerCase()===v)); }
  return kvs.some(a=>a.key.toLowerCase().includes(q) || String(a.value).toLowerCase().includes(q));
}

function idLabel(n){
  const id=(n.identity||[]);
  if(id.length){ const named=id.find(a=>/(^|\.)(name|id|endpoint|address)$/i.test(a.key));
    return (named?named.value:id.map(a=>a.value).join('·')).toString(); }
  return n.type+' '+n.id.slice(0,6);
}
function nameLabel(n){
  const A=attrsOf(n), I=identOf(n);
  switch(n.type){
    case 'host':              return A['host.name']||I['host.id'];
    case 'service.instance':  return A['service.name']||I['service.instance.id'];
    case 'network.interface': return I['interface.name']||idLabel(n);
    case 'network.address':   return I['network.address']||idLabel(n);
    case 'network.route':     return I['route.destination']||idLabel(n);
    case 'network.device':    return (I['network.device.id']||'').replace(/^(serial|engine|mac|name|mgmt):/i,'')||idLabel(n);
    case 'service.listener':{
      const ep=I['service.endpoint']||''; const m=ep.match(/^([0-9a-f-]{36}):(.+)$/i);
      const proc=A['process.executable.name'];
      if(proc) return proc+(m?' '+m[2]:'');
      return m?((hostNameById(m[1])||'')+':'+m[2]):ep;
    }
  }
  const nk=Object.keys(A).find(k=>/(^|\.)name$/i.test(k))||Object.keys(I).find(k=>/(^|\.)name$/i.test(k));
  return (nk&&(A[nk]||I[nk]))||idLabel(n);
}
function labelOf(n){ return (labelMode==='name'?nameLabel(n):idLabel(n))||n.id.slice(0,6); }
function titleOf(n){ const I=(n.identity||[]).map(a=>a.key+'='+a.value).join(', '); return n.type+(I?' · '+I:'')+' · '+n.id; }

let rebuildTimer=null;
function scheduleRebuild(){ if(rebuildTimer) return; rebuildTimer=setTimeout(()=>{rebuildTimer=null;rebuild();},250); }
function rebuild(){
  const prevNodeIds=new Set(nodes.getIds());
  const allTypes=new Set(), nodeIds=new Set(), nUp=[];
  const q=attrQuery.trim(); let matched=0;
  Object.values(ENT).forEach(n=>{ allTypes.add(n.type); if(hidden.has(n.type)) return; nodeIds.add(n.id);
    const ok=attrMatch(n); if(q&&ok) matched++;
    nUp.push({id:n.id,label:labelOf(n),title:titleOf(n),opacity:n.deleted?0.45:(q&&!ok?0.12:1),
              color:{background:colorFor(n.type),border:n.deleted?'#d29922':'#0d1117'}}); });
  nodes.update(nUp);
  const ms=document.getElementById('matchStat'); ms.textContent=q?('· '+matched+' match'):'';
  const ai=document.getElementById('attr'); if(ai) ai.style.color=(q&&matched===0)?'var(--warn)':'var(--fg)';
  nodes.getIds().forEach(id=>{ if(!nodeIds.has(id)) nodes.remove(id); });
  const edgeIds=new Set(), eUp=[];
  Object.values(REL).forEach(r=>{ if(nodeIds.has(r.fromId)&&nodeIds.has(r.toId)){ edgeIds.add(r.id);
    eUp.push({id:r.id,from:r.fromId,to:r.toId,label:r.type}); } });
  const realCount=edgeIds.size;
  if(inferred) inferredEdges(nodeIds).forEach(e=>{ if(!edgeIds.has(e.id)){ edgeIds.add(e.id); eUp.push(e); } });
  edges.update(eUp);
  edges.getIds().forEach(id=>{ if(!edgeIds.has(id)) edges.remove(id); });
  document.getElementById('nNodes').textContent=nodeIds.size;
  document.getElementById('nEdges').textContent=realCount+(inferred?' +'+(edgeIds.size-realCount)+' inferred':'');
  const leg=document.getElementById('legend'); leg.innerHTML='';
  if(inferred){ const s=document.createElement('span'); s.style.cursor='default'; s.style.opacity='.85';
    s.innerHTML='<i style="background:none;border-top:2px dashed #d29922;border-radius:0;height:0;width:14px"></i>inferred (derived, not stored)';
    leg.appendChild(s); }
  [...allTypes].sort().forEach(t=>{ const s=document.createElement('span'); s.className=hidden.has(t)?'off':'';
    s.innerHTML='<i style="background:'+colorFor(t)+'"></i>'+esc(t);
    s.onclick=()=>{ hidden.has(t)?hidden.delete(t):hidden.add(t); rebuild(); }; leg.appendChild(s); });
  // Re-run the layout only when the set of nodes changed (a node appeared or went
  // away), then freeze — never on a plain attribute/heartbeat update.
  let structural = nodeIds.size!==prevNodeIds.size;
  if(!structural){ for(const id of nodeIds){ if(!prevNodeIds.has(id)){ structural=true; break; } } }
  if(structural && fitted) settle();
  if(!fitted && nodeIds.size){ fitted=true; setTimeout(()=>net.fit({animation:false}),300); }
}

// The server caps every connection page at 200 items, so a single
// entities(first:N) returns at most 200 — loading one page renders a
// truncated, inconsistent graph above ~200 entities (orphan nodes whose
// host lives on a later page). Follow pageInfo.hasNextPage / endCursor to
// fetch the whole connection before rebuilding (#209).
const ENT_FIELDS='id type deleted identity{key value} attributes{key value}';
const REL_FIELDS='id type fromId toId';
async function fetchAll(conn,fields,asOf){
  const nodes=[]; let after=null, guard=0;
  const asArg=asOf?`, asOf:${JSON.stringify(asOf)}`:'';
  do{
    const q=`{ ${conn}(first:200${after?`, after:${JSON.stringify(after)}`:''}${asArg}){ edges{ node{ ${fields} } } pageInfo{ hasNextPage endCursor } } }`;
    const r=await fetch(withTenant(API),{method:'POST',headers:gqlHeaders(),credentials:'same-origin',body:JSON.stringify({query:q})});
    const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
    const c=j.data[conn];
    c.edges.forEach(e=>nodes.push(e.node));
    after=c.pageInfo.hasNextPage?c.pageInfo.endCursor:null;
  }while(after && ++guard<1000);
  return nodes;
}
async function loadFull(){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const [ents,rels]=await Promise.all([fetchAll('entities',ENT_FIELDS),fetchAll('relations',REL_FIELDS)]);
    for(const k in ENT) delete ENT[k]; for(const k in REL) delete REL[k];
    ents.forEach(n=>ENT[n.id]=n);
    rels.forEach(n=>REL[n.id]=n);
    rebuild();
  }catch(e){ err.textContent='⚠ '+e.message; }
}

// --- timeline: view the topology as-of a past instant (event-time) --------------
// Drag the slider left to fold the log up to an earlier moment via the GraphQL
// entities(asOf:)/relations(asOf:) time-travel arguments; the far right is live.
// While browsing history, live subscription updates are ignored so the past view
// stays put; "LIVE" (or dragging back to now) resumes streaming.
let historical=false;
const WINDOWS={'1h':3600e3,'6h':6*3600e3,'24h':86400e3,'7d':604800e3};
let tlWindow=localStorage.getItem('toise_viz_window')||'24h';
const tlRange=()=>document.getElementById('tlRange');

// Timeline span [start,end]. Live while spanEnd is null (end tracks "now"); a brush
// selection on the density profile zooms to an arbitrary past [start,end].
let spanEnd=null, spanMs=WINDOWS[tlWindow]||WINDOWS['24h'];
function spanBounds(){ const e=spanEnd?+spanEnd:Date.now(); return [e-spanMs,e]; }
const isLiveSpan=()=>spanEnd===null;
function tlInstant(){ const v=+tlRange().value; const [s,e]=spanBounds();
  if(isLiveSpan() && v>=1000) return null;
  return new Date(s+(e-s)*v/1000); }

// A graduated ruler with absolute time labels on "nice" round boundaries, so the
// scale stays meaningful at any window and when zoomed to a past period.
const _M=60000,_H=3600000,_D=86400000;
const NICE=[_M,2*_M,5*_M,10*_M,15*_M,30*_M,_H,2*_H,3*_H,6*_H,12*_H,_D,2*_D,7*_D];
function niceStep(W,target){ for(const s of NICE){ if(W/s<=target) return s; } return NICE[NICE.length-1]; }
const _p=n=>String(n).padStart(2,'0');
function fmtAbs(d,W){ const hm=_p(d.getHours())+':'+_p(d.getMinutes());
  if(W>2*_D) return _p(d.getDate())+'/'+_p(d.getMonth()+1);
  if(W>12*_H) return _p(d.getDate())+'/'+_p(d.getMonth()+1)+' '+hm;
  return hm; }
function renderRuler(){
  const el=document.getElementById('tlRuler'); if(!el) return; el.innerHTML='';
  const [s,e]=spanBounds(), W=e-s;
  const add=(cls,frac,txt)=>{ const d=document.createElement('div'); d.className=cls;
    d.style.left=(frac*100)+'%'; if(txt!=null) d.textContent=txt; el.appendChild(d); };
  add('base',0);
  const minor=niceStep(W,26); for(let t=Math.ceil(s/minor)*minor;t<=e;t+=minor) add('tick min',(t-s)/W);
  const major=Math.max(niceStep(W,6),minor);
  for(let t=Math.ceil(s/major)*major;t<=e;t+=major){ const f=(t-s)/W; add('tick maj',f); add('lab',f,fmtAbs(new Date(t),W)); }
}
// Zoom the timeline to a selected [a,b] period (ms since epoch).
function setSpan(a,b){ if(b-a<60000) return;
  spanMs=b-a; spanEnd=new Date(b); historical=true; tlRange().value=1000;
  document.getElementById('tlLabel').textContent=new Date(b).toLocaleString();
  document.getElementById('tlLive').classList.add('hist');
  renderRuler(); loadProfile();
  setStatus('poll','as-of '+new Date(b).toLocaleString()); loadAsOf(new Date(b).toISOString()); }

// --- change-density profile: a heatmap with one row per entity type, columns being
// slices of the span, cell colour = that type's colour, intensity = how many changes
// it saw — so which kind of thing churned, and when, jumps out. Built from the global
// recentChanges feed (heartbeats excluded); paged but rendered progressively as pages
// arrive so it fills in instead of blocking, and best-effort capped.
const PROFILE_BUCKETS=64, PROFILE_ROW=7;
let profileGen=0;
async function loadProfile(){
  const el=document.getElementById('tlProfile'); if(!el) return;
  const gen=++profileGen;   // supersede any in-flight profile load
  const [s,e]=spanBounds(); const durS=Math.max(1,Math.ceil((Date.now()-s)/1000));
  const grid=new Map();     // entity type -> counts[PROFILE_BUCKETS]
  const bump=(ty,i)=>{ let a=grid.get(ty); if(!a){ a=new Array(PROFILE_BUCKETS).fill(0); grid.set(ty,a); } a[i]++; };
  let after=null, guard=0;
  try{
    do{
      // MEANINGFUL entity changes only — heartbeats (entity.unchanged) are not changes
      // and would drown the signal; relation changes have no entity type, so skip them.
      const q=`{ recentChanges(window:${JSON.stringify(durS+'s')}, first:200${after?`, after:${JSON.stringify(after)}`:''}){ edges{ node{ eventTime changeType entity{ type } } } pageInfo{ hasNextPage endCursor } } }`;
      const r=await fetch(withTenant(API),{method:'POST',headers:gqlHeaders(),credentials:'same-origin',body:JSON.stringify({query:q})});
      const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message);
      if(gen!==profileGen) return;   // a newer load started; drop this one
      const c=j.data.recentChanges;
      for(const ed of c.edges){ const n=ed.node; if(n.changeType.endsWith('UNCHANGED') || !n.entity) continue;
        const t=Date.parse(n.eventTime);
        if(t>=s && t<=e){ const i=Math.min(PROFILE_BUCKETS-1,Math.floor((t-s)/(e-s)*PROFILE_BUCKETS)); bump(n.entity.type,i); } }
      after=c.pageInfo.hasNextPage?c.pageInfo.endCursor:null;
      if((guard&3)===0) renderProfile(grid);   // progressive fill (every 4 pages)
    }while(after && ++guard<40);
    if(gen===profileGen) renderProfile(grid);
  }catch(_){ /* the profile is a hint, not critical */ }
}
function renderProfile(grid){
  const el=document.getElementById('tlProfile'); if(!el) return;
  el.querySelectorAll('.cell,.rowlab').forEach(x=>x.remove());
  const types=[...grid.keys()].sort();
  el.style.height=Math.max(16,types.length*PROFILE_ROW)+'px';
  let max=1; for(const a of grid.values()) for(const v of a) if(v>max) max=v;
  types.forEach((ty,ri)=>{ const a=grid.get(ty), col=colorFor(ty);
    for(let i=0;i<a.length;i++){ if(!a[i]) continue; const d=document.createElement('div'); d.className='cell';
      d.style.left=(i/a.length*100)+'%'; d.style.width=(100/a.length+0.3)+'%';
      d.style.top=(ri*PROFILE_ROW)+'px'; d.style.height=(PROFILE_ROW-1)+'px';
      d.style.background=col; d.style.opacity=(0.22+0.78*(a[i]/max)).toFixed(2);
      d.title=ty+' · '+a[i]+' change'+(a[i]>1?'s':''); el.appendChild(d); }
    const lab=document.createElement('div'); lab.className='rowlab'; lab.textContent=ty;
    lab.style.top=(ri*PROFILE_ROW)+'px'; lab.style.color=col; el.appendChild(lab); });
}
// Immediate cursor readout: the exact timestamp under the handle, updated on every
// move so you always know where the cursor is; the as-of query stays debounced.
function updateCursorLabel(){
  const t=tlInstant(), lbl=document.getElementById('tlLabel'), live=document.getElementById('tlLive');
  if(!t){ lbl.textContent='now'; live.classList.remove('hist'); }
  else{ lbl.textContent=t.toLocaleString(); live.classList.add('hist'); }
}
async function loadAsOf(iso){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const [ents,rels]=await Promise.all([fetchAll('entities',ENT_FIELDS,iso),fetchAll('relations',REL_FIELDS,iso)]);
    for(const k in ENT) delete ENT[k]; for(const k in REL) delete REL[k];
    ents.forEach(n=>ENT[n.id]=n); rels.forEach(n=>REL[n.id]=n);
    rebuild(); settle();
  }catch(e){ err.textContent='⚠ '+e.message+' (before the retention horizon? drag toward now)'; }
}
function returnLive(){ playing=false; clearTimeout(playTimer); syncPlayBtn(); historical=false;
  spanEnd=null; spanMs=WINDOWS[tlWindow]||WINDOWS['24h']; tlRange().value=1000;
  document.getElementById('tlLabel').textContent='now';
  document.getElementById('tlLive').classList.remove('hist');
  renderRuler(); loadProfile();
  setStatus(acked?'live':'poll', acked?'live (ws)':'polling (ws off)');
  loadFull(); }
let tlTimer=null;
function onTimeline(){ clearTimeout(tlTimer); tlTimer=setTimeout(()=>{
  const t=tlInstant();
  if(!t){ returnLive(); return; }
  historical=true;
  document.getElementById('tlLabel').textContent=t.toLocaleString();
  document.getElementById('tlLive').classList.add('hist');
  setStatus('poll','as-of '+t.toLocaleString());
  loadAsOf(t.toISOString());
},180); }

// --- replay: play history forward from the cursor, fast-forwarding like scrubbing
// a video to hunt for a moment. Each frame nudges the cursor forward (by the speed)
// and loads that instant; frames wait for the query so the server is never flooded.
let playing=false, playTimer=null;
function syncPlayBtn(){ const b=document.getElementById('tlPlay');
  b.textContent=playing?'❚❚':'▶'; b.classList.toggle('on',playing); }
function pausePlay(){ playing=false; clearTimeout(playTimer); syncPlayBtn(); }
async function playFrame(){
  if(!playing) return;
  const v=+tlRange().value + (+document.getElementById('tlSpeed').value);
  if(v>=1000){ pausePlay(); returnLive(); return; }   // reached now -> resume live
  tlRange().value=v; historical=true;
  const t=tlInstant();
  document.getElementById('tlLive').classList.add('hist');
  document.getElementById('tlLabel').textContent=t.toLocaleString();
  setStatus('poll','▶ replay '+t.toLocaleString());
  await loadAsOf(t.toISOString());
  if(playing) playTimer=setTimeout(playFrame,250);
}
function play(){ if(playing) return;
  if(+tlRange().value>=1000) tlRange().value=0;   // at now -> start from the window's oldest edge
  playing=true; historical=true; syncPlayBtn(); playFrame(); }

function feed(txt){ const f=document.getElementById('feed'); if(!f) return; const d=document.createElement('div');
  d.textContent=new Date().toLocaleTimeString()+'  '+txt; f.prepend(d);
  while(f.childNodes.length>40) f.removeChild(f.lastChild); }
function flashStatus(){ const i=document.querySelector('#status i'); i.classList.remove('pulse'); void i.offsetWidth; i.classList.add('pulse'); }

function applyEntity(ce){ if(historical) return; const n=ce&&ce.entity; if(!n) return;
  if(ce.changeType==='ENTITY_DELETED') n.deleted=true;
  ENT[n.id]=n; scheduleRebuild();
  if(ce.changeType!=='ENTITY_UNCHANGED'){ feed(ce.changeType+'  '+n.type+' '+labelOf(n)); flashStatus(); } }
function applyRelation(ce){ if(historical) return; const r=ce&&ce.relation; if(!r) return;
  if(ce.changeType==='RELATION_DELETED') delete REL[r.id]; else REL[r.id]=r;
  scheduleRebuild();
  if(ce.changeType!=='RELATION_UNCHANGED'){ feed(ce.changeType+'  '+r.type); flashStatus(); } }

net.on('click',p=>{
  const panel=document.getElementById('panel');
  const head='<h2 style="margin-top:1rem">Live feed</h2><div id="feed"></div>';
  if(!p.nodes.length){ panel.innerHTML='<div class="empty">Click a node to inspect its identity &amp; attributes.</div>'+head; return; }
  const n=ENT[p.nodes[0]]; if(!n) return;
  const rows=a=>(a||[]).map(x=>'<tr><td class="k">'+esc(x.key)+'</td><td>'+esc(x.value)+'</td></tr>').join('')||'<tr><td class="muted" colspan=2>—</td></tr>';
  panel.innerHTML='<h2>'+esc(n.type)+(n.deleted?' <span class="muted">(deleted)</span>':'')+'</h2>'
    +'<h2>Identity</h2><table>'+rows(n.identity)+'</table>'
    +'<h2>Attributes</h2><table>'+rows(n.attributes)+'</table>'
    +'<h2>id</h2><div class="muted" style="word-break:break-all">'+esc(n.id)+'</div>'+head;
});

// Realtime: graphql-transport-ws subscriptions, with polling fallback.
const ENT_SUB='subscription{ entityChanged{ changeType entity{ id type deleted identity{key value} attributes{key value} } } }';
const REL_SUB='subscription{ relationChanged{ changeType relation{ id type fromId toId } } }';
let ws=null, pollTimer=null, retry=0, acked=false;
function setStatus(cls,txt){ const s=document.getElementById('status'); s.className=cls; document.getElementById('statusTxt').textContent=txt; }
function startPolling(){ if(!pollTimer) pollTimer=setInterval(loadFull,6000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function connect(){
  acked=false; setStatus('','connecting…');
  try{ ws=new WebSocket(wsURL(),'graphql-transport-ws'); }catch(e){ fallback(); return; }
  ws.onopen=()=>ws.send(JSON.stringify({type:'connection_init'}));
  ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    if(m.type==='connection_ack'){ acked=true; retry=0; stopPolling();
      ws.send(JSON.stringify({id:'ent',type:'subscribe',payload:{query:ENT_SUB}}));
      ws.send(JSON.stringify({id:'rel',type:'subscribe',payload:{query:REL_SUB}}));
      if(!historical){ setStatus('live','live (ws)'); loadFull(); } }
    else if(m.type==='ping'){ ws.send(JSON.stringify({type:'pong'})); }
    else if(m.type==='next'){ const d=m.payload&&m.payload.data; if(!d) return;
      if(d.entityChanged) applyEntity(d.entityChanged);
      if(d.relationChanged) applyRelation(d.relationChanged); }
    else if(m.type==='error'){ feed('subscription error'); }
  };
  ws.onclose=()=>{ if(acked) setStatus('down','reconnecting…'); else fallback(); scheduleReconnect(); };
  ws.onerror=()=>{ try{ws.close();}catch{} };
}
function fallback(){ setStatus('poll','polling (ws off)'); startPolling(); }
function scheduleReconnect(){ const wait=Math.min(2000*Math.pow(1.6,retry++),15000); if(!acked) startPolling(); setTimeout(connect,wait); }

const labelsBtn=document.getElementById('labels');
function syncLabelsBtn(){ labelsBtn.textContent='labels: '+(labelMode==='name'?'names':'ids'); }
syncLabelsBtn();
labelsBtn.onclick=()=>{ labelMode=(labelMode==='name'?'id':'name'); localStorage.setItem('toise_viz_labels',labelMode); syncLabelsBtn(); rebuild(); };
const inferredBtn=document.getElementById('inferred');
function syncInferredBtn(){ inferredBtn.textContent='inferred: '+(inferred?'on':'off'); inferredBtn.style.color=inferred?'#d29922':''; }
syncInferredBtn();
inferredBtn.onclick=()=>{ inferred=!inferred; localStorage.setItem('toise_viz_inferred',inferred?'1':'0'); syncInferredBtn(); rebuild(); };
const tnInput=document.getElementById('tn'); tnInput.value=TENANT;
tnInput.addEventListener('change',()=>{ const v=tnInput.value.trim(); const p=new URLSearchParams(location.search);
  if(v) p.set('tenant',v); else p.delete('tenant'); location.search=p.toString(); });
const attrInput=document.getElementById('attr');
attrInput.addEventListener('input',()=>{ attrQuery=attrInput.value; rebuild(); });
document.getElementById('resync').onclick=()=>{ loadProfile(); if(historical){ const t=tlInstant(); if(t){ loadAsOf(t.toISOString()); return; } } loadFull(); };
document.getElementById('fit').onclick=()=>net.fit({animation:true});
document.getElementById('relayout').onclick=()=>settle(2600);
const tlWin=document.getElementById('tlWin'); tlWin.value=tlWindow;
tlWin.onchange=()=>{ tlWindow=tlWin.value; localStorage.setItem('toise_viz_window',tlWindow);
  spanEnd=null; spanMs=WINDOWS[tlWindow]||WINDOWS['24h']; renderRuler(); loadProfile(); updateCursorLabel(); onTimeline(); };
tlRange().addEventListener('input',()=>{ if(playing) pausePlay(); updateCursorLabel(); onTimeline(); });
renderRuler(); syncPlayBtn(); loadProfile();
setInterval(()=>{ if(isLiveSpan() && !playing && !historical) loadProfile(); }, 60000);   // keep the live profile fresh
document.getElementById('tlLive').onclick=returnLive;
document.getElementById('tlPlay').onclick=()=>{ playing?pausePlay():play(); };
// Brush the density profile to zoom into a period.
(function(){ const strip=document.getElementById('tlProfile'); let x0=null, brush=null;
  const frac=ev=>{ const r=strip.getBoundingClientRect(); return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); };
  strip.addEventListener('mousedown',ev=>{ x0=frac(ev); brush=document.createElement('div'); brush.className='brush';
    brush.style.left=(x0*100)+'%'; brush.style.width='0'; strip.appendChild(brush); ev.preventDefault(); });
  window.addEventListener('mousemove',ev=>{ if(x0==null) return; const x=frac(ev), a=Math.min(x0,x), b=Math.max(x0,x);
    brush.style.left=(a*100)+'%'; brush.style.width=((b-a)*100)+'%'; });
  window.addEventListener('mouseup',ev=>{ if(x0==null) return; const x=frac(ev), a=Math.min(x0,x), b=Math.max(x0,x);
    if(brush){ brush.remove(); brush=null; } x0=null;
    if(b-a>0.02){ const [s,e]=spanBounds(), W=e-s; setSpan(s+a*W, s+b*W); } }); })();
loadFull().then(connect);
</script>
</body>
